<style>
  :root{
    --ink:#050505;
    --white:#f6f4ef;
    --dim:rgba(246,244,239,0.58);
    --dim-2:rgba(246,244,239,0.36);
    --line:rgba(246,244,239,0.16);
    --line-soft:rgba(246,244,239,0.09);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --dur-1:560ms;
    --ease:cubic-bezier(.19,1,.22,1);
    --font-display:'Newsreader', serif;
    --font-body:'Inter', sans-serif;
    --size-title: clamp(2.5rem, 5vw, 6rem);
    --size-desc:  clamp(0.95rem, 1.2vw, 1.25rem);
    --size-nav:   0.88rem;
    --size-meta:  0.75rem;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    overflow:hidden; /* .scroller (now holding hero + every scene) is the only thing that ever scrolls */
  }
  ::selection{ background:var(--white); color:var(--ink); }
  a{ color:inherit; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .meta{ font-family:var(--font-body); font-weight:500; letter-spacing:.18em; text-transform:uppercase; font-size:var(--size-meta); color:var(--dim-2); }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  .vignette{ position:fixed; inset:0; z-index:55; pointer-events:none; background:radial-gradient(130% 100% at 50% 100%, transparent 40%, rgba(0,0,0,.5) 100%); }

  /* Desktop scroll-nav: a pair of up/down arrow buttons for mouse/trackpad
     users, since wheel-driven scene advance (see setupWheelAdvance) can feel
     imprecise without a native scrollbar to grab. Hidden entirely on touch
     devices — .scroller's native momentum + scroll-snap already handles
     that case well, and the buttons would just be dead weight there.
     Gated on both a min-width AND (pointer:fine) so a wide touch tablet
     doesn't get controls it can't use as precisely as a mouse. */
  .scroll-nav{ display:none; }
  @media (min-width: 860px) and (pointer:fine){
    .scroll-nav{
      display:flex; flex-direction:column; gap:10px;
      position:fixed; z-index:50; right:calc(32px + var(--safe-r)); top:50%; transform:translateY(-50%);
      opacity:0; transition:opacity 700ms var(--ease);
    }
    .scroll-nav.show{ opacity:1; }
    .scroll-nav button{
      width:44px; height:44px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); background:rgba(5,5,5,.42);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      color:var(--white); transition:border-color 260ms var(--ease), background 260ms var(--ease), transform 160ms var(--ease), opacity 260ms var(--ease);
    }
    .scroll-nav button svg{ width:15px; height:15px; stroke:currentColor; transition:transform 220ms var(--ease); }
    .scroll-nav button:hover:not(:disabled){ border-color:var(--white); background:rgba(5,5,5,.62); }
    .scroll-nav button:hover:not(:disabled) svg{ transform:translateY(-2px); }
    .scroll-nav .scroll-down:hover:not(:disabled) svg{ transform:translateY(2px); }
    .scroll-nav button:active:not(:disabled){ transform:scale(.92); }
    .scroll-nav button:disabled{ opacity:.28; cursor:default; }
  }

  /* Category navigation — a single-line, horizontally swipeable bar
     (TikTok/Instagram-style category browsing). Hidden on the hero (shown
     via the same "show" trigger the scroll-nav arrows use) and never wraps
     to a second line — it scrolls horizontally instead, with the
     scrollbar hidden but the scroll behavior preserved for touch/trackpad. */
  .cat-nav{
    position:fixed; z-index:50; left:0; right:0; top:calc(24px + var(--safe-t));
    display:flex; gap:26px; overflow-x:auto; overflow-y:hidden;
    padding:0 calc(22px + var(--safe-l)) 6px calc(22px + var(--safe-l));
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    opacity:0; transition:opacity 700ms var(--ease); white-space:nowrap;
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-nav.show{ opacity:1; }
  .cat-nav.empty{ display:none; }
  .cat-btn{
    flex:0 0 auto; font-family:var(--font-body); font-weight:500; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim-2);
    padding:8px 1px; border-bottom:1px solid transparent;
    transition:color 260ms var(--ease), border-color 260ms var(--ease);
  }
  .cat-btn:hover{ color:var(--dim); }
  .cat-btn.active{ color:var(--white); border-color:var(--white); }
  .cat-btn:focus-visible{ outline:1px solid var(--white); outline-offset:3px; }
  @media (min-width:860px){
    .cat-nav{ justify-content:center; }
  }

  /* Language switcher for per-photo story translations (see tText() and
     SUPPORTED_LANGS in the JS). Bottom-left is the one fixed-position
     corner nothing else claims: .cat-nav owns the top, .scroll-nav the
     right-middle (desktop only), .toast bottom-center. Text-shadow gives
     it the same over-any-photo legibility as the watermark, without
     needing each scene's .scrim to account for it. */
  .lang-switch{
    position:fixed; z-index:52; left:calc(22px + var(--safe-l)); bottom:calc(20px + var(--safe-b));
    display:flex; align-items:center; gap:9px;
    font-family:var(--font-body); font-weight:500; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.7);
    opacity:0; pointer-events:none; transition:opacity 400ms var(--ease);
  }
  .lang-switch.show{ opacity:1; pointer-events:auto; }
  .lang-switch button{ color:var(--dim-2); padding:2px 0; border-bottom:1px solid transparent; transition:color 220ms var(--ease), border-color 220ms var(--ease); }
  .lang-switch button:hover{ color:var(--white); }
  .lang-switch button.active{ color:var(--white); border-color:var(--white); }
  .lang-divider{ color:var(--dim-2); opacity:.5; }

  /* The block below is vertically centered, but not within the full
     viewport — .hero reserves real weight at the bottom for the pinned
     .hero-contact strip (see its own comment further down) via a much
     larger bottom padding than top padding. Centering inside that
     shrunk box is what gives the "optical" balance the brief asked for.

     The math: since .hero-inner is the only in-flow child (backdrop,
     scrim and the contact strip are all position:absolute), the total
     "dead" space above and below the content is fixed by viewport
     height minus content height minus the contact strip's own
     reserved zone — padding-bottom only controls how that fixed total
     is SPLIT between the gap above the name and the gap between the
     CTA and the contact row, it can't shrink the total. So this value
     is deliberately weighted heavily toward the bottom split: most of
     the leftover space ends up as the (intentional, per the brief's
     own diagram) larger gap between "Enter Gallery" and the contact
     row, while the gap above the name shrinks to a modest one. Scales
     with viewport height (vh) so it stays roughly proportional on any
     screen; the short-viewport rules further down already compress the
     content's own internal margins, so the two adjustments don't fight
     each other. */
  .hero{ height:100vh; height:100dvh; height:100svh; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(50px + var(--safe-b)); background:var(--ink); scroll-snap-align:start; scroll-snap-stop:always; }
  /* Laptop/desktop only: nudge the hero text block up slightly by shifting
     the padding balance (more on top, less on bottom) — justify-content:center
     centers within the padded box, so this moves the visual center upward
     without touching the mobile layout. */
  @media (min-width: 860px){
    .hero{ padding-top:calc(24px + var(--safe-t)); padding-bottom:calc(140px + var(--safe-b)); }
  }
  /* Same reveal treatment as .scene / .finale photos: blurred, desaturated
     and darkened at rest, clearing once .in-view is added. Uses cover (not
     contain) since this is a full-bleed backdrop, not a letterboxed frame,
     so there's no letterbox edge to hide and no scale-up trick is needed. */
  .hero-backdrop{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
  .hero-backdrop img{ width:100%; height:100%; object-fit:cover; object-position:center; opacity:0; filter:blur(6px) grayscale(.32) brightness(.6); transition:opacity 1100ms var(--ease), filter 1600ms var(--ease); -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  .hero-backdrop.in-view img{ opacity:1; filter:blur(0) grayscale(.18) brightness(.8); }
  .hero-scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(5,5,5,.32) 0%, rgba(5,5,5,.4) 46%, rgba(5,5,5,.86) 100%); pointer-events:none; }
  .hero-inner{ position:relative; z-index:2; max-width:820px; }
  /* Staggered fade-and-rise entrance, matching the considered reveal every
     scene already gets (see .scene .tag / h2 / p.caption below) — the hero
     text used to just snap into view with none of that. */
  .hero-inner > *{ opacity:0; transform:translateY(18px); transition:opacity 900ms var(--ease), transform 900ms var(--ease); }
  .hero.ready .hero-inner > *{ opacity:1; transform:translateY(0); }
  .hero.ready .hero-inner > *:nth-child(2){ transition-delay:0ms; }
  .hero.ready .hero-inner > *:nth-child(3){ transition-delay:160ms; }
  .hero.ready .hero-inner > *:nth-child(4){ transition-delay:340ms; }
  .hero.ready .hero-inner > *:nth-child(5){ transition-delay:480ms; }
  .hero.ready .hero-inner > *:nth-child(6){ transition-delay:600ms; }
  /* Hero text order is: location headline + count phrase, "By", signature
     (name). Both hero-place and hero-count wrap naturally on narrow phones
     rather than forcing a single tight line.

     Spacing below is deliberately asymmetric rather than one repeated
     value: "By" sits tight against the signature since together they read
     as a single primary unit (the name), then the gap widens noticeably
     before the role line (secondary), and widens again — more than any
     other gap — before the CTA (tertiary), so the composition reads as
     distinct layers rather than one centered stack of text. */
  .hero-kicker{ margin-bottom:clamp(30px, 5.6vw, 60px); }
  .hero-place{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:clamp(1.9rem, 5vw, 2.7rem); line-height:1.1; color:var(--white); margin:0 0 10px; }
  .hero-count{ font-family:var(--font-body); font-style:normal; font-weight:400; font-size:.82rem; letter-spacing:.16em; text-transform:uppercase; line-height:1.5; color:var(--dim); margin:0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .hero .by-line{ font-family:var(--font-display); font-style:italic; font-weight:400; font-size:clamp(1.3rem, 2.8vw, 1.7rem); letter-spacing:.01em; text-transform:none; color:rgba(246,244,239,.85); margin:0 0 clamp(12px, 2vw, 18px); }
  .signature-wrap{ margin:0 0 clamp(44px, 7.8vw, 84px); display:flex; justify-content:center; }
  .signature-svg{ width:min(90vw, 700px); height:auto; display:block; overflow:visible; }
  .signature-svg text{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:92px; fill:var(--white); fill-opacity:0; stroke:var(--white); stroke-width:1.4; stroke-linejoin:round; paint-order:stroke fill; }
  .signature-svg text.filled{ transition:fill-opacity 1100ms var(--ease); fill-opacity:1; }
  .hero-role{ font-family:var(--font-body); font-weight:400; font-size:.82rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0 0 clamp(52px, 9.6vw, 108px); }
  @media (max-width:430px){
    .hero-place{ font-size:1.5rem; }
    .hero-count{ font-size:.7rem; letter-spacing:.12em; }
    .hero .by-line{ font-size:1.2rem; }
    .hero-role{ font-size:.7rem; letter-spacing:.12em; }
  }
  .enter{ display:inline-flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.16em; text-transform:uppercase; color:var(--white); padding:6px; border-bottom:1px solid transparent; transition:border-color 300ms var(--ease), opacity 900ms var(--ease), transform 900ms var(--ease); }
  .enter:hover{ border-color:var(--line); }
  .enter .arrow-line{ width:1px; height:34px; background:var(--line); position:relative; overflow:hidden; }
  .enter .arrow-line::after{ content:""; position:absolute; left:0; top:-100%; width:100%; height:100%; background:var(--white); animation:drip 2.4s var(--ease) infinite; }
  @keyframes drip{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }

  /* Hero-only "scroll to enter" cue — a tall glowing line + chevron that
     stretches down to fill the gap between the button and .hero-contact,
     instead of the small 34px tick mark that used to leave that space
     looking unfinished. Scoped under .hero (rather than changing .enter/
     .arrow-line themselves) so the compact version used by the
     "Continue Exploring" card between categories — rendered outside the
     hero — is completely untouched.
     The line itself is now two layers: ::before is the thin static wire
     (same look as before, just fading out toward the bottom), ::after is
     a soft blurred streak of light that travels down it — this is why
     .arrow-line's own width grows to 20px (an invisible track so that
     glow has room to breathe) while the visible wire stays 1px via
     ::before. The chevron below reinforces the "go down" direction with
     a gentle, independent breathing pulse. */
  .hero .enter{ gap:18px; }
  .hero .enter .arrow-line{ width:20px; height:clamp(64px, 15vh, 190px); background:none; }
  .hero .enter .arrow-line::before{
    content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%);
    background:linear-gradient(to bottom, var(--line) 0%, var(--line) 72%, transparent 100%);
  }
  .hero .enter .arrow-line::after{
    left:50%; top:-30%; width:3px; height:30%; transform:translateX(-50%);
    background:linear-gradient(to bottom, transparent 0%, var(--white) 50%, transparent 100%);
    box-shadow:0 0 7px 1px rgba(255,255,255,.5);
    animation:heroDrip 3.2s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes heroDrip{
    0%{ top:-30%; opacity:0; }
    12%{ opacity:1; }
    82%{ opacity:1; }
    100%{ top:100%; opacity:0; }
  }
  .hero .enter .arrow-chevron{
    width:14px; height:auto; margin-top:-6px;
    fill:none; stroke:var(--dim); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
    animation:heroChevronPulse 2.6s var(--ease) infinite;
  }
  @keyframes heroChevronPulse{
    0%, 100%{ opacity:.4; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(4px); }
  }
  @media (max-width: 480px){
    .hero .enter .arrow-line{ height:clamp(48px, 12vh, 120px); }
  }

  /* Short viewports (a laptop browser window, not a phone — this is a
     height query, the max-width:430px rules above are a separate, phone-
     width-only concern) can't fit the hero's full desktop-sized vertical
     rhythm: the centered text stack was tall enough to push "Enter
     Gallery" down into the social/contact row pinned near the bottom.
     Tightening the stack's own margins here reclaims that room instead of
     moving .hero-contact again, so its clearance from .lang-switch (see
     above) is untouched. */
  @media (max-height:820px){
    .hero-kicker{ margin-bottom:16px; }
    .hero-place{ margin-bottom:6px; }
    .hero .by-line{ margin-bottom:10px; }
    .signature-wrap{ margin-bottom:16px; }
    .signature-svg{ width:min(64vw, 480px); }
    .hero-role{ margin-bottom:20px; }
    .enter{ gap:10px; }
    .enter .arrow-line{ height:20px; }
  }
  @media (max-height:660px){
    .hero-kicker{ margin-bottom:10px; }
    .signature-wrap{ margin-bottom:10px; }
    .signature-svg{ width:min(56vw, 380px); }
    .hero-role{ margin-bottom:14px; }
    .enter{ gap:8px; }
    .enter .arrow-line{ height:14px; }
  }

  /* Quiet contact/social strip pinned near the bottom of the hero — kept
     absolutely positioned so it never affects the vertical centering of
     .hero-inner above it. Hidden entirely (via .has-content) whenever no
     contact fields are configured in the About admin tab, so an unfilled
     site shows nothing here rather than empty separators. Lifted well
     clear of .lang-switch (fixed at the very bottom-left, see above) so
     the two never crowd each other. */
  .hero-contact{ position:absolute; left:0; right:0; bottom:calc(58px + var(--safe-b)); z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 24px; opacity:0; pointer-events:none; transition:opacity 900ms var(--ease); transition-delay:520ms; }
  .hero.ready .hero-contact.has-content{ opacity:1; pointer-events:auto; }
  .hero-contact-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; }
  .hero-contact-row .dot{ color:var(--dim-2); font-size:.68rem; padding:0 2px; user-select:none; }
  .hero-contact a{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; font-family:var(--font-body); font-weight:400; font-size:.7rem; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); padding:6px 10px; border-bottom:1px solid transparent; transition:color 260ms var(--ease), border-color 260ms var(--ease); }
  .hero-contact a:hover, .hero-contact a:focus-visible{ color:var(--white); border-color:var(--line); }
  .hero-contact a:focus-visible{ outline:none; }
  @media (max-width:430px){
    .hero-contact{ bottom:calc(50px + var(--safe-b)); }
    .hero-contact a{ font-size:.66rem; padding:6px 8px; }
  }

  /* The hidden admin gesture's real target (10 taps/clicks within 2s —
     see the JS). Deliberately styled as inert decorative text, not a
     control: no cursor change, no :hover/:active/:focus rule of any
     kind, no underline, nothing that would visually suggest it responds
     to anything. It sits in its own bottom-right corner, independent of
     the centered .hero-contact row, so it never gets swept up by
     :hover/click handling meant for the actual social/contact links. */
  .hero-mark{ position:absolute; z-index:3; right:calc(22px + var(--safe-r)); bottom:calc(22px + var(--safe-b)); font-family:var(--font-display); font-style:italic; font-weight:500; font-size:.85rem; letter-spacing:.02em; color:var(--dim); opacity:.65; user-select:none; }
  @media (max-width:430px){
    .hero-mark{ font-size:.76rem; right:calc(18px + var(--safe-r)); bottom:calc(18px + var(--safe-b)); }
  }

  /* mandatory ensures every scroll gesture always comes to rest on a full
     scene — never half-way between two — even on a soft swipe or a
     trackpad flick that doesn't carry quite enough momentum to clear the
     midpoint on its own. Desktop wheel input is additionally handled by
     JS (see setupWheelAdvance) since trackpads/mice don't have native
     momentum-to-snap behavior at all. */
  .scroller{ height:100vh; height:100dvh; height:100svh; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
  .scroller::-webkit-scrollbar{ display:none; }
  /* Used only when the initial load might land somewhere other than the
     hero (a /work/ or /category/ URL, or a returning visitor's saved
     position) — see the "route gate" set up right before animateHeroEntrance
     and released at the end of applyInitialRoute(). Keeps the hero from
     ever flashing into view (fully animated in) only to be yanked away a
     moment later once the async photo fetch resolves and the real target
     is known. visibility (not opacity) so layout/scroll math and the
     IntersectionObservers set up during this window still work normally —
     body's own var(--ink) background shows through, so this is a brief
     dark screen rather than a flash of white. Never applied on a plain
     first visit to the root URL, so the common case is completely
     unaffected. */
  .scroller.route-pending{ visibility:hidden; }
  .scene{ position:relative; height:100vh; height:100dvh; height:100svh; width:100%; scroll-snap-align:start; scroll-snap-stop:normal; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:calc(22px + var(--safe-t)) 22px calc(22px + var(--safe-b)); background:var(--ink); }
  .scene .frame-img{ position:relative; width:100%; flex:1 1 auto; min-height:34vh; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:manipulation; }
  /* .wm-frame sits between .frame-img (the full flex slot the photo is
     centered in) and the <img> itself. It carries the SAME aspect-ratio as
     the photo (set inline per-photo, falling back to 3/4) plus max-width/
     max-height:100%, which makes the browser size it exactly the way it
     sizes a replaced element (like the <img> used to be sized on its own):
     as large as possible without exceeding either dimension of .frame-img.
     The upshot is .wm-frame's box == the photo's actual rendered box, with
     zero letterbox gap — unlike .frame-img, whose own box is the full
     flex slot and can be much taller/wider than the photo once object-fit
     contain has letterboxed it. That mismatch (container box vs. real
     photo box) is what let the watermark drift away from the visible
     photo edge on some screens/aspect ratios; anchoring the watermark to
     .wm-frame instead fixes it consistently across phone/tablet/desktop. */
  .scene .frame-img .wm-frame{
    position:relative; max-width:100%; max-height:100%; aspect-ratio:3/4; overflow:hidden;
    /* Redesigned as a single overhead spotlight, not a 4-sided rim: a
       crisp hairline exactly at the photo's top edge (where a real light
       fixture's edge would sit), plus a tight soft falloff right below
       it. The wider, radial part of the spotlight (the actual "wash" that
       tapers toward the corners, brightest dead-center) lives in
       .frame-wash below — a sibling of .frame-img, not nested in here,
       since a true radial cone needs a gradient shape box-shadow can't
       produce, and anything nested in .wm-frame gets cut off by the
       overflow:hidden above the instant it extends past the photo's own
       box. This box-shadow stays because it's on .wm-frame itself —
       overflow:hidden only clips a DESCENDANT's box-shadow, never the
       element's own. */
    box-shadow:
      0 -1px 0 0 rgba(255,250,240,0),
      0 -6px 13px 0 rgba(255,244,224,0);
    transition:box-shadow 900ms var(--ease);
  }
  .scene.in-view .frame-img .wm-frame{

      0 -6px 13px 0 rgba(255,244,224,.12);

  /* The actual spotlight "wash" — a wide, soft radial cone in the space

     corners (a true radial gradient, unlike the uniform box-shadow above
     — a real overhead light doesn't illuminate a rectangle evenly, it
     falls off toward the edges). A sibling of .frame-img rather than
     nested inside it or .wm-frame, so it isn't clipped by either one's
     overflow:hidden the moment it extends past the photo's own box.
     .scene itself has no horizontal inset, so left:0/right:0 here already
     reaches the true screen edges. Vertical placement — flush against the
     photo's real top edge, not the taller flex slot around it — is
     computed once in JS via positionFrameGlow(), right before the
     .in-view class below fades it in, rather than tracked continuously
     during scroll (which is what caused the original flicker). */

  /* Photo protection, scoped to the photos themselves — not the whole
     page — so captions, the contact email and every other text on the
     site stay normally selectable and clickable. This is friction, not a
     lock: it stops the average right-click/long-press save, nothing more.
     Screenshots, screen recordings and photos-of-the-screen can't be
     blocked by any website; the watermark is what actually survives

  /* Watermark system — used to live here as a `.wm-frame::after` CSS

     upload time (see processImageForUpload / drawWatermarkOnCanvas in

  .assign-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; max-height:56vh; overflow-y:auto; padding:2px; margin-bottom:16px; }
  .assign-thumb{ position:relative; display:block; aspect-ratio:2/3; border:2px solid transparent; cursor:pointer; overflow:hidden; background:#1a1a1a; }
  .assign-thumb img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.65; transition:opacity 160ms var(--ease); }

  .assign-thumb input{ position:absolute; top:6px; left:6px; z-index:2; accent-color:var(--white); }
  .assign-thumb-status{ position:absolute; top:6px; right:6px; font-size:.6rem; letter-spacing:.03em; text-transform:uppercase; padding:2px 6px; background:rgba(0,0,0,.6); }
  .assign-thumb-status.on{ color:#8de08d; } .assign-thumb-status.off{ color:var(--dim-2); }
  .assign-thumb-title{ position:absolute; left:0; right:0; bottom:0; padding:5px 6px; font-size:.66rem; background:linear-gradient(transparent, rgba(0,0,0,.85)); color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .admin-row.cat-row{ grid-template-columns:1fr 90px 210px; }
  .admin-uploading{ font-size:.72rem; color:var(--dim); }
  .upload-progress{ display:flex; flex-direction:column; gap:5px; margin-top:6px; max-width:280px; }
  .upload-progress-stage{ font-size:.72rem; letter-spacing:.04em; color:var(--dim); display:flex; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums; }
  .upload-progress-stage .pct{ color:var(--white); }
  .upload-progress-track{ width:100%; height:5px; background:#1c1c1c; border:1px solid var(--line); border-radius:3px; overflow:hidden; position:relative; }
  .upload-progress-fill{ height:100%; width:0%; background:var(--white); transition:width 120ms linear; }
  .upload-progress-fill.indeterminate{ width:35%; animation:uploadIndeterminate 1.1s ease-in-out infinite; }
  @keyframes uploadIndeterminate{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(285%); } }
  .upload-progress-substeps{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.66rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim-2); }
  .upload-progress-substeps .step{ opacity:.45; }
  .upload-progress-substeps .step.active{ opacity:1; color:var(--white); }
  .upload-progress-substeps .step.done{ opacity:.85; color:#8de08d; }
  .upload-progress-stage.complete .pct{ color:#8de08d; }
  .bulk-panel{ border:1px solid var(--line); padding:16px 18px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px; }
  .bulk-panel h4{ margin:0; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1rem; }
  .bulk-summary{ display:flex; justify-content:space-between; align-items:center; font-size:.74rem; color:var(--dim); font-variant-numeric:tabular-nums; }
  .bulk-summary .overall-pct{ color:var(--white); }
  .bulk-totals{ font-size:.74rem; color:var(--dim); font-variant-numeric:tabular-nums; }
  .bulk-totals .opt-after{ color:var(--white); }
  .bulk-totals .opt-reduction{ color:#8de08d; font-weight:500; }
  .bulk-summary-track{ width:100%; height:5px; background:#1c1c1c; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .bulk-summary-fill{ height:100%; width:0%; background:var(--white); transition:width 150ms linear; }
  .bulk-list{ display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto; }
  .bulk-item{ display:flex; flex-direction:column; gap:5px; border-bottom:1px solid var(--line); padding-bottom:9px; }
  .bulk-item:last-child{ border-bottom:none; padding-bottom:0; }
  .bulk-item-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.76rem; }
  .bulk-item-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--white); }
  .bulk-item-status{ font-size:.68rem; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bulk-item-status.done{ color:#8de08d; }
  .bulk-item-status.error{ color:#e08d8d; }
  .bulk-item-track{ width:100%; height:4px; background:#1c1c1c; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .bulk-item-fill{ height:100%; width:0%; background:var(--white); transition:width 120ms linear; }
  .bulk-item-fill.indeterminate{ width:30%; animation:uploadIndeterminate 1.1s ease-in-out infinite; }
  .bulk-item-fill.done{ background:#8de08d; width:100%!important; }
  .bulk-item-fill.error{ background:#e08d8d; width:100%!important; }
  .bulk-item-error{ font-size:.68rem; color:#e08d8d; }
  .bulk-item-size{ font-size:.68rem; color:var(--dim-2); font-variant-numeric:tabular-nums; }
  .bulk-item-size .after{ color:var(--white); }
  .bulk-item-size .pct{ color:#8de08d; }
  .bulk-item-retry{ font-size:.66rem; letter-spacing:.03em; text-transform:uppercase; color:var(--white); border:1px solid var(--line); padding:3px 9px; align-self:flex-start; }
  .bulk-item-retry:hover{ border-color:var(--white); }
  .bulk-panel-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .admin-optimize-result{ font-size:.74rem; line-height:1.6; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:8px 11px; margin-top:8px; font-variant-numeric:tabular-nums; }
  .admin-optimize-result .opt-before{ color:var(--dim-2); }
  .admin-optimize-result .opt-arrow{ color:var(--dim-2); }
  .admin-optimize-result .opt-after{ color:var(--white); }
  .admin-optimize-result .opt-reduction{ color:#8de08d; font-weight:500; margin-top:2px; }
  .admin-optimize-result .opt-note{ color:var(--dim-2); font-style:italic; }
  .admin-empty{ padding:34px; text-align:center; color:var(--dim-2); font-size:.85rem; }

  /* Grid/List view switcher (item 10) + inline title editing (item 12),
     used by both views. Grid is for visual scanning — spotting a wrong
     photo, a duplicate, a bad crop, at a glance — not for reordering;
     drag-reorder stays a List-view feature exactly as it already was. */
  .view-switch{ display:flex; border:1px solid var(--line); }
  .view-switch button{ font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); padding:6px 14px; }
  .view-switch button.active{ color:var(--ink); background:var(--white); }
  .row-title-input, .grid-title-input{ background:transparent; border:none; border-bottom:1px solid transparent; color:var(--white); font:inherit; font-weight:600; padding:0 0 1px; width:100%; }
  .row-title-input:hover, .grid-title-input:hover{ border-bottom-color:var(--line); }
  .row-title-input:focus, .grid-title-input:focus{ border-bottom-color:var(--white); }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .grid-card{ border:1px solid var(--line); background:#0c0c0c; position:relative; }
  .grid-card.row-checked{ border-color:var(--white); }
  .grid-thumb-wrap{ position:relative; aspect-ratio:1/1; background:#1a1a1a; overflow:hidden; }
  .grid-thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .grid-select{ position:absolute; top:8px; left:8px; z-index:2; accent-color:var(--white); width:16px; height:16px; }
  .grid-badges{ position:absolute; top:8px; right:8px; z-index:2; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .grid-badge{ font-size:.6rem; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; background:rgba(0,0,0,.65); }
  .grid-badge.on{ color:#8de08d; } .grid-badge.off{ color:var(--dim-2); }
  .grid-badge.featured{ color:#e0c98d; }
  .grid-body{ padding:9px 10px; display:flex; flex-direction:column; gap:5px; }
  .grid-body .sub{ font-size:.68rem; color:var(--dim-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .grid-actions button{ font-size:.64rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); }
  .grid-actions button:hover{ color:var(--white); }

  /* Drag & drop / paste upload target — see wireUploadDropzone(). Sits
     alongside the existing buttons, never replaces them; every file that
     arrives through it goes through the exact same beginBulkFilesSelected()
     entry point the file-picker input already used. */
  .upload-dropzone{ border:1px dashed var(--line); padding:18px; text-align:center; color:var(--dim-2); font-size:.78rem; letter-spacing:.02em; margin-bottom:16px; transition:border-color 150ms var(--ease), color 150ms var(--ease), background 150ms var(--ease); }
  .upload-dropzone.drag-over{ border-color:var(--white); color:var(--white); background:rgba(255,255,255,.04); }

  /* Quick Review grid — shown automatically right after a clean bulk
     upload finishes (see processBulkItem), instead of dropping the admin
     back on the plain list. Card layout intentionally mirrors .assign-grid
     (same thumbnail-first, grid-of-cards feel) but each card carries its
     own small edit form so title/category/tags/location/date can be
     fixed without opening the full editor — see wireReviewGrid(). */
  .review-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .review-header h3{ margin:0 0 4px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1.05rem; }
  .review-header .sub{ max-width:60ch; }
  .review-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .review-card{ border:1px solid var(--line); display:flex; flex-direction:column; background:#0c0c0c; }
  .review-thumb{ width:100%; aspect-ratio:4/3; background:#1a1a1a; overflow:hidden; }
  .review-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .review-fields{ display:flex; flex-direction:column; gap:8px; padding:12px; }
  .review-fields input[type="text"], .review-fields input[type="date"], .review-fields select{
    background:#151515; border:1px solid var(--line); color:var(--white); padding:7px 9px; font-family:var(--font-body); font-size:max(14px, .78rem); width:100%;
  }
  .review-title{ font-weight:500; }
  .review-tags{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; border:1px solid var(--line); padding:6px 7px; min-height:34px; }
  .review-tag{ display:inline-flex; align-items:center; gap:4px; font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); border:1px solid var(--line); padding:3px 6px 3px 8px; white-space:nowrap; }
  .review-tag-remove{ color:var(--dim-2); font-size:.8rem; line-height:1; padding:0 1px; }
  .review-tag-remove:hover{ color:var(--white); }
  .review-tag-input{ flex:1 1 60px; min-width:60px; background:transparent; border:none; color:var(--white); font-size:.76rem; padding:3px; }
  .review-card-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .review-save-status{ font-size:.64rem; letter-spacing:.04em; text-transform:uppercase; color:#8de08d; opacity:0; transition:opacity 200ms var(--ease); }
  .review-save-status.show{ opacity:1; }
  .review-save-status.error{ color:#e08d8d; }
  .review-full-edit{ font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .review-full-edit:hover{ color:var(--white); }

  /* ============ REORDER TAB (drag & drop) ============ */
  .reorder-scope-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .reorder-scope-row select{ background:#151515; border:1px solid var(--line); color:var(--white); padding:8px 10px; font-family:var(--font-body); font-size:.85rem; }
  .reorder-list{ display:flex; flex-direction:column; border:1px solid var(--line); }
  .reorder-row{ display:flex; align-items:center; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line-soft); background:#0c0c0c; position:relative; }
  .reorder-row:last-child{ border-bottom:none; }
  .reorder-handle{ color:var(--dim-2); font-size:1rem; line-height:1; user-select:none; padding:2px 4px; cursor:grab; touch-action:none; flex-shrink:0; }
  .reorder-row img{ width:40px; height:40px; object-fit:cover; background:#1a1a1a; flex-shrink:0; }
  .reorder-row .reorder-num{ width:26px; flex-shrink:0; color:var(--dim-2); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .reorder-row .reorder-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.85rem; }
  /* Drag handle re-used inside .admin-row-actions on the Photos tab list —
     same touch-friendly pointer-based engine (makeListSortable) as the
     Reorder tab above, just a differently-shaped row. */
  .admin-row-actions .drag-handle{ color:var(--dim-2); font-size:1rem; line-height:1; user-select:none; padding:2px 6px; cursor:grab; touch-action:none; }
  /* Applied by makeListSortable() to whichever row is currently being
     dragged (in either list) — lifted, slightly enlarged, above its
     siblings while it follows the pointer. */
  .sorting-active{ position:relative; z-index:5; box-shadow:0 10px 24px rgba(0,0,0,.5); background:#161616; cursor:grabbing; }
  .sorting-active .drag-handle, .sorting-active .reorder-handle{ cursor:grabbing; }

  /* ============ LANDING TAB (picker + crop tool) ============ */
  .landing-mode-row{ display:flex; gap:10px; margin-bottom:16px; }
  .landing-mode-btn{ padding:9px 16px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--dim); background:transparent; }
  .landing-mode-btn.active{ color:var(--ink); background:var(--white); border-color:var(--white); }
  .landing-picker-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; max-height:320px; overflow-y:auto; border:1px solid var(--line); padding:10px; margin-bottom:14px; }
  .landing-picker-thumb{ position:relative; aspect-ratio:1; overflow:hidden; cursor:pointer; border:2px solid transparent; background:#1a1a1a; }
  .landing-picker-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .landing-picker-thumb.selected{ border-color:var(--white); }
  .landing-picker-search{ margin-bottom:10px; }
  .crop-tool-wrap{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .crop-preview-tabs{ display:flex; gap:8px; }
  .crop-preview-tab{ font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; padding:4px 2px; }
  .crop-preview-tab.active{ color:var(--white); border-color:var(--white); }
  .crop-frame{ position:relative; width:100%; max-width:480px; overflow:hidden; background:#000; touch-action:none; cursor:grab; border:1px solid var(--line); }
  .crop-frame.desktop{ aspect-ratio:16/9; }
  .crop-frame.mobile{ aspect-ratio:9/16; max-width:220px; }
  .crop-frame.dragging{ cursor:grabbing; }
  .crop-frame img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; pointer-events:none; will-change:transform, object-position; }
  .crop-frame .crop-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; background:rgba(0,0,0,.4); pointer-events:none; }
  .crop-zoom-row{ display:flex; align-items:center; gap:10px; max-width:480px; }
  .crop-zoom-row input[type="range"]{ flex:1; }
  .crop-zoom-row span{ font-size:.72rem; color:var(--dim); min-width:34px; text-align:right; }
  .admin-error{ color:#ff8b7a; font-size:.8rem; }
  .admin-saved{ color:#8de08d; font-size:.78rem; align-self:center; }

  /* Undo toast — replaces confirm() on delete. Sits inside the admin panel
     itself (not the site-wide .toast) so it's visible above the modal and
     never gets hidden behind admin-overlay's own z-index. */
  .admin-undo-toast{ position:absolute; left:50%; bottom:22px; transform:translate(-50%, 12px); display:flex; align-items:center; gap:14px; background:var(--white); color:var(--ink); font-size:.82rem; padding:11px 16px; border-radius:2px; box-shadow:0 6px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity 220ms var(--ease), transform 220ms var(--ease); z-index:20; }
  .admin-undo-toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .admin-undo-toast .undo-btn{ font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:.72rem; color:var(--ink); border-bottom:1px solid var(--ink); flex-shrink:0; }
  .admin-undo-toast .undo-btn:hover{ opacity:.65; }

  @media (max-width: 720px){
    .admin-row{ grid-template-columns:44px 1fr; grid-template-areas:"thumb title" "actions actions"; }
    .admin-row .row-thumb{ grid-area:thumb; width:40px; height:40px; }
    .admin-row .row-thumb img{ width:40px; height:40px; }
    .admin-row .col-title{ grid-area:title; }
    .admin-row-actions{ grid-area:actions; }
    .admin-row > *:not(.row-thumb):not(.col-title):not(.admin-row-actions){ display:none; }
    .admin-field-grid{ grid-template-columns:1fr; }
    .admin-panel{ height:94vh; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="scroll-nav" id="scrollNav" aria-hidden="true">
  <button class="scroll-up" id="scrollUpBtn" type="button" aria-label="Previous photo">

  <button class="scroll-down" id="scrollDownBtn" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M5 9l7 7 7-7"/></svg>
  </button>
</div>

<nav class="cat-nav" id="catNav" aria-label="Photo categories"></nav>

<div class="lang-switch" id="langSwitch" aria-label="Choose story language"></div>

<main class="scroller" id="scroller">
<header class="hero" id="hero">
  <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true">
    <img id="heroBackdropImg" alt="" decoding="async">
  </div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="hero-inner">
    <h1 class="sr-only">Islem Zrelli</h1>
    <div class="hero-kicker" id="heroLocationLine">
      <p class="hero-place">Gabès, Tunisia</p>
      <p class="hero-count"><span id="heroPhotoCount">14</span> stories of documentary photography</p>
    </div>
    <p class="by-line">By</p>

      <svg class="signature-svg" id="signatureSvg" viewBox="0 0 700 160" preserveAspectRatio="xMidYMid meet">
        <text id="signatureText" x="50%" y="62%" text-anchor="middle" dominant-baseline="middle">Islem Zrelli</text>
      </svg>

<!-- ============ ADMIN PANEL ============ -->
<div class="admin-overlay" id="adminOverlay" style="display:none;">
  <div class="admin-login-box" id="adminLoginBox" style="display:none;">
    <h2>Admin Access</h2>
    <span class="meta sub">Islem Zrelli</span>
    <form id="adminLoginForm" autocomplete="on">
      <input type="email" id="adminEmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required>
      <label class="remember-row"><input type="checkbox" id="adminRemember"> Remember me</label>

        <button id="adminLogoutBtn">Log Out</button>

      <button class="admin-tab" data-tab="categories">Categories</button>

      <button class="admin-tab" data-tab="landing">Landing Page</button>
      <button class="admin-tab" data-tab="watermark">Watermark</button>
      <button class="admin-tab" data-tab="about">About</button>
    </div>
    <div class="admin-stats" id="adminStats"></div>
    <div class="admin-scroll" id="adminScroll"></div>
    <div class="admin-undo-toast" id="adminUndoToast"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= CONFIG — fill these in once, then you're done ================
     SUPABASE_URL / SUPABASE_ANON_KEY: Project Settings -> API in your Supabase project.

     AUTH MODEL: the "I.Z" x10 gesture only ever OPENS THE LOGIN SCREEN — it never
     grants access by itself. Real admin access requires signing in with a Supabase
     Auth account (email + password) created ONCE in Supabase dashboard ->
     Authentication -> Users -> Add user. Give that user Islem's email + a strong
     password. That single account is "the admin" — see ADMIN-ONLY RLS below for
     how the database recognizes it.

     The anon key below is meant to be public (it ships in every page load of every
     Supabase project — that's normal). It grants NOTHING by itself; every table and
     storage bucket below is locked down with Row Level Security so that only a

  function sortByScopeOrder(list, orderOf){
    return list.slice().sort(function(a, b){
      var ao = orderOf(a), bo = orderOf(b);
      var aHas = ao != null, bHas = bo != null;
      if(aHas && bHas && ao !== bo) return ao - bo;
      if(aHas !== bHas) return aHas ? -1 : 1;
      return (a.display_order || 0) - (b.display_order || 0);
    });
  }

  function photosForCategory(slug){
    if(slug === 'favorite'){
      var favs = photos.filter(function(p){ return !!p.is_favorite; });
      return sortByScopeOrder(favs, function(p){ return p.favorite_order; });
    }
    if(slug === 'all'){
      // Every published photo, automatically — never manually assigned,
      // never a separate photo_categories/order column of its own. `photos`
      // is already the full published set (see loadPublicData's query),
      // and the existing global display_order IS the canonical order per
      // the task's requirement, so this is just that same order applied —
      // no duplicate ordering system, no per-photo "All" record.
      return photos.slice().sort(function(a, b){ return (a.display_order || 0) - (b.display_order || 0); });
    }
    var cat = categories.find(function(c){ return c.slug === slug; });
    if(!cat) return photos.slice();
    var orderMap = {};
    photoCategoryRows.forEach(function(r){
      if(r.category_id === cat.id) orderMap[String(r.photo_id)] = r.sort_order;
    });
    var list = photos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(cat.id) !== -1; });
    return sortByScopeOrder(list, function(p){ return orderMap[String(p.id)]; });
  }

  function categorySlugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('^' + base + '\\/category\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;
  }

  function categoryUrlPath(slug){
    return slug === 'favorite' ? (BASE_PATH + '/') : (BASE_PATH + '/category/' + slug + '/');
  }

  // Resolves a photo's displayed category label (the free-text
  // `photo.category` field shown as the .tag on each scene) to an actual,
  // navigable category slug from the real `categories` table, so tapping
  // it can reuse the exact same selectCategory()/URL system as the
  // category nav bar — no separate/duplicate category system involved.
  function categorySlugForLabel(name){
    if(!name) return null;
    var norm = String(name).trim().toLowerCase();
    var found = categories.find(function(c){ return c.name && c.name.trim().toLowerCase() === norm; });
    if(found) return found.slug;
    // No structured category shares this exact name — most likely this is
    // simply the free-text label for whichever category is already being
    // browsed (the common case: every photo shown while filtered to a
    // category typically carries that category's own name as its label),
    // so treat it as pointing there. Skipped while browsing Favorites or
    // All, where a single scroll mixes photos from several different real
    // categories — guessing which one a mismatched label meant could send
    // the visitor somewhere they didn't ask for instead of leaving the
    // label as plain, non-clickable text.
    if(currentCategorySlug && currentCategorySlug !== 'favorite' && currentCategorySlug !== 'all') return currentCategorySlug;
    return null;
  }

  // Used when the visitor taps a photo's own category label to jump back
  // to the top of that category. If they're already browsing that exact
  // category, this is a same-category "scroll to top", not a new page —
  // so it replaces the current history entry with the category's own
  // canonical URL instead of pushing a duplicate one on top of it (this
  // also correctly covers landing back at the top when already viewing
  // the category's first photo: the scroll target is the same either
  // way, it just has nowhere further to move). If the label names a
  // DIFFERENT category than the one currently active, this is a real
  // navigation and behaves exactly like clicking the category nav bar.
  function goToCategoryTop(slug){
    if(!slug) return;
    if(slug === currentCategorySlug){
      requestAnimationFrame(function(){
        var slides = sceneNav.navSlides();
        if(slides.length > 1) scroller.scrollTop = slides[1].offsetTop;
        updateScrollNavState();
      });
      safeHistory('replaceState', { category: slug }, categoryUrlPath(slug));
      updateHeadForCategory(slug);
      return;
    }
    selectCategory(slug);
  }

  function updateHeadForCategory(slug){
    var list = navCategoryList();
    var cat = list.find(function(c){ return c.slug === slug; });
    if(!cat || slug === 'favorite'){ resetHeadToDefault(); return; }
    var title = 'Islem Zrelli — ' + cat.name;
    document.title = title;
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[name="twitter:title"]', title);
    var canon = document.getElementById('canonicalLink');
    var url = SITE_URL + '/category/' + slug + '/';
    if(canon) canon.href = url;
    setMetaContent('meta[property="og:url"]', url);
  }

  function renderCategoryNav(){
    var nav = document.getElementById('catNav');
    if(!nav) return;
    var list = navCategoryList();
    nav.innerHTML = list.map(function(c){
      var active = c.slug === currentCategorySlug;
      return '<button type="button" class="cat-btn'+(active?' active':'')+'" data-slug="'+escapeHtml(c.slug)+'" aria-current="'+(active?'true':'false')+'">'+escapeHtml(c.name)+'</button>';
    }).join('');
  }

  // Switches the visible gallery to a category, without a page reload.
  // Reuses the existing one-photo-at-a-time scene engine — this only
  // changes which photo array feeds it (see renderScenes()).
  function selectCategory(slug, opts){
    opts = opts || {};
    var list = navCategoryList();
    if(!list.some(function(c){ return c.slug === slug; })) return;
    currentCategorySlug = slug;
    markCategoryViewed(slug);
    activePhotos = photosForCategory(slug);
    renderCategoryNav();
    renderScenes();
    if(activePhotos.length) injectGalleryLd(activePhotos);
    if(!opts.skipHead) updateHeadForCategory(slug);
    if(!opts.skipHistory){
      safeHistory('pushState', { category: slug }, categoryUrlPath(slug));
    }
    if(!opts.skipScrollReset){
      // Jump straight to the first photo of the new category — never back
      // to the hero — so switching categories mid-browse never feels like
      // "leaving" the gallery.
      requestAnimationFrame(function(){
        var slides = sceneNav.navSlides();
        if(slides.length > 1) scroller.scrollTop = slides[1].offsetTop;
        updateScrollNavState();
      });
    }
  }

  // When someone reaches the very end of a category — the "Continue
  // Exploring" card — and keeps scrolling/swiping past it instead of
  // tapping it directly, this carries them into the next category, same
  // as tapping the card would. Returns true if it handled the advance.
  function tryAdvancePastNextChapter(){
    var slides = sceneNav.navSlides();
    var last = slides[slides.length - 1];
    if(last && last.classList && last.classList.contains('next-chapter')){
      var nextSlug = last.getAttribute('data-next-slug');
      if(nextSlug){ selectCategory(nextSlug); return true; }
    }
    return false;
  }

  document.getElementById('catNav').addEventListener('click', function(e){
    var btn = e.target.closest('.cat-btn');
    if(!btn) return;
    var slug = btn.getAttribute('data-slug');
    if(slug === currentCategorySlug) return;
    selectCategory(slug);
  });
  // Left/right arrow keys move focus between category buttons when the
  // nav itself has focus, per the accessibility requirement for
  // horizontal category browsing.
  document.getElementById('catNav').addEventListener('keydown', function(e){
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var btns = Array.prototype.slice.call(document.querySelectorAll('.cat-btn'));
    var idx = btns.indexOf(document.activeElement);
    if(idx === -1) return;
    e.preventDefault();
    var next = btns[idx + (e.key === 'ArrowRight' ? 1 : -1)];
    if(next) next.focus();
  });

  var LIKED_KEY = 'iz_liked_scenes_v1';
  function getLiked(){ try{ return JSON.parse(localStorage.getItem(LIKED_KEY) || '{}'); }catch(e){ return {}; } }
  function setLiked(obj){ try{ localStorage.setItem(LIKED_KEY, JSON.stringify(obj)); }catch(e){} }

  // Tracks which categories this visitor has already scrolled through THIS
  // VISIT ONLY — sessionStorage (not localStorage) so it resets on a fresh
  // tab/session rather than following someone forever. Powers the
  // "Continue Exploring" card: it always points at a category they
  // haven't seen yet this visit, cycling through navCategoryList() until
  // everything's been shown, at which point the card simply doesn't
  // appear and only the finale/contact scene is shown.
  var VIEWED_CATS_KEY = 'iz_viewed_categories_v1';
  function getViewedCategories(){ try{ return JSON.parse(sessionStorage.getItem(VIEWED_CATS_KEY) || '[]'); }catch(e){ return []; } }
  function markCategoryViewed(slug){
    if(!slug) return;
    var seen = getViewedCategories();
    if(seen.indexOf(slug) === -1){
      seen.push(slug);
      try{ sessionStorage.setItem(VIEWED_CATS_KEY, JSON.stringify(seen)); }catch(e){}
    }
  }
  function nextUnvisitedCategorySlug(){
    var seen = getViewedCategories();
    var list = navCategoryList();
    for(var i=0; i<list.length; i++){
      var c = list[i];
      if(c.slug === currentCategorySlug) continue;
      if(seen.indexOf(c.slug) !== -1) continue;
      if(photosForCategory(c.slug).length === 0) continue; // nothing to show — skip teasing an empty category
      return c.slug;
    }
    return null;
  }
  var liked = getLiked();

  var scroller = document.getElementById('scroller');
  var heroEl = document.getElementById('hero');
  var scrollNav = document.getElementById('scrollNav');
  var scrollUpBtn = document.getElementById('scrollUpBtn');
  var scrollDownBtn = document.getElementById('scrollDownBtn');
  var toastEl = document.getElementById('toast');
  var langSwitch = document.getElementById('langSwitch');
  var heroPhotoCountEl = document.getElementById('heroPhotoCount');
  var heroLocationLineEl = document.getElementById('heroLocationLine');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Draws the hero signature like it's being written, then lets the ink
  // "settle" into a solid fill. Runs once per page load — the landing hero
  // is only ever seen fresh (there's no client-side route change back to
  // it), so "every time someone enters the site" and "on load" are the
  // same event here.
  //
  // This animates a real <text> element (correct, legible letterforms) —
  // not a hand-authored calligraphy path — so there's nothing to draw
  // incorrectly. Text elements don't support getTotalLength(), so instead
  // of measuring the exact stroke length we use a dasharray/dashoffset
  // value (4000) that's comfortably longer than the glyphs' total stroke
  // perimeter at this font size within the SVG's fixed 700-wide viewBox —
  // since the viewBox coordinate space doesn't change with screen size,
  // one constant works everywhere.
  (function animateSignature(){
    var text = document.getElementById('signatureText');
    if(!text) return;
    if(reduceMotion) return; // CSS already shows it fully filled, no JS needed
    var DASH = 4000;
    text.style.strokeDasharray = DASH;
    text.style.strokeDashoffset = DASH;
    // Force layout so the browser registers the starting offset before
    // the transition below is triggered — otherwise it can jump straight
    // to the end state instead of animating.
    text.getBoundingClientRect();
    text.style.transition = 'stroke-dashoffset 1500ms cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        text.style.strokeDashoffset = '0';
      });
    });
    setTimeout(function(){ text.classList.add('filled'); }, 1150);
  })();

  // Early, synchronous signal for whether this load might land somewhere
  // other than the hero — an explicit /work/ or /category/ URL. (This used
  // to also check a returning visitor's saved scroll position, but that
  // auto-restore has been removed — see applyInitialRoute — so a saved
  // position no longer counts as "might leave the hero".)
  // Computed from the URL alone, so it's known instantly, with no need to
  // wait on the photo fetch that applyInitialRoute() otherwise depends on.
  // This is what used to be missing: the hero used to always animate in
  // immediately, then — once that fetch resolved and the URL turned out to
  // point deeper in — get scrolled away from abruptly, which is what
  // looked like a glitch. Now, when this is true, the whole .scroller
  // stays hidden (see .route-pending) until applyInitialRoute() has
  // actually decided where to land and set the scroll position, so the
  // hero either never renders in the first place or the jump has already
  // happened before anything is shown — never both in view at once.
  var mightLeaveHero = !!(categorySlugFromPath(window.location.pathname) || slugFromPath(window.location.pathname));
  if(mightLeaveHero && scroller){
    scroller.classList.add('route-pending');
    // Safety net: applyInitialRoute() (via revealScroller(), defined
    // further down) is what normally lifts this gate, but that depends on
    // the photo fetch in loadPublicData() succeeding. If that fetch fails
    // or throws for any reason, this guarantees the page still becomes
    // visible — showing the hero, same as if nothing had been saved —
    // rather than staying blank forever.
    setTimeout(function(){
      if(scroller.classList.contains('route-pending')) revealScroller(true);
    }, 4000);
  }

  // Fades and rises the hero text into place on load — title, then role
  // line, then button — instead of it just snapping into view. Runs
  // independently of the hero photo/data fetch below so the text doesn't
  // wait on network before appearing, UNLESS mightLeaveHero is true, in
  // which case applyInitialRoute() calls this itself once it's confirmed
  // the visitor is actually staying on the hero.
  function animateHeroEntrance(){
    var hero = document.getElementById('hero');
    if(!hero) return;
    if(reduceMotion){ hero.classList.add('ready'); return; } // CSS already shows it in place
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        hero.classList.add('ready');
      });
    });
  }
  if(!mightLeaveHero) animateHeroEntrance();

  // Right-click / drag deterrent for gallery photos AND the hero backdrop
  // photo (see the CSS comment above .wm-frame::after for what this can
  // and can't do). Delegated on document rather than attached per-<img>,
  // so it keeps working after renderScenes() replaces scroller.innerHTML —
  // no need to re-bind listeners every time the gallery re-renders.
  (function setupImageProtection(){
    function isProtectedImg(el){ return !!(el && el.tagName === 'IMG' && el.closest('.frame-img, .hero-backdrop')); }
    document.addEventListener('contextmenu', function(e){
      if(!isProtectedImg(e.target)) return;
      e.preventDefault();
      showToast('Images are protected — © Islem Zrelli');
    });
    document.addEventListener('dragstart', function(e){
      if(isProtectedImg(e.target)) e.preventDefault();
    });
  })();

  function svgHeart(filled){
    return '<svg viewBox="0 0 24 24" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.4"><path d="M12 20.6s-7.6-4.6-10-9.2C.4 8 2 4.4 5.6 3.6c2.1-.5 4.2.4 5.4 2.1a1 1 0 001.6 0c1.2-1.7 3.3-2.6 5.4-2.1C21.6 4.4 23.2 8 21.6 11.4 19.2 16 12 20.6 12 20.6z"/></svg>';
  }
  var svgShare = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 12v6a1 1 0 001 1h8a1 1 0 001-1v-6M16 8l-4-4-4 4M12 4v13"/></svg>';

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Admin-panel thumbnails don't need full-resolution bytes — this asks
  // Supabase's Storage image-transform endpoint for a small resized
  // rendition instead. Only rewrites URLs that actually match Supabase's
  // public-storage path shape (anything else is left untouched). Pair
  // this with onerror="this.onerror=null;this.src='...'" pointing at the
  // original URL wherever it's used, so a project without Image
  // Transformations enabled (it's a paid-tier feature) just silently
  // falls back to the full image instead of showing a broken thumbnail.
  function adminThumbUrl(url, size){
    if(!url) return url;
    var marker = '/storage/v1/object/public/';
    var i = url.indexOf(marker);
    if(i === -1) return url;
    var px = size || 100;
    return url.slice(0, i) + '/storage/v1/render/image/public/' + url.slice(i + marker.length) + '?width=' + px + '&height=' + px + '&resize=cover&quality=60';
  }
  function adminThumbAttrs(url, size){
    return 'src="'+escapeHtml(adminThumbUrl(url, size))+'" onerror="this.onerror=null;this.src=\''+escapeHtml(url||'')+'\';"';
  }

  /* ================= SEO: slugs, clean URLs, dynamic head ================= */

  function parseTags(p){
    return String((p && p.tags) || '').split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  }

  // What actually becomes the URL/slug for a photo. Tags win when present —
  // that's the whole point of the field (e.g. tags "gabes, pollution" ->
  // /work/gabes-pollution/, shareable across every photo tagged the same
  // way). Falls back to location, then category, then finally the title
  // itself, so older photos saved before this field existed still get a
  // sensible slug instead of breaking.
  function slugSourceFor(p){
    var tags = parseTags(p);
    if(tags.length) return tags.slice(0, 2).join(' ');
    if(p.location) return p.location;
    if(p.category) return p.category;
    return p.title;
  }

  function slugify(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80) || 'photo';
  }

  function ensureSlugs(list){
    var seen = {};
    list.forEach(function(p){
      var base = slugify(slugSourceFor(p));
      var slug = base, n = 2;
      while(seen[slug]){ slug = base + '-' + n; n++; }
      seen[slug] = true;
      p._slug = slug;
    });
  }

  function photoUrl(p){ return SITE_URL + '/work/' + p._slug + '/'; }

  function setMetaContent(selector, content){
    var el = document.querySelector(selector);
    if(el) el.setAttribute('content', content);
  }

  function updateHeadForPhoto(p){
    var title = 'Islem Zrelli — ' + p.title;
    var desc = (p.story || DEFAULT_DESC).slice(0, 160);
    var url = photoUrl(p);
    document.title = title;
    setMetaContent('meta[name="description"]', desc);
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[property="og:description"]', desc);
    setMetaContent('meta[property="og:url"]', url);
    setMetaContent('meta[property="og:type"]', 'article');
    if(p.image_url){
      setMetaContent('meta[property="og:image"]', p.image_url);
      setMetaContent('meta[name="twitter:image"]', p.image_url);
    }
    setMetaContent('meta[property="og:image:alt"]', p.alt_text || title);
    setMetaContent('meta[name="twitter:title"]', title);
    setMetaContent('meta[name="twitter:description"]', desc);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = url;
    injectPhotoLd(p, url);
    safeHistory('replaceState', null, BASE_PATH + '/work/' + p._slug + '/');
  }

  function resetHeadToDefault(){
    document.title = DEFAULT_TITLE;
    setMetaContent('meta[name="description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:title"]', DEFAULT_TITLE);
    setMetaContent('meta[property="og:description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:url"]', SITE_URL + '/');
    setMetaContent('meta[property="og:type"]', 'website');
    setMetaContent('meta[property="og:image"]', DEFAULT_OG_IMAGE);
    setMetaContent('meta[property="og:image:alt"]', DEFAULT_OG_IMAGE_ALT);
    setMetaContent('meta[name="twitter:image"]', DEFAULT_OG_IMAGE);
    setMetaContent('meta[name="twitter:title"]', DEFAULT_TITLE);
    setMetaContent('meta[name="twitter:description"]', DEFAULT_DESC);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = SITE_URL + '/';
    removePhotoLd();
    safeHistory('replaceState', null, BASE_PATH + '/');
  }

  function injectPhotoLd(p, url){
    var el = document.getElementById('ldPhoto');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldPhoto';
      document.head.appendChild(el);
    }
    var tags = parseTags(p);
    var keywords = tags.length ? tags.join(', ') : [p.category, p.location].filter(Boolean).join(', ');
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Photograph",
      "name": p.title,
      "description": p.story || '',
      "contentUrl": p.image_url,
      "url": url,
      "creator": { "@type": "Person", "name": "Islem Zrelli" },
      "contentLocation": p.location ? { "@type": "Place", "name": p.location } : undefined,
      "genre": p.category || undefined,
      "keywords": keywords || undefined
    });
  }

  function removePhotoLd(){
    var el = document.getElementById('ldPhoto');
    if(el) el.remove();
  }

  function injectGalleryLd(list){
    var el = document.getElementById('ldGallery');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldGallery';
      document.head.appendChild(el);
