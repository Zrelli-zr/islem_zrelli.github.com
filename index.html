        html += ''+
        '<div class="admin-row cat-row" data-id="'+c.id+'">'+
          '<div class="col-title"><strong>'+escapeHtml(c.name)+'</strong><span class="sub">'+count+(count===1?' photograph':' photographs')+'</span></div>'+
          '<span class="status '+(c.is_visible?'on':'off')+'">'+(c.is_visible?'ACTIVE':'HIDDEN')+'</span>'+
          '<div class="admin-row-actions">'+
            '<button data-act="up" '+(i===0?'disabled':'')+'>↑</button>'+
            '<button data-act="down" '+(i===adminCategories.length-1?'disabled':'')+'>↓</button>'+
            '<button data-act="toggle">'+(c.is_visible?'Hide':'Show')+'</button>'+
            '<button data-act="edit">Rename</button>'+
            '<button data-act="delete">Delete</button>'+
          '</div>'+
        '</div>';
      });
      html += '</div>';
      if(adminCategories.length === 0) html += '<p class="admin-empty">No categories yet — create your first one above.</p>';
    }

    adminScroll.innerHTML = html;

    var addBtn = document.getElementById('addCategoryBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ editingCategory = blankCategory(); drawCategoriesAdmin(); });
    if(editingCategory) wireCategoryForm();

    adminScroll.querySelectorAll('.admin-row[data-id]').forEach(function(row){
      var id = row.getAttribute('data-id');
      var cat = adminCategories.find(function(c){ return String(c.id) === id; });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var act = btn.getAttribute('data-act');
          if(act === 'edit'){ editingCategory = Object.assign({}, cat); drawCategoriesAdmin(); return; }
          if(act === 'toggle'){
            await sb.from('categories').update({ is_visible: !cat.is_visible }).eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'delete'){
            var count = categoryPhotoCount(cat.id);
            var msg = count > 0
              ? ('Delete "'+cat.name+'"? '+count+' photograph(s) will be removed from this category — the photographs themselves are never deleted.')
              : ('Delete "'+cat.name+'"?');
            if(!confirm(msg)) return;
            await sb.from('photo_categories').delete().eq('category_id', id);
            await sb.from('categories').delete().eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'up' || act === 'down'){
            var idx = adminCategories.findIndex(function(c){ return String(c.id) === id; });
            var swapIdx = act === 'up' ? idx - 1 : idx + 1;
            if(swapIdx < 0 || swapIdx >= adminCategories.length) return;
            var other = adminCategories[swapIdx];
            await Promise.all([
              sb.from('categories').update({ sort_order: other.sort_order }).eq('id', cat.id),
              sb.from('categories').update({ sort_order: cat.sort_order }).eq('id', other.id)
            ]);
            renderCategoriesAdmin();
          }
        });
      });
    });
  }

  function categoryFormHtml(c){
    var isNew = !c.id;
    return ''+
    '<div class="admin-form" id="categoryForm">'+
      '<h3>'+(isNew?'New Category':'Rename Category')+'</h3>'+
      '<div class="admin-field"><label>Category name</label><input type="text" id="c-name" value="'+escapeHtml(c.name)+'"></div>'+
      '<div class="admin-field row"><input type="checkbox" id="c-visible" '+(c.is_visible!==false?'checked':'')+'><label for="c-visible">Show in navigation</label></div>'+
      '<p class="admin-error" id="categoryFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<button class="admin-btn secondary" id="categoryCancelBtn">Cancel</button>'+
        '<button class="admin-btn" id="categorySaveBtn">'+(isNew?'Create Category':'Save')+'</button>'+
      '</div>'+
    '</div>';
  }

  function wireCategoryForm(){
    document.getElementById('categoryCancelBtn').addEventListener('click', function(){ editingCategory = null; drawCategoriesAdmin(); });
    document.getElementById('categorySaveBtn').addEventListener('click', async function(){
      var name = document.getElementById('c-name').value.trim();
      if(!name){ showCategoryFormError('Please enter a category name.'); return; }
      var payload = { name: name, slug: slugify(name), is_visible: document.getElementById('c-visible').checked };
      var btn = document.getElementById('categorySaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result;
      if(editingCategory.id){
        result = await sb.from('categories').update(payload).eq('id', editingCategory.id);
      } else {
        var maxOrder = adminCategories.reduce(function(m,c){ return Math.max(m, c.sort_order||0); }, -1);
        payload.sort_order = maxOrder + 1;
        result = await sb.from('categories').insert(payload);
      }
      btn.disabled = false; btn.textContent = editingCategory.id ? 'Save' : 'Create Category';
      if(result.error){ showCategoryFormError(result.error.message); return; }
      editingCategory = null;
      renderCategoriesAdmin();
    });
  }

  function showCategoryFormError(msg){
    var el = document.getElementById('categoryFormError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* ---------- Watermark tab ---------- */
  async function renderWatermarkAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    await loadAdminPhotos(); // for the live-preview thumbnail
    var loaded = Object.assign({}, DEFAULT_WATERMARK);
    try{
      var res = await sb.from('site_settings').select('*').eq('id', 1).single();
      if(res && res.data) loaded = Object.assign({}, DEFAULT_WATERMARK, res.data);
    } catch(e){ /* table not created yet — see SQL note near the top of this file */ }
    drawWatermarkAdmin(loaded);
  }

  function drawWatermarkAdmin(saved){
    var previewImg = (adminPhotos[0] && adminPhotos[0].image_url) || 'https://picsum.photos/seed/wm-preview/600/800';
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>Watermark Settings</h3>'+
      '<div class="admin-field row"><input type="checkbox" id="wm-enabled" '+(saved.watermark_enabled?'checked':'')+'><label for="wm-enabled">Enable Watermark</label></div>'+
      '<div class="admin-field"><label>Text</label><input type="text" id="wm-text" value="'+escapeHtml(saved.watermark_text)+'"></div>'+
      '<div class="admin-field"><label>Opacity: <span id="wm-opacity-val">'+Math.round(saved.watermark_opacity*100)+'%</span></label><input type="range" min="5" max="100" id="wm-opacity" value="'+Math.round(saved.watermark_opacity*100)+'"></div>'+
      '<div class="admin-field"><label>Position</label><select id="wm-position">'+wmPositionOptionsHtml(saved.watermark_position)+'</select></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>X Offset: <span id="wm-x-val">'+saved.watermark_x_offset+'px</span></label><input type="range" min="0" max="120" id="wm-x" value="'+saved.watermark_x_offset+'"></div>'+
        '<div class="admin-field"><label>Y Offset: <span id="wm-y-val">'+saved.watermark_y_offset+'px</span></label><input type="range" min="0" max="120" id="wm-y" value="'+saved.watermark_y_offset+'"></div>'+
      '</div>'+
      '<div class="admin-field"><label>Preview</label>'+
        '<p class="sub" style="margin:0 0 8px;">This shows exactly what gets burned into new uploads — not a live overlay. Already-published photos keep whatever was baked in at their own upload time; changing these settings does not retroactively touch them.</p>'+
        '<canvas id="wmPreviewCanvas" width="180" height="270" style="width:180px; aspect-ratio:2/3; background:#1a1a1a; display:block;"></canvas>'+
      '</div>'+
      '<p class="admin-error" id="wmFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="wmSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn secondary" id="wmResetBtn">Reset</button>'+
        '<button class="admin-btn" id="wmSaveBtn">Save</button>'+
      '</div>'+
    '</div>';

    function readForm(){
      return {
        watermark_enabled: document.getElementById('wm-enabled').checked,
        watermark_text: document.getElementById('wm-text').value || 'Islem Zrelli',
        watermark_opacity: (parseInt(document.getElementById('wm-opacity').value,10)||35)/100,
        watermark_position: document.getElementById('wm-position').value,
        watermark_x_offset: parseInt(document.getElementById('wm-x').value,10)||0,
        watermark_y_offset: parseInt(document.getElementById('wm-y').value,10)||0
      };
    }

    // Renders the SAME drawWatermarkOnCanvas() the real upload pipeline
    // uses, onto a small preview canvas — so what you see here is exactly
    // what new uploads will get, not a separate approximation of it.
    var previewCanvas = document.getElementById('wmPreviewCanvas');
    var previewCtx = previewCanvas.getContext('2d');
    var previewImgEl = new Image();
    var previewImgLoaded = false;
    previewImgEl.onload = function(){ previewImgLoaded = true; updatePreview(); };
    previewImgEl.src = previewImg;

    function updatePreview(){
      var v = readForm();
      document.getElementById('wm-opacity-val').textContent = Math.round(v.watermark_opacity*100)+'%';
      document.getElementById('wm-x-val').textContent = v.watermark_x_offset+'px';
      document.getElementById('wm-y-val').textContent = v.watermark_y_offset+'px';

      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      if(previewImgLoaded){
        // object-fit:cover into the canvas box, same as the real gallery frame.
        var cw = previewCanvas.width, ch = previewCanvas.height;
        var ir = previewImgEl.naturalWidth / previewImgEl.naturalHeight, cr = cw / ch;
        var sx, sy, sw, sh;
        if(ir > cr){ sh = previewImgEl.naturalHeight; sw = sh * cr; sx = (previewImgEl.naturalWidth - sw) / 2; sy = 0; }
        else { sw = previewImgEl.naturalWidth; sh = sw / cr; sx = 0; sy = (previewImgEl.naturalHeight - sh) / 2; }
        previewCtx.drawImage(previewImgEl, sx, sy, sw, sh, 0, 0, cw, ch);
      }
      if(v.watermark_enabled){
        drawWatermarkOnCanvas(previewCtx, previewCanvas.width, previewCanvas.height, {
          text: v.watermark_text, opacity: v.watermark_opacity, position: v.watermark_position,
          x: v.watermark_x_offset, y: v.watermark_y_offset
        });
      }
    }
    ['wm-enabled','wm-text','wm-opacity','wm-position','wm-x','wm-y'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
    });
    updatePreview();

    document.getElementById('wmResetBtn').addEventListener('click', function(){
      drawWatermarkAdmin(saved); // discard unsaved edits, back to last-saved values
    });

    document.getElementById('wmSaveBtn').addEventListener('click', async function(){
      var payload = readForm();
      payload.id = 1;
      payload.updated_at = new Date().toISOString();
      var btn = document.getElementById('wmSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('site_settings').upsert(payload);
      btn.disabled = false; btn.textContent = 'Save';
      var errEl = document.getElementById('wmFormError');
      var savedEl = document.getElementById('wmSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
      settings = Object.assign({}, DEFAULT_WATERMARK, payload);
      saved = Object.assign({}, payload);
      renderScenes(); // reflect the change on the gallery straight away
    });
  }

  /* ---------- About tab ---------- */
  async function renderAboutAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    var res = await sb.from('about').select('*').eq('id', 1).single();
    var a = res.data || {};
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>About</h3>'+
      '<div class="admin-field"><label>Landing Page Image</label>'+
        (a.hero_image_url ? '<img class="admin-image-preview" id="heroImagePreview" src="'+escapeHtml(a.hero_image_url)+'">' : '<img class="admin-image-preview" id="heroImagePreview" style="display:none;">')+
        '<input type="file" accept="image/*" id="heroImageFile">'+
        '<span class="admin-uploading" id="heroImageUploading" style="display:none;">Uploading…</span>'+
        '<p class="sub" style="margin:2px 0 0;">The backdrop behind your name on the landing page. Leave empty to use your featured photograph instead.</p>'+
      '</div>'+
      '<div class="admin-field"><label>Profile Photograph</label>'+
        (a.profile_image_url ? '<img class="admin-image-preview" id="aboutPreview" src="'+escapeHtml(a.profile_image_url)+'">' : '<img class="admin-image-preview" id="aboutPreview" style="display:none;">')+
        '<input type="file" accept="image/*" id="aboutFile">'+
        '<span class="admin-uploading" id="aboutUploading" style="display:none;">Uploading…</span>'+
      '</div>'+
      '<div class="admin-field"><label>Name</label><input type="text" id="a-name" value="'+escapeHtml(a.name||'')+'"></div>'+
      '<div class="admin-field"><label>Short Biography</label><textarea id="a-short">'+escapeHtml(a.short_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Longer Biography</label><textarea style="min-height:140px;" id="a-long">'+escapeHtml(a.long_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Areas of Work</label><textarea id="a-areas">'+escapeHtml(a.areas_of_work||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Achievements</label><textarea id="a-achievements">'+escapeHtml(a.achievements||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Festivals / Exhibitions</label><textarea id="a-festivals">'+escapeHtml(a.festivals||'')+'</textarea></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Instagram URL</label><input type="url" id="a-instagram" value="'+escapeHtml(a.instagram_url||'')+'"></div>'+
        '<div class="admin-field"><label>Vimeo URL</label><input type="url" id="a-vimeo" value="'+escapeHtml(a.vimeo_url||'')+'"></div>'+
      '</div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Journal URL</label><input type="url" id="a-journal" value="'+escapeHtml(a.journal_url||'')+'"></div>'+
        '<div class="admin-field"><label>Contact Email</label><input type="email" id="a-email" value="'+escapeHtml(a.contact_email||'')+'"></div>'+
      '</div>'+
      '<h3 style="margin-top:8px;">Contact &amp; Social (Landing Page)</h3>'+
      '<p class="sub" style="margin:-8px 0 4px;">Shown as a quiet link strip near the bottom of the landing page. Leave a field blank to hide that platform — nothing is shown until it\'s filled in here.</p>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Facebook URL</label><input type="url" id="a-facebook" placeholder="https://facebook.com/..." value="'+escapeHtml(a.facebook_url||'')+'"></div>'+
        '<div class="admin-field"><label>TikTok URL</label><input type="url" id="a-tiktok" placeholder="https://tiktok.com/@..." value="'+escapeHtml(a.tiktok_url||'')+'"></div>'+
      '</div>'+
      '<div class="admin-field"><label>WhatsApp Number</label><input type="text" id="a-whatsapp" placeholder="+216 XX XXX XXX" value="'+escapeHtml(a.whatsapp_number||'')+'"></div>'+
      '<p class="admin-error" id="aboutFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="aboutSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn" id="aboutSaveBtn">Save Changes</button>'+
      '</div>'+
    '</div>';

    var currentImageUrl = a.profile_image_url || '';
    var currentHeroImageUrl = a.hero_image_url || '';

    document.getElementById('heroImageFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('heroImageUploading');
      uploadingEl.style.display = 'inline';
      try{
        // skipWatermark: true — the landing-page backdrop is deliberately
        // separate from the watermarked gallery photos, so it never gets
        // the "ISLEM ZRELLI" stamp.
        var res = await uploadFile(file, null, true);
        currentHeroImageUrl = res.url;
        var preview = document.getElementById('heroImagePreview');
        preview.src = currentHeroImageUrl;
        preview.style.display = 'block';
      } catch(err){
        var el = document.getElementById('aboutFormError');
        el.textContent = err.message; el.style.display = 'block';
      } finally {
        uploadingEl.style.display = 'none';
      }
    });

    document.getElementById('aboutFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('aboutUploading');
      uploadingEl.style.display = 'inline';
      try{
        // skipWatermark: true — this is Islem's own bio portrait, not one
        // of the documentary photographs, so it still gets the private-
        // original + resized/optimized public copy treatment but no
        // "ISLEM ZRELLI" stamp on his own headshot.
        var res = await uploadFile(file, null, true);
        currentImageUrl = res.url;
        var preview = document.getElementById('aboutPreview');
        preview.src = currentImageUrl;
        preview.style.display = 'block';
      } catch(err){
        var el = document.getElementById('aboutFormError');
        el.textContent = err.message; el.style.display = 'block';
      } finally {
        uploadingEl.style.display = 'none';
      }
    });

    document.getElementById('aboutSaveBtn').addEventListener('click', async function(){
      var payload = {
        profile_image_url: currentImageUrl,
        hero_image_url: currentHeroImageUrl,
        name: document.getElementById('a-name').value,
        short_bio: document.getElementById('a-short').value,
        long_bio: document.getElementById('a-long').value,
        areas_of_work: document.getElementById('a-areas').value,
        achievements: document.getElementById('a-achievements').value,
        festivals: document.getElementById('a-festivals').value,
        instagram_url: document.getElementById('a-instagram').value,
        vimeo_url: document.getElementById('a-vimeo').value,
        journal_url: document.getElementById('a-journal').value,
        contact_email: document.getElementById('a-email').value,
        facebook_url: document.getElementById('a-facebook').value,
        tiktok_url: document.getElementById('a-tiktok').value,
        whatsapp_number: document.getElementById('a-whatsapp').value,
        updated_at: new Date().toISOString()
      };
      var btn = document.getElementById('aboutSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('about').update(payload).eq('id', 1);
      btn.disabled = false; btn.textContent = 'Save Changes';
      var errEl = document.getElementById('aboutFormError');
      var savedEl = document.getElementById('aboutSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
      about = Object.assign({}, about, payload); // keep in-memory `about` in sync
      renderHeroBackdrop(); // reflect a changed landing-page image straight away
      renderHeroContact(); // reflect the change on the landing page straight away
      renderScenes(); // and in the deep-scroll contact scene, as before
    });
  }

  /* ================= INIT ================= */
  loadPublicData();

})();
</script>
