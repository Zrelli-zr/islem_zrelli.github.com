<style>
  :root{
    --ink:#050505;
    --white:#f6f4ef;
    --dim:rgba(246,244,239,0.58);
    --dim-2:rgba(246,244,239,0.36);
    --line:rgba(246,244,239,0.16);
    --line-soft:rgba(246,244,239,0.09);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --dur-1:560ms;
    --ease:cubic-bezier(.19,1,.22,1);
    --font-display:'Newsreader', serif;
    --font-body:'Inter', sans-serif;
    --size-title: clamp(2.5rem, 5vw, 6rem);
    --size-desc:  clamp(0.95rem, 1.2vw, 1.25rem);
    --size-nav:   0.88rem;
    --size-meta:  0.75rem;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    overflow:hidden; /* .scroller (now holding hero + every scene) is the only thing that ever scrolls */
  }
  ::selection{ background:var(--white); color:var(--ink); }
  a{ color:inherit; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .meta{ font-family:var(--font-body); font-weight:500; letter-spacing:.18em; text-transform:uppercase; font-size:var(--size-meta); color:var(--dim-2); }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  .vignette{ position:fixed; inset:0; z-index:55; pointer-events:none; background:radial-gradient(130% 100% at 50% 100%, transparent 40%, rgba(0,0,0,.5) 100%); }

  /* Desktop scroll-nav: a pair of up/down arrow buttons for mouse/trackpad
     users, since wheel-driven scene advance (see setupWheelAdvance) can feel
     imprecise without a native scrollbar to grab. Hidden entirely on touch
     devices — .scroller's native momentum + scroll-snap already handles
     that case well, and the buttons would just be dead weight there.
     Gated on both a min-width AND (pointer:fine) so a wide touch tablet
     doesn't get controls it can't use as precisely as a mouse. */
  .scroll-nav{ display:none; }
  @media (min-width: 860px) and (pointer:fine){
    .scroll-nav{
      display:flex; flex-direction:column; gap:10px;
      position:fixed; z-index:50; right:calc(32px + var(--safe-r)); top:50%; transform:translateY(-50%);
      opacity:0; transition:opacity 700ms var(--ease);
    }
    .scroll-nav.show{ opacity:1; }
    .scroll-nav button{
      width:44px; height:44px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); background:rgba(5,5,5,.42);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      color:var(--white); transition:border-color 260ms var(--ease), background 260ms var(--ease), transform 160ms var(--ease), opacity 260ms var(--ease);
    }
    .scroll-nav button svg{ width:15px; height:15px; stroke:currentColor; transition:transform 220ms var(--ease); }
    .scroll-nav button:hover:not(:disabled){ border-color:var(--white); background:rgba(5,5,5,.62); }
    .scroll-nav button:hover:not(:disabled) svg{ transform:translateY(-2px); }
    .scroll-nav .scroll-down:hover:not(:disabled) svg{ transform:translateY(2px); }
    .scroll-nav button:active:not(:disabled){ transform:scale(.92); }
    .scroll-nav button:disabled{ opacity:.28; cursor:default; }
  }

  /* Category navigation — a single-line, horizontally swipeable bar
     (TikTok/Instagram-style category browsing). Hidden on the hero (shown
     via the same "show" trigger the scroll-nav arrows use) and never wraps
     to a second line — it scrolls horizontally instead, with the
     scrollbar hidden but the scroll behavior preserved for touch/trackpad. */
  .cat-nav{
    position:fixed; z-index:50; left:0; right:0; top:calc(24px + var(--safe-t));
    display:flex; gap:26px; overflow-x:auto; overflow-y:hidden;
    padding:0 calc(22px + var(--safe-l)) 6px calc(22px + var(--safe-l));
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    opacity:0; transition:opacity 700ms var(--ease); white-space:nowrap;
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-nav.show{ opacity:1; }
  .cat-nav.empty{ display:none; }
  .cat-btn{
    flex:0 0 auto; font-family:var(--font-body); font-weight:500; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim-2);
    padding:8px 1px; border-bottom:1px solid transparent;
    transition:color 260ms var(--ease), border-color 260ms var(--ease);
  }
  .cat-btn:hover{ color:var(--dim); }
  .cat-btn.active{ color:var(--white); border-color:var(--white); }
  .cat-btn:focus-visible{ outline:1px solid var(--white); outline-offset:3px; }
  @media (min-width:860px){
    .cat-nav{ justify-content:center; }
  }

  .hero{ height:100vh; height:100dvh; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(40px + var(--safe-b)); background:var(--ink); scroll-snap-align:start; scroll-snap-stop:always; }
  /* Same reveal treatment as .scene / .finale photos: blurred, desaturated
     and darkened at rest, clearing once .in-view is added. Uses cover (not
     contain) since this is a full-bleed backdrop, not a letterboxed frame,
     so there's no letterbox edge to hide and no scale-up trick is needed. */
  .hero-backdrop{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
  .hero-backdrop img{ width:100%; height:100%; object-fit:cover; object-position:center; opacity:0; filter:blur(6px) grayscale(.32) brightness(.6); transition:opacity 1100ms var(--ease), filter 1600ms var(--ease); -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  .hero-backdrop.in-view img{ opacity:1; filter:blur(0) grayscale(.18) brightness(.8); }
  .hero-scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(5,5,5,.32) 0%, rgba(5,5,5,.4) 46%, rgba(5,5,5,.86) 100%); pointer-events:none; }
  .hero-inner{ position:relative; z-index:2; max-width:820px; }
  /* Staggered fade-and-rise entrance, matching the considered reveal every
     scene already gets (see .scene .tag / h2 / p.caption below) — the hero
     text used to just snap into view with none of that. */
  .hero-inner > *{ opacity:0; transform:translateY(18px); transition:opacity 900ms var(--ease), transform 900ms var(--ease); }
  .hero.ready .hero-inner > *{ opacity:1; transform:translateY(0); }
  .hero.ready .hero-inner > *:nth-child(2){ transition-delay:0ms; }
  .hero.ready .hero-inner > *:nth-child(3){ transition-delay:160ms; }
  .hero.ready .hero-inner > *:nth-child(4){ transition-delay:340ms; }
  .hero.ready .hero-inner > *:nth-child(5){ transition-delay:480ms; }
  .hero.ready .hero-inner > *:nth-child(6){ transition-delay:600ms; }
  /* Hero text order is: location+count line, "By", signature (name). The
     location line wraps naturally (no nowrap) since "Gabès, Tunisia — N
     Documentary Photography" is too long to fit one line on narrow phones;
     letter-spacing/font-size are trimmed further at small widths below so
     it never forces horizontal overflow. */
  .hero .meta{ display:block; margin-bottom:clamp(22px, 4.4vw, 32px); color:var(--dim); line-height:1.65; font-size:clamp(0.85rem, 1.6vw, 1.05rem); letter-spacing:.14em; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .hero .by-line{ font-family:var(--font-display); font-style:italic; font-weight:400; font-size:clamp(1.1rem, 2.4vw, 1.5rem); letter-spacing:.01em; text-transform:none; color:var(--dim); margin:0 0 clamp(18px, 3.4vw, 26px); }
  .signature-wrap{ margin:0 0 clamp(32px, 6.4vw, 48px); display:flex; justify-content:center; }
  .signature-svg{ width:min(86vw, 620px); height:auto; display:block; overflow:visible; }
  .signature-svg text{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:92px; fill:var(--white); fill-opacity:0; stroke:var(--white); stroke-width:1.4; stroke-linejoin:round; paint-order:stroke fill; }
  .signature-svg text.filled{ transition:fill-opacity 650ms var(--ease); fill-opacity:1; }
  .hero-role{ font-family:var(--font-body); font-weight:400; font-size:.82rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0 0 clamp(34px, 6.8vw, 52px); }
  @media (max-width:430px){
    .hero .meta{ font-size:0.8rem; letter-spacing:.1em; }
    .hero .by-line{ font-size:1.05rem; }
    .hero-role{ font-size:.7rem; letter-spacing:.12em; }
  }
  .enter{ display:inline-flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.16em; text-transform:uppercase; color:var(--white); padding:6px; border-bottom:1px solid transparent; transition:border-color 300ms var(--ease); }
  .enter:hover{ border-color:var(--line); }
  .enter .arrow-line{ width:1px; height:34px; background:var(--line); position:relative; overflow:hidden; }
  .enter .arrow-line::after{ content:""; position:absolute; left:0; top:-100%; width:100%; height:100%; background:var(--white); animation:drip 2.4s var(--ease) infinite; }
  @keyframes drip{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }

  /* Quiet contact/social strip pinned near the bottom of the hero — kept
     absolutely positioned so it never affects the vertical centering of
     .hero-inner above it. Hidden entirely (via .has-content) whenever no
     contact fields are configured in the About admin tab, so an unfilled
     site shows nothing here rather than empty separators. */
  .hero-contact{ position:absolute; left:0; right:0; bottom:calc(26px + var(--safe-b)); z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 24px; opacity:0; pointer-events:none; transition:opacity 900ms var(--ease); transition-delay:520ms; }
  .hero.ready .hero-contact.has-content{ opacity:1; pointer-events:auto; }
  .hero-contact-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; }
  .hero-contact-row .dot{ color:var(--dim-2); font-size:.68rem; padding:0 2px; user-select:none; }
  .hero-contact a{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; font-family:var(--font-body); font-weight:400; font-size:.7rem; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); padding:6px 10px; border-bottom:1px solid transparent; transition:color 260ms var(--ease), border-color 260ms var(--ease); }
  .hero-contact a:hover, .hero-contact a:focus-visible{ color:var(--white); border-color:var(--line); }
  .hero-contact a:focus-visible{ outline:none; }
  @media (max-width:430px){
    .hero-contact{ bottom:calc(18px + var(--safe-b)); }
    .hero-contact a{ font-size:.66rem; padding:6px 8px; }
  }

  /* mandatory ensures every scroll gesture always comes to rest on a full
     scene — never half-way between two — even on a soft swipe or a
     trackpad flick that doesn't carry quite enough momentum to clear the
     midpoint on its own. Desktop wheel input is additionally handled by
     JS (see setupWheelAdvance) since trackpads/mice don't have native
     momentum-to-snap behavior at all. */
  .scroller{ height:100vh; height:100dvh; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
  .scene{ position:relative; height:100vh; height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:normal; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:calc(22px + var(--safe-t)) 22px calc(22px + var(--safe-b)); background:var(--ink); }
  .scene .frame-img{ position:relative; width:100%; flex:1 1 auto; min-height:34vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* .wm-frame sits between .frame-img (the full flex slot the photo is
     centered in) and the <img> itself. It carries the SAME aspect-ratio as
     the photo (set inline per-photo, falling back to 3/4) plus max-width/
     max-height:100%, which makes the browser size it exactly the way it
     sizes a replaced element (like the <img> used to be sized on its own):
     as large as possible without exceeding either dimension of .frame-img.
     The upshot is .wm-frame's box == the photo's actual rendered box, with
     zero letterbox gap — unlike .frame-img, whose own box is the full
     flex slot and can be much taller/wider than the photo once object-fit
     contain has letterboxed it. That mismatch (container box vs. real
     photo box) is what let the watermark drift away from the visible
     photo edge on some screens/aspect ratios; anchoring the watermark to
     .wm-frame instead fixes it consistently across phone/tablet/desktop. */
  .scene .frame-img .wm-frame{ position:relative; max-width:100%; max-height:100%; aspect-ratio:3/4; }
  .scene .frame-img .wm-frame img{ display:block; width:100%; height:100%; object-fit:contain; object-position:center; transform:scale(1.05); filter:blur(6px) grayscale(.06) brightness(.94); transition:transform 950ms var(--ease), filter 850ms var(--ease); }
  .scene.in-view .frame-img .wm-frame img{ transform:scale(1.0); filter:blur(0) grayscale(0) brightness(1); }
  /* Photo protection, scoped to the photos themselves — not the whole
     page — so captions, the contact email and every other text on the
     site stay normally selectable and clickable. This is friction, not a
     lock: it stops the average right-click/long-press save, nothing more.
     Screenshots, screen recordings and photos-of-the-screen can't be
     blocked by any website; the watermark is what actually survives
     those, since — see the note below — it's now burned into the pixels
     of the file itself rather than drawn on top of it by CSS. */
  .frame-img img{ -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  /* Watermark system — used to live here as a `.wm-frame::after` CSS
     pseudo-element drawn on top of the photo in the visitor's browser.
     That approach had a hole: the *photo itself* — the actual image
     bytes at image_url — was always the plain, unwatermarked file: the
     mark was just an overlay a viewer's browser painted on top of it.
     Right-click-open-image-in-new-tab, curl-ing the URL directly, or
     just reading the Network tab all bypassed it completely.
     The watermark is now burned into the image's actual pixels at
     upload time (see processImageForUpload / drawWatermarkOnCanvas in
     the admin script below) before the file is ever uploaded to the
     public bucket, so there is no separate unwatermarked file to find —
     image_url IS the watermarked file. `.wm-frame` itself is kept
     purely as the sizing/reveal-animation wrapper described above; it no
     longer carries any watermark-specific class, attribute or custom
     property. */
  .scene:not(.finale) .scrim{ display:none; }
  .scene-content{ position:relative; z-index:3; width:100%; display:flex; flex-direction:column; gap:14px; max-width:640px; flex:0 0 auto; }
  .scene .tag{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:500; opacity:0; transform:translateY(8px); transition:opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
  .scene h2{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:var(--size-title); line-height:1.05; margin:0; letter-spacing:-.005em; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 70ms, transform var(--dur-1) var(--ease) 70ms; }
  .scene p.caption{ font-family:var(--font-body); font-weight:300; font-size:var(--size-desc); line-height:1.65; color:var(--dim); margin:0; max-width:46ch; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 160ms, transform var(--dur-1) var(--ease) 160ms; }
  .scene.in-view .tag, .scene.in-view h2, .scene.in-view p.caption{ opacity:1; transform:translateY(0); }
  .scene-rule{ height:1px; background:var(--line-soft); margin-top:8px; transform:scaleX(0); transform-origin:left; transition:transform 900ms var(--ease) 260ms; }
  .scene.in-view .scene-rule{ transform:scaleX(1); }
  .scene-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; opacity:0; transform:translateY(6px); transition:opacity var(--dur-1) var(--ease) 320ms, transform var(--dur-1) var(--ease) 320ms; }
  .scene.in-view .scene-actions{ opacity:1; transform:translateY(0); }
  .actions-left{ display:flex; align-items:center; gap:18px; }
  .action-btn{ display:flex; align-items:center; gap:9px; padding:12px 2px; min-height:44px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.01em; color:var(--white); }
  .action-btn svg{ width:16px; height:16px; flex-shrink:0; stroke:currentColor; transform-origin:50% 50%; }
  .action-btn:active svg{ transform:scale(.86); transition:transform 120ms var(--ease); }
  @keyframes heartPulse{ 0%{ transform:scale(1); } 38%{ transform:scale(1.22); } 65%{ transform:scale(.94); } 100%{ transform:scale(1); } }
  .like-btn.pulse svg{ animation:heartPulse 420ms var(--ease); }
  .action-divider{ width:1px; height:14px; background:var(--line); }
  .like-count{ font-variant-numeric:tabular-nums; color:var(--dim); transition:color 200ms var(--ease); }
  .like-btn.liked .like-count{ color:var(--white); }
  .frame-counter{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.06em; font-variant-numeric:tabular-nums; color:var(--dim-2); }
  .frame-counter b{ color:var(--white); font-weight:500; }
  /* Finale keeps the original full-bleed portrait treatment — it's a closing
     statement card, not a photo being showcased uncropped. */
  .scene.finale{ align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b)); }
  .finale .frame-img{ position:absolute; inset:0; min-height:0; }
  .finale .frame-img img{ width:100%; height:100%; max-width:none; max-height:none; aspect-ratio:auto; object-fit:cover; filter:blur(6px) grayscale(.35) brightness(.7); }
  .finale.in-view .frame-img img{ filter:blur(0) grayscale(.28) brightness(.78); }
  .finale .scrim{ background:linear-gradient(rgba(2,2,2,.72), rgba(2,2,2,.9)); }
  .finale .scene-content{ align-items:center; max-width:640px; gap:22px; }
  .finale h2{ font-style:normal; font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .finale .social{ display:flex; gap:0; flex-wrap:wrap; justify-content:center; }
  .finale .social a{ font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; padding:14px 18px; border-bottom:1px solid var(--line); transition:border-color 300ms var(--ease), color 300ms var(--ease); }
  .finale .social a:hover{ border-color:var(--white); }
  .finale .signoff{ font-family:var(--font-display); font-style:italic; font-size:.9rem; color:var(--dim-2); margin:0; }
  .toast{ position:fixed; left:50%; bottom:calc(30px + var(--safe-b)); transform:translate(-50%, 16px); background:var(--white); color:var(--ink); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.02em; padding:13px 20px; z-index:80; opacity:0; transition:opacity 300ms var(--ease), transform 300ms var(--ease); pointer-events:none; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .empty-state{ height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.04em; }

  @media (min-width: 860px){
    .scene:not(.finale){ flex-direction:row; gap:76px; padding:calc(24px + var(--safe-t)) 72px calc(24px + var(--safe-b)); }
    .scene:not(.finale) .frame-img{ flex:0 1 auto; width:auto; max-width:54%; height:100%; min-height:0; }
    .scene:not(.finale) .scene-content{ flex:0 0 400px; max-width:400px; max-height:100%; overflow-y:auto; scrollbar-width:none; }
    .scene:not(.finale) .scene-content::-webkit-scrollbar{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .scene .frame-img img{ transition:none !important; transform:none !important; filter:none !important; }
    .scene .tag, .scene h2, .scene p.caption, .scene-actions, .scene-rule{ transition:none !important; opacity:1 !important; transform:none !important; }
    .enter .arrow-line::after{ animation:none; }
    .grain{ display:none; }
    .like-btn.pulse svg{ animation:none; }
    .action-btn:active svg{ transform:none; }
    .signature-svg text{ stroke:none; fill-opacity:1 !important; transition:none !important; }

  }

  /* ===================== ADMIN ===================== */
  .admin-overlay{ position:fixed; inset:0; z-index:200; background:rgba(5,5,5,.92); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; }
  .admin-login-box{ width:100%; max-width:320px; background:var(--ink); border:1px solid var(--line); padding:32px 28px; text-align:center; }
  .admin-login-box h2{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1.5rem; margin:0 0 4px; }
  .admin-login-box .sub{ display:block; margin:0 0 4px; }
  .admin-login-box input:not([type="checkbox"]){ width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--white); font-family:var(--font-body); font-size:1rem; padding:10px 4px; text-align:center; letter-spacing:.08em; outline:none; margin:18px 0 0; }
  .admin-login-box input:not([type="checkbox"]):focus{ border-color:var(--white); }
  .admin-login-box .remember-row{ display:flex; align-items:center; justify-content:center; gap:8px; margin:18px 0 22px; font-size:.78rem; color:var(--dim); letter-spacing:.04em; }
  .admin-login-box .remember-row input[type="checkbox"]{ width:15px; height:15px; margin:0; accent-color:var(--white); }
  .admin-login-box button.primary{ width:100%; padding:12px; border:1px solid var(--line); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; }
  .admin-login-box button.primary:hover{ border-color:var(--white); }
  .admin-login-box button.primary:disabled{ opacity:.5; cursor:default; }
  .admin-login-box .error{ color:#ff8b7a; font-size:.8rem; margin-top:14px; }
  .admin-login-box .notice{ color:var(--dim); font-size:.8rem; margin-top:14px; }
  .admin-login-box .cancel{ margin-top:16px; color:var(--dim-2); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; background:none; }
  .admin-login-box .link-row{ display:flex; justify-content:space-between; margin-top:16px; }

  .admin-panel{ width:100%; max-width:1000px; height:88vh; background:#0c0c0c; border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  .admin-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-top h1{ font-family:var(--font-display); font-style:italic; font-size:1.1rem; font-weight:500; margin:0; }
  .admin-top-actions{ display:flex; gap:18px; }
  .admin-top-actions button{ font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); padding:4px 0; }
  .admin-top-actions button:hover{ color:var(--white); border-color:var(--white); }
  .admin-tabs{ display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-tab{ padding:14px 16px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--white); border-color:var(--white); }
  .admin-scroll{ overflow-y:auto; padding:22px 24px; flex:1; }

  .admin-toolbar{ display:flex; justify-content:flex-end; margin-bottom:16px; }
  .admin-btn{ background:var(--white); color:var(--ink); padding:9px 16px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
  .admin-btn.secondary{ background:transparent; color:var(--white); border:1px solid var(--line); }
  .admin-btn:disabled{ opacity:.5; }

  .admin-list{ display:flex; flex-direction:column; border:1px solid var(--line); }
  .admin-row{ display:grid; grid-template-columns:56px 1fr 100px 90px 210px; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line-soft); font-size:.82rem; }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row img{ width:48px; height:48px; object-fit:cover; background:#1a1a1a; }
  .admin-row .col-title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .admin-row .col-title strong{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-row .sub{ color:var(--dim-2); font-size:.7rem; }
  .ratio-badge{ display:inline-block; font-size:.66rem; letter-spacing:.04em; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .admin-field .ratio-badge{ margin-left:0; margin-top:6px; }
  .status{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; }
  .status.on{ color:#8de08d; } .status.off{ color:var(--dim-2); }
  .admin-row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .admin-row-actions button{ font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); }
  .admin-row-actions button:hover{ color:var(--white); }

  .admin-form{ border:1px solid var(--line); padding:22px; margin-bottom:18px; display:flex; flex-direction:column; gap:13px; }
  .admin-form h3{ margin:0 0 2px; font-family:var(--font-display); font-style:italic; font-weight:500; }
  .admin-field{ display:flex; flex-direction:column; gap:6px; }
  .admin-field label{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .admin-field input[type="text"], .admin-field input[type="date"], .admin-field input[type="email"], .admin-field input[type="url"], .admin-field textarea{ background:#151515; border:1px solid var(--line); color:var(--white); padding:9px 11px; font-family:var(--font-body); font-size:max(16px, .88rem); }
  .admin-field textarea{ resize:vertical; min-height:70px; }
  .admin-field.row{ flex-direction:row; align-items:center; gap:9px; }
  .admin-field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .admin-form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .admin-image-preview{ width:160px; aspect-ratio:2/3; object-fit:cover; background:#1a1a1a; }
  .cat-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip{ display:inline-flex; align-items:center; gap:7px; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--line); padding:7px 11px; color:var(--dim); cursor:pointer; user-select:none; transition:color 200ms var(--ease), border-color 200ms var(--ease); }
  .cat-chip input{ accent-color:var(--white); margin:0; }
  .cat-chip.checked{ color:var(--white); border-color:var(--white); }
  .admin-row.cat-row{ grid-template-columns:1fr 90px 210px; }
  .admin-uploading{ font-size:.72rem; color:var(--dim); }
  .admin-optimize-result{ font-size:.74rem; line-height:1.6; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:8px 11px; margin-top:8px; font-variant-numeric:tabular-nums; }
  .admin-optimize-result .opt-before{ color:var(--dim-2); }
  .admin-optimize-result .opt-arrow{ color:var(--dim-2); }
  .admin-optimize-result .opt-after{ color:var(--white); }
  .admin-optimize-result .opt-reduction{ color:#8de08d; font-weight:500; margin-top:2px; }
  .admin-optimize-result .opt-note{ color:var(--dim-2); font-style:italic; }
  .admin-empty{ padding:34px; text-align:center; color:var(--dim-2); font-size:.85rem; }
  .admin-error{ color:#ff8b7a; font-size:.8rem; }
  .admin-saved{ color:#8de08d; font-size:.78rem; align-self:center; }

  @media (max-width: 720px){
    .admin-row{ grid-template-columns:44px 1fr; grid-template-areas:"thumb title" "actions actions"; }
    .admin-row img{ grid-area:thumb; width:40px; height:40px; }
    .admin-row .col-title{ grid-area:title; }
    .admin-row-actions{ grid-area:actions; }
    .admin-row > *:not(img):not(.col-title):not(.admin-row-actions){ display:none; }
    .admin-field-grid{ grid-template-columns:1fr; }
    .admin-panel{ height:94vh; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ================= CONFIG — fill these in once, then you're done ================
     SUPABASE_URL / SUPABASE_ANON_KEY: Project Settings -> API in your Supabase project.

     AUTH MODEL: the "I.Z" x10 gesture only ever OPENS THE LOGIN SCREEN — it never
     grants access by itself. Real admin access requires signing in with a Supabase
     Auth account (email + password) created ONCE in Supabase dashboard ->
     Authentication -> Users -> Add user. Give that user Islem's email + a strong
     password. That single account is "the admin" — see ADMIN-ONLY RLS below for
     how the database recognizes it.

     The anon key below is meant to be public (it ships in every page load of every
     Supabase project — that's normal). It grants NOTHING by itself; every table and
     storage bucket below is locked down with Row Level Security so that only a
     request carrying the signed-in admin's own auth token can write anything. */
  var SUPABASE_URL = "https://bkjwzdspuriquurfxcnp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_8SR8bCmRJAcQtP1eGe6PDA_YDr3AXJ1";
  /* ================================================================================

     ADMIN-ONLY RLS — run this once in the Supabase SQL editor, AFTER creating the
     admin user above. It replaces the old "anyone with the anon key can write"
     policies with policies that check the request is (a) authenticated AND
     (b) signed in as that exact admin account. Adjust the email in
     ADMIN_EMAIL below to match the account you created, then run the whole block.

  -- Helper: true only when the current request's JWT belongs to the one
  -- admin account (matched by email, since Supabase Auth email addresses
  -- are unique and this project only ever has one admin user). Every
  -- write policy below calls this instead of repeating the same check —
  -- change the email in ONE place if the admin account ever changes.
  create or replace function is_site_admin()
  returns boolean
  language sql stable
  as $$
    select auth.role() = 'authenticated'
       and coalesce(auth.jwt() ->> 'email', '') = 'ADMIN_EMAIL@example.com';
  $$;

  -- photos: public can read published rows only; only the admin can
  -- insert/update/delete or see unpublished/draft rows.
  alter table photos enable row level security;
  drop policy if exists "public write photos" on photos;
  drop policy if exists "public update photos" on photos;
  drop policy if exists "public delete photos" on photos;
  drop policy if exists "public read photos" on photos;
  drop policy if exists "public read published photos" on photos;
  drop policy if exists "admin write photos" on photos;
  drop policy if exists "admin update photos" on photos;
  drop policy if exists "admin delete photos" on photos;
  create policy "public read published photos" on photos
    for select using (published = true or is_site_admin());
  create policy "admin write photos" on photos
    for insert with check (is_site_admin());
  create policy "admin update photos" on photos
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin delete photos" on photos
    for delete using (is_site_admin());

  -- about: single public-facing row, publicly readable, admin-only writes.
  -- Landing-page contact/social strip + hero image: run this once to add
  -- the columns the About admin tab now saves to (safe to re-run; no-ops
  -- if already present). A social platform/contact field only appears on
  -- the public site once it's non-empty — leaving one blank hides it.
  -- hero_image_url overrides the auto-picked featured-photo backdrop when
  -- set, and falls back to it when left empty.
  alter table about add column if not exists facebook_url text;
  alter table about add column if not exists tiktok_url text;
  alter table about add column if not exists whatsapp_number text;
  alter table about add column if not exists hero_image_url text;
  alter table about enable row level security;
  drop policy if exists "public write about" on about;
  drop policy if exists "public update about" on about;
  drop policy if exists "public read about" on about;
  drop policy if exists "admin update about" on about;
  drop policy if exists "admin insert about" on about;
  create policy "public read about" on about for select using (true);
  create policy "admin update about" on about
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin insert about" on about
    for insert with check (is_site_admin());

  -- site_settings (watermark config): publicly readable (it only affects
  -- how public images render), admin-only writes.
  alter table site_settings enable row level security;
  drop policy if exists "public write settings" on site_settings;
  drop policy if exists "public update settings" on site_settings;
  drop policy if exists "public read settings" on site_settings;
  drop policy if exists "admin write settings" on site_settings;
  drop policy if exists "admin update settings" on site_settings;
  create policy "public read settings" on site_settings for select using (true);
  create policy "admin write settings" on site_settings
    for insert with check (is_site_admin());
  create policy "admin update settings" on site_settings
    for update using (is_site_admin()) with check (is_site_admin());

  -- categories / photo_categories: publicly readable, admin-only writes.
  alter table categories enable row level security;
  drop policy if exists "public write categories" on categories;
  drop policy if exists "public update categories" on categories;
  drop policy if exists "public delete categories" on categories;
  drop policy if exists "public read categories" on categories;
  drop policy if exists "admin write categories" on categories;
  drop policy if exists "admin update categories" on categories;
  drop policy if exists "admin delete categories" on categories;
  create policy "public read categories" on categories for select using (true);
  create policy "admin write categories" on categories
    for insert with check (is_site_admin());
  create policy "admin update categories" on categories
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin delete categories" on categories
    for delete using (is_site_admin());

  alter table photo_categories enable row level security;
  drop policy if exists "public write photo_categories" on photo_categories;
  drop policy if exists "public delete photo_categories" on photo_categories;
  drop policy if exists "public read photo_categories" on photo_categories;
  drop policy if exists "admin write photo_categories" on photo_categories;
  drop policy if exists "admin delete photo_categories" on photo_categories;
  create policy "public read photo_categories" on photo_categories for select using (true);
  create policy "admin write photo_categories" on photo_categories
    for insert with check (is_site_admin());
  create policy "admin delete photo_categories" on photo_categories
    for delete using (is_site_admin());

  -- STORAGE: public "photos" bucket — anyone can read (it's the public
  -- gallery), only the admin can upload/replace/delete.
  drop policy if exists "public read photos bucket" on storage.objects;
  drop policy if exists "admin write photos bucket" on storage.objects;
  drop policy if exists "admin update photos bucket" on storage.objects;
  drop policy if exists "admin delete photos bucket" on storage.objects;
  create policy "public read photos bucket" on storage.objects
    for select using (bucket_id = 'photos');
  create policy "admin write photos bucket" on storage.objects
    for insert with check (bucket_id = 'photos' and is_site_admin());
  create policy "admin update photos bucket" on storage.objects
    for update using (bucket_id = 'photos' and is_site_admin());
  create policy "admin delete photos bucket" on storage.objects
    for delete using (bucket_id = 'photos' and is_site_admin());

  -- STORAGE: private "photos-originals" bucket — admin-only for every
  -- operation, including insert. There is still deliberately NO select
  -- policy for anyone but the admin, so a signed-out (or non-admin) request
  -- can never read, list or download an original master file.
  drop policy if exists "anon insert originals" on storage.objects;
  drop policy if exists "admin read originals" on storage.objects;
  drop policy if exists "admin insert originals" on storage.objects;
  drop policy if exists "admin delete originals" on storage.objects;
  create policy "admin read originals" on storage.objects
    for select using (bucket_id = 'photos-originals' and is_site_admin());
  create policy "admin insert originals" on storage.objects
    for insert with check (bucket_id = 'photos-originals' and is_site_admin());
  create policy "admin delete originals" on storage.objects
    for delete using (bucket_id = 'photos-originals' and is_site_admin());

     ================================================================================

     PRIVATE ORIGINALS BUCKET — one-time setup, required before uploading
     will work. Every photo upload now stores the untouched master file
     here FIRST, in a bucket the public site can never read back, before a
     resized-and-watermarked copy is generated and uploaded to the public
     `photos` bucket. Without this bucket, uploads fail (on purpose — see
     uploadFile below) rather than silently publishing with no backup.

     Supabase dashboard -> Storage -> New bucket -> name it exactly
     "photos-originals" -> leave "Public bucket" UNCHECKED. Its access
     policies are set by the ADMIN-ONLY RLS block above.

     ================================================================================

     WATERMARK FEATURE — run this once in the Supabase SQL editor before the
     admin "Watermark" tab or per-photo overrides will have anywhere to save
     to. Until you run it, the site falls back to sensible in-code defaults
     (visible watermark, bottom-right, 35% opacity) and the admin tab will
     just show those defaults with a Save button that creates the row.

  create table if not exists site_settings (
    id int primary key default 1,
    watermark_enabled boolean default true,
    watermark_text text default 'Islem Zrelli',
    watermark_opacity numeric default 0.35,
    watermark_position text default 'bottom-right',
    watermark_x_offset int default 20,
    watermark_y_offset int default 20,
    updated_at timestamptz default now()
  );
  insert into site_settings (id) values (1) on conflict (id) do nothing;

  -- Per-photo override columns
  alter table photos add column if not exists watermark_override boolean default false;
  alter table photos add column if not exists watermark_position text;
  alter table photos add column if not exists watermark_x_offset int;
  alter table photos add column if not exists watermark_y_offset int;

  -- (RLS for site_settings is set in the ADMIN-ONLY RLS block above.)

     ================================================================================

     CATEGORY NAVIGATION — run this once in the Supabase SQL editor before the
     admin "Categories" tab, the per-photo category chips, or the public
     category nav bar will have anywhere to read/write. Until you run it, the
     site falls back gracefully: the public nav just shows "Favorite" alone,
     and the admin Categories tab / photo-editor chips show an empty state.
     "Favorite" itself is a special client-side pseudo-category — it is NOT a
     row in this table — driven entirely by the photos.is_favorite column.

  create table if not exists categories (
    id uuid primary key default gen_random_uuid(),
    name text not null,
    slug text not null,
    sort_order int default 0,
    is_visible boolean default true,
    created_at timestamptz default now()
  );

  create table if not exists photo_categories (
    photo_id bigint references photos(id) on delete cascade,
    category_id uuid references categories(id) on delete cascade,
    primary key (photo_id, category_id)
  );
  -- NOTE: adjust photo_id's type above to match your photos.id column type
  -- (bigint/int8 is Supabase's default identity type — change to uuid if
  -- your photos table uses uuid primary keys instead).

  alter table photos add column if not exists is_favorite boolean default false;

  -- Seed the six starting categories (Favorite is not included — see above):
  insert into categories (name, slug, sort_order) values
    ('Air Pollution', 'air-pollution', 0),
    ('Sea Pollution', 'sea-pollution', 1),
    ('Dead Animals',  'dead-animals',  2),
    ('Wall',          'wall',          3),
    ('Landscape',     'landscape',     4)
  on conflict do nothing;

  -- (RLS for categories/photo_categories is set in the ADMIN-ONLY RLS block above.)

  ================================================================================ */

  // Storage adapter picks localStorage (persists across browser restarts)
  // when the admin checked "Remember me" on their last login, sessionStorage
  // (cleared when the browser/tab closes) otherwise. The flag itself is not
  // sensitive — it's just a UI preference — so it's fine to keep in
  // localStorage regardless of which storage ends up holding the session.

  function categorySlugFromPath(path){

    var m = String(path || '').replace(/\/+$/, '').match(re);

  function selectCategory(slug, opts){
    opts = opts || {};
    var list = navCategoryList();
    if(!list.some(function(c){ return c.slug === slug; })) return;
    currentCategorySlug = slug;
    activePhotos = photosForCategory(slug);
    renderCategoryNav();
    renderScenes();
    if(activePhotos.length) injectGalleryLd(activePhotos);
    if(!opts.skipHead) updateHeadForCategory(slug);

  // Draws the hero signature like it's being written, then lets the ink
  // "settle" into a solid fill. Runs once per page load — the landing hero
  // is only ever seen fresh (there's no client-side route change back to
  // it), so "every time someone enters the site" and "on load" are the
  // same event here.
  //
  // This animates a real <text> element (correct, legible letterforms) —
  // not a hand-authored calligraphy path — so there's nothing to draw
  // incorrectly. Text elements don't support getTotalLength(), so instead
  // of measuring the exact stroke length we use a dasharray/dashoffset
  // value (4000) that's comfortably longer than the glyphs' total stroke
  // perimeter at this font size within the SVG's fixed 700-wide viewBox —
  // since the viewBox coordinate space doesn't change with screen size,
  // one constant works everywhere.
  (function animateSignature(){
    var text = document.getElementById('signatureText');
    if(!text) return;
    if(reduceMotion) return; // CSS already shows it fully filled, no JS needed
    var DASH = 4000;
    text.style.strokeDasharray = DASH;
    text.style.strokeDashoffset = DASH;
    // Force layout so the browser registers the starting offset before
    // the transition below is triggered — otherwise it can jump straight
    // to the end state instead of animating.
    text.getBoundingClientRect();
    text.style.transition = 'stroke-dashoffset 1500ms cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        text.style.strokeDashoffset = '0';
      });
    });
    setTimeout(function(){ text.classList.add('filled'); }, 1150);
  })();

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){

  /* ================= SEO: slugs, clean URLs, dynamic head ================= */

  function slugify(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80) || 'photo';
  }

  function ensureSlugs(list){
    var seen = {};
    list.forEach(function(p){
      var base = slugify(p.title);
      var slug = base, n = 2;
      while(seen[slug]){ slug = base + '-' + n; n++; }
      seen[slug] = true;
      p._slug = slug;
    });
  }

  function updateHeadForPhoto(p){

    setMetaContent('meta[name="description"]', desc);

    setMetaContent('meta[property="og:description"]', DEFAULT_DESC);

  function injectPhotoLd(p, url){
    var el = document.getElementById('ldPhoto');
    if(!el){

      el.id = 'ldPhoto';
      document.head.appendChild(el);

    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Photograph",
      "name": p.title,
      "description": p.story || '',
      "contentUrl": p.image_url,
      "url": url,
      "creator": { "@type": "Person", "name": "Islem Zrelli" },
      "contentLocation": p.location ? { "@type": "Place", "name": p.location } : undefined,
      "genre": p.category || undefined

    var el = document.getElementById('ldGallery');

  function slugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // escape for regex (dots in the repo/domain name)
    var re = new RegExp('^' + base + '\\/work\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;

  function applyInitialRoute(){
    var catSlug = categorySlugFromPath(window.location.pathname);

      updateHeadForCategory(catSlug);
      return;
    }
    var slug = slugFromPath(window.location.pathname);
    if(!slug) return;
    var match = photos.find(function(p){ return p._slug === slug; });
    if(!match) return;
    // A deep link to a specific photo may point at one outside the current
    // (default Favorite) category — widen to every photo so the scene
    // actually exists in the DOM to scroll to.
    if(activePhotos.indexOf(match) === -1){

      renderCategoryNav();
      renderScenes();

    updateHeadForPhoto(match);
    var el = document.getElementById('scene-' + match.id);
    if(!el) return;
    var targetImg = el.querySelector('.frame-img img[data-src]');
    if(targetImg && !targetImg.getAttribute('src')) targetImg.setAttribute('src', targetImg.getAttribute('data-src'));

  /* ================= PUBLIC SITE ================= */

  // back to the first published photo so the hero still gets an image

  // same blur/desaturate/darken-to-clear treatment used on every scene
  // and the finale photo, so the very first thing a visitor sees is
  // consistent with the rest of the site rather than a plain text splash.
  function renderHeroBackdrop(){
    var backdrop = document.getElementById('heroBackdrop');
    var img = document.getElementById('heroBackdropImg');
    if(!backdrop || !img) return;
    // A landing-page image picked in the About admin tab always wins;
    // only falls back to the featured/first gallery photo when none is set.
    var url = about.hero_image_url || (photos.find(function(p){ return p.featured; }) || photos[0] || {}).image_url;
    if(!url){
      backdrop.style.display = 'none';
      return;
    }
    backdrop.style.display = '';
    function reveal(){ backdrop.classList.add('in-view'); }
    if(img.complete && img.naturalWidth && img.src === url){ requestAnimationFrame(reveal); }
    else { backdrop.classList.remove('in-view'); img.addEventListener('load', reveal, { once:true }); }
    img.src = url;
  }

  // Quiet contact/social strip near the bottom of the hero. Driven entirely
  // by the `about` row loaded in loadPublicData — nothing here is hard-coded,
  // and each link only appears once its URL/email/number is actually set in
  // the About admin tab. Two short rows: social platforms, then direct
  // contact — matching the "Instagram · Facebook · TikTok / Email · WhatsApp"
  // layout, with any missing platform simply omitted rather than left blank.
  function renderHeroContact(){
    var el = document.getElementById('heroContact');
    if(!el) return;

    var socialLinks = [
      about.instagram_url ? { label:'Instagram', href:about.instagram_url } : null,
      about.facebook_url  ? { label:'Facebook',  href:about.facebook_url }  : null,
      about.tiktok_url    ? { label:'TikTok',    href:about.tiktok_url }    : null
    ].filter(Boolean);

    var directLinks = [];
    if(about.contact_email){
      directLinks.push({ label:'Email', href:'mailto:'+about.contact_email });
    }
    if(about.whatsapp_number){
      var digits = String(about.whatsapp_number).replace(/[^0-9]/g, '');
      if(digits) directLinks.push({ label:'WhatsApp', href:'https://wa.me/'+digits });
    }

    function renderRow(links){
      if(!links.length) return '';
      return '<div class="hero-contact-row">'+links.map(function(l, i){
        var external = l.href.indexOf('mailto:') !== 0;
        return (i > 0 ? '<span class="dot" aria-hidden="true">&middot;</span>' : '')+
          '<a href="'+escapeHtml(l.href)+'"'+(external ? ' target="_blank" rel="noopener noreferrer"' : '')+'>'+escapeHtml(l.label)+'</a>';
      }).join('')+'</div>';
    }

    el.innerHTML = renderRow(socialLinks) + renderRow(directLinks);
    el.classList.toggle('has-content', socialLinks.length > 0 || directLinks.length > 0);

  // The landing-page count is the total number of published photographs

  // uses everywhere else, so this reuses that data rather than a new query.
  // The line stays hidden (see the inline style on #heroLocationLine) until

  function updateHeroPhotoCount(){
    if(!heroPhotoCountEl || !heroLocationLineEl) return;

  function renderScenes(){
    var list = activePhotos;
    var total = list.length;
    var scenesTrack = document.getElementById('scenesTrack');

    if(total === 0){
      scenesTrack.innerHTML = '<div class="empty-state">No photographs in this category yet.</div>';
      return;

    var html = '';
    list.forEach(function(s, i){
      var num = String(i+1).padStart(2,'0');

  var ioInstance = null;
  var imgNearObserver = null, imgFarObserver = null;
  // Custom image loading, not relying on the browser's native loading="lazy" —
  // some in-app/embedded browsers (this is what was crashing in Telegram's
  // in-app browser) don't reliably honor it, and with hundreds of photos that
  // means every full-size image trying to load at once. This preloads a
  // photo shortly before it's needed and frees it again once you've
  // scrolled well past it, so memory use stays bounded regardless of gallery size.
  function setupImageLazyLoading(){
    if(imgNearObserver) imgNearObserver.disconnect();
    if(imgFarObserver) imgFarObserver.disconnect();
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.frame-img img[data-src]'));
    if(!imgs.length) return;
    imgNearObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var img = entry.target;
        var src = img.getAttribute('data-src');
        if(src && img.getAttribute('src') !== src) img.setAttribute('src', src);
      });
    }, { root: scroller, rootMargin: '150% 0px', threshold: 0 });
    imgFarObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting) return;
        var img = entry.target;
        if(img.getAttribute('src')) img.removeAttribute('src'); // data-src keeps the URL so it reloads on the way back
      });
    }, { root: scroller, rootMargin: '400% 0px', threshold: 0 });
    imgs.forEach(function(img){ imgNearObserver.observe(img); imgFarObserver.observe(img); });
  }

  function setupSceneBehavior(){
    var allScenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
    if(ioInstance) ioInstance.disconnect();
    ioInstance = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.55){
          entry.target.classList.add('in-view');
          var slug = entry.target.getAttribute('data-slug');
          if(slug){
            var match = photos.find(function(p){ return p._slug === slug; });
            if(match) updateHeadForPhoto(match);
          } else {
            resetHeadToDefault();
          }
        } else if (entry.intersectionRatio < 0.15) {
          entry.target.classList.remove('in-view');
        }
      });
    }, { root: scroller, threshold:[0, .15, .55, .8] });
    allScenes.forEach(function(s){ ioInstance.observe(s); });
    requestAnimationFrame(function(){ allScenes[0] && allScenes[0].classList.add('in-view'); });

    setupImageLazyLoading();
    window._allScenes = allScenes;
    updateScrollNavState();

  // Desktop/trackpad "TikTok-style" scene advance, shared by wheel input
  // (see the listener below) and the up/down .scroll-nav buttons. Touch is
  // left to native momentum + CSS scroll-snap:mandatory (tuned above), which
  // already guarantees landing on a full scene on phones. Wheel input and
  // button clicks don't have that native momentum-to-snap behavior, so this
  // buffers a short burst of wheel deltas (or a single button press) into
  // one deliberate move that always lands exactly on a scene.
  var sceneNav = (function setupSceneNav(){
    var isAnimating = false;
    var scrollAnimFrame = null;
    var wheelBuffer = 0;
    var wheelTimer = null;
    var ADVANCE_DURATION = 420; // ms — matches the site's --dur-1 easing feel
    var BUFFER_WINDOW = 70;     // ms — how long a wheel "burst" is allowed to accumulate

    function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); } // close match to var(--ease)

    function cancelAnim(){
      if(scrollAnimFrame){ cancelAnimationFrame(scrollAnimFrame); scrollAnimFrame = null; }
      isAnimating = false;
    }

    function animateScrollTo(targetTop){
      cancelAnim();
      var startTop = scroller.scrollTop;
      var distance = targetTop - startTop;
      if(Math.abs(distance) < 1) return;
      isAnimating = true;
      // scroll-snap-type:mandatory (see .scroller) fights a manually-driven
      // scrollTop animation on some browsers — once our per-frame writes
      // stop, the browser re-asserts its own snap and can land one scene
      // further than intended, which reads as the advance "skipping" a
      // photo. Suspending snap for the duration of the animation and
      // restoring it the instant we land exactly on the target scene
      // avoids that fight entirely.
      scroller.style.scrollSnapType = 'none';
      var startTime = null;
      function step(ts){
        if(startTime === null) startTime = ts;
        var t = Math.min(1, (ts - startTime) / ADVANCE_DURATION);
        scroller.scrollTop = startTop + distance * easeOutExpo(t);
        if(t < 1){ scrollAnimFrame = requestAnimationFrame(step); }
        else { isAnimating = false; scrollAnimFrame = null; scroller.style.scrollSnapType = ''; }
      }
      scrollAnimFrame = requestAnimationFrame(step);
    }

    // The full slide list for navigation purposes: the hero counts as
    // slide 0, followed by every .scene (photos + finale). This is
    // deliberately separate from window._allScenes (which setupSceneBehavior
    // uses for its own IntersectionObserver/lazy-load bookkeeping and stays
    // photos-only) — navSlides() is only ever used to answer "where am I,
    // and where's next" for wheel/keyboard/buttons/enter-gallery, so the
    // hero can be a first-class stop in that sequence without having to
    // pretend it's a photo scene anywhere else in the code.
    function navSlides(){
      return [heroEl].concat(window._allScenes || []);
    }

    function currentSceneIndex(){
      var slides = navSlides();
      var best = 0, bestDist = Infinity;
      slides.forEach(function(s, i){
        var d = Math.abs(s.offsetTop - scroller.scrollTop);
        if(d < bestDist){ bestDist = d; best = i; }
      });
      return best;
    }

    function goToSceneIndex(i){
      var slides = navSlides();
      if(!slides.length) return;
      i = Math.max(0, Math.min(slides.length - 1, i));
      animateScrollTo(slides[i].offsetTop);
    }

    scroller.addEventListener('wheel', function(e){
      if(window.innerWidth < 768) return; // touch devices use native scroll+snap instead
      e.preventDefault();
      if(isAnimating) return; // ignore extra input while settling — avoids overshoot/jitter
      wheelBuffer += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function(){
        var dir = wheelBuffer > 0 ? 1 : -1;
        var mag = Math.abs(wheelBuffer);
        var advance = 1;
        if(mag > 260) advance = 2;
        if(mag > 520) advance = 3;
        goToSceneIndex(currentSceneIndex() + dir * advance);
        wheelBuffer = 0;
      }, BUFFER_WINDOW);
    }, { passive:false });

    return { goToSceneIndex: goToSceneIndex, currentSceneIndex: currentSceneIndex, navSlides: navSlides };
  })();

  function updateScrollNavState(){
    var slides = sceneNav.navSlides();
    if(!slides.length){ scrollUpBtn.disabled = true; scrollDownBtn.disabled = true; return; }
    var i = sceneNav.currentSceneIndex();
    scrollUpBtn.disabled = (i <= 0);
    scrollDownBtn.disabled = (i >= slides.length - 1);
  }

  // Bakes the EXIF rotation into the actual pixels so the photo displays
  // upright everywhere, caps the resolution per orientation, and re-encodes
  // to WebP. Phone cameras produce huge originals (12+ MP / 20-50MB); this
  // is what keeps Storage costs and load times sane, and is also what was
  // crashing memory-constrained mobile browsers (e.g. "A problem repeatedly
  // occurred" in Safari/Telegram's in-app browser) when the old code loaded
  // full-size gallery photos. Never upscales — if the source is already
  // smaller than the target, it's re-encoded at its native size.
  // Instagram-style ratio label, purely derived from stored width/height —
  // no separate DB field needed since it's just formatting of data we
  // already capture at upload time.
  var KNOWN_RATIOS = [
    { name:'1:1',  value:1 },
    { name:'4:5',  value:4/5 },
    { name:'2:3',  value:2/3 },
    { name:'9:16', value:9/16 },
    { name:'16:9', value:16/9 },
    { name:'3:2',  value:3/2 },
    { name:'4:3',  value:4/3 },
    { name:'3:4',  value:3/4 }
  ];
  function getAspectRatioName(width, height){
    if(!width || !height) return null;
    var ratio = width / height;
    var best = null, bestDiff = Infinity;
    KNOWN_RATIOS.forEach(function(r){
      var diff = Math.abs(ratio - r.value);
      if(diff < bestDiff){ bestDiff = diff; best = r; }
    });
    if(best && bestDiff < 0.025) return best.name;
    // Not a close match to a common ratio — show the decimal ratio rather
    // than a raw pixel-reduced fraction (which can be an ugly large pair
    // once resize/rounding nudges it off an exact ratio).
    return ratio.toFixed(2) + ':1';
  }

  var MAX_PORTRAIT_H = 1800, MAX_PORTRAIT_W = 1200;
  var MAX_LANDSCAPE_W = 2000;
  var WEBP_QUALITY = 0.85;

  // Formats a byte count the same way for both sides of the before/after
  // panel — always computed from a real File/Blob's .size, never guessed.
  function formatBytes(bytes){
    if(bytes == null || isNaN(bytes)) return '—';
    if(bytes < 1024) return bytes + ' B';
    var kb = bytes / 1024;
    if(kb < 1024) return kb.toFixed(kb < 10 ? 1 : 0) + ' KB';
    var mb = kb / 1024;
    return mb.toFixed(mb < 10 ? 1 : 0) + ' MB';
  }
  var IMAGE_FORMAT_LABELS = { 'image/jpeg':'JPEG', 'image/jpg':'JPEG', 'image/png':'PNG', 'image/webp':'WebP', 'image/gif':'GIF', 'image/heic':'HEIC', 'image/heif':'HEIF', 'image/avif':'AVIF', 'image/svg+xml':'SVG', 'image/tiff':'TIFF' };
  function formatImageFormatLabel(mime){
    if(!mime) return '—';
    return IMAGE_FORMAT_LABELS[mime] || mime.replace('image/','').toUpperCase();
  }

  // Renders the compact "optimized" report panel in the photo form from
  // the real numbers uploadFile() measured off the actual uploaded and
  // processed files (see uploadFile below) — nothing here is estimated.
  function renderOptimizeResult(res){
    var panel = document.getElementById('photoOptimizeResult');
    if(!panel) return;
    if(!res.resized || res.origWidth == null || res.origSize == null){
      // Nothing was actually resized (unsupported file type, or the
      // browser lacked canvas/createImageBitmap support and the original
      // was uploaded as-is) — say so plainly instead of showing a fake
      // "0% smaller" result.
      panel.style.display = 'block';
      panel.innerHTML = '<div class="opt-note">Not optimized — uploaded as-is (unsupported format or browser).</div>';
      return;
    }
    var beforeDims = res.origWidth + ' × ' + res.origHeight;
    var afterDims = res.width + ' × ' + res.height;
    var beforeSize = formatBytes(res.origSize);
    var afterSize = formatBytes(res.processedSize);
    var beforeFmt = formatImageFormatLabel(res.origType);
    var afterFmt = formatImageFormatLabel(res.processedType);
    var reductionPct = res.origSize > 0 ? (100 * (1 - (res.processedSize / res.origSize))) : 0;
    var reductionLabel = reductionPct >= 0
      ? reductionPct.toFixed(1) + '% smaller'
      : Math.abs(reductionPct).toFixed(1) + '% larger';
    panel.style.display = 'block';
    panel.innerHTML =
      '<div class="opt-before">Photo uploaded ✓<br>'+escapeHtml(beforeDims)+' · '+escapeHtml(beforeSize)+' · '+escapeHtml(beforeFmt)+'</div>'+
      '<div class="opt-arrow">↓</div>'+
      '<div class="opt-after">Optimized ✓<br>'+escapeHtml(afterDims)+' · '+escapeHtml(afterSize)+' · '+escapeHtml(afterFmt)+'</div>'+
      '<div class="opt-reduction">'+escapeHtml(reductionLabel)+'</div>';
  }

  var _webpSupported = null;
  function supportsWebP(){
    if(_webpSupported !== null) return _webpSupported;
    try{
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      _webpSupported = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
    } catch(e){ _webpSupported = false; }
    return _webpSupported;
  }

  // Draws the watermark text directly onto the canvas pixels — this is
  // the step that replaces the old CSS `.wm-frame::after` overlay. Once
  // this has run and the canvas is exported to a blob, the mark is part
  // of the image data itself; there's no DOM node, no CSS, nothing a
  // viewer could inspect-element or strip out to get a clean copy, and
  // (see uploadFile below) no unwatermarked version of this file is ever
  // uploaded anywhere the public can reach.
  // Reuses watermarkConfigFor() — the same global/per-photo-override
  // merge the old live overlay used — so admin settings mean exactly
  // what they used to; only where they're applied has changed.
  function drawWatermarkOnCanvas(ctx, canvasW, canvasH, wm){
    if(!wm || !wm.text) return;
    var shortSide = Math.min(canvasW, canvasH);
    // Scales with the image so a phone snapshot and a full-frame master
    // both get a proportionally similar, subtle mark (deliverable:
    // "scale appropriately for different image dimensions").
    var fontSize = Math.max(14, Math.round(shortSide * 0.026));
    var pad = Math.max(wm.x || 0, wm.y || 0, Math.round(shortSide * 0.02), 14);
    var padX = Math.max(wm.x != null ? wm.x : pad, 10);
    var padY = Math.max(wm.y != null ? wm.y : pad, 10);
    var text = (wm.text || 'Islem Zrelli').toUpperCase();

    ctx.save();
    ctx.font = 'italic 500 ' + fontSize + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    var textW = ctx.measureText(text).width;
    var x, y;
    switch(wm.position){
      case 'bottom-left':   x = padX;                y = canvasH - padY;              break;
      case 'top-right':     x = canvasW - padX - textW; y = padY + fontSize;           break;
      case 'top-left':      x = padX;                y = padY + fontSize;              break;
      case 'center-bottom': x = (canvasW - textW)/2;  y = canvasH - padY;              break;
      case 'center':        x = (canvasW - textW)/2;  y = (canvasH + fontSize*0.35)/2; break;
      case 'bottom-right':
      default:               x = canvasW - padX - textW; y = canvasH - padY;           break;
    }
    // A soft dark shadow first, then a translucent white fill on top —
    // keeps the mark readable on both light and dark photographs, the
    // same trick the old CSS text-shadow used to pull off live in-browser
    // (deliverable: "remain readable on both light and dark photographs").
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = fontSize * 0.4;
    ctx.shadowOffsetY = fontSize * 0.06;
    ctx.fillStyle = 'rgba(255,255,255,' + (wm.opacity != null ? wm.opacity : 0.35) + ')';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // wmOverride, when passed, is read live from the currently-open photo
  // form's override checkbox/position/x/y fields (see the photoFile
  // change handler below) so a per-photo override in progress is honored
  // even though burn-in now happens at upload time rather than render
  // time. skipWatermark is used for the About-page portrait, which isn't
  // one of the documentary photographs this feature is protecting.
  async function processImageForUpload(file, wmOverride, skipWatermark){
    if(!file.type || file.type.indexOf('image/') !== 0 || file.type === 'image/svg+xml'){
      // Not a resizable raster type (or no type at all) — passed through
      // untouched. origWidth/origHeight are unknown here since we never
      // decode the file, which is also the signal the report panel uses
      // to know no optimization happened.
      return { file: file, width: null, height: null, origWidth: null, origHeight: null, resized: false };
    }
    try{
      var bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      var w = bitmap.width, h = bitmap.height;
      var isPortrait = h >= w;
      var scale = isPortrait
        ? Math.min(1, MAX_PORTRAIT_W / w, MAX_PORTRAIT_H / h)
        : Math.min(1, MAX_LANDSCAPE_W / w);
      var outW = Math.round(w * scale), outH = Math.round(h * scale);

      var canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, outW, outH);
      bitmap.close && bitmap.close();

      if(!skipWatermark){
        var wm = watermarkConfigFor(wmOverride);
        drawWatermarkOnCanvas(ctx, outW, outH, wm);
      }

      var useWebp = supportsWebP();
      var mime = useWebp ? 'image/webp' : 'image/jpeg';
      var extension = useWebp ? '.webp' : '.jpg';
      var blob = await new Promise(function(resolve){
        canvas.toBlob(function(b){ resolve(b); }, mime, WEBP_QUALITY);
      });
      if(!blob) return { file: file, width: w, height: h, origWidth: w, origHeight: h, resized: false };

      var baseName = file.name.replace(/\.\w+$/, '') || 'photo';
      var processed = new File([blob], baseName + extension, { type: mime });
      return { file: processed, width: outW, height: outH, origWidth: w, origHeight: h, resized: true };
    } catch(e){
      return { file: file, width: null, height: null, origWidth: null, origHeight: null, resized: false }; // browser doesn't support it — fall back to the original file
    }
  }

  // Upload flow, in order:
  //   1) the untouched original goes to the PRIVATE bucket first. If this
  //      fails — most likely because the one-time bucket setup above
  //      hasn't been done yet — we stop here on purpose. Publishing a
  //      watermarked copy with no private master saved anywhere would
  //      silently lose the original forever the moment this tab closes.
  //   2) only once the master is safely stored do we resize + burn in
  //      the watermark and upload THAT to the public bucket. image_url
  //      (and every public photo record) ends up pointing at this file
  //      only — the private path from step 1 is never returned to any
  //      public-facing code and never saved to the `photos` table.
  async function uploadFile(file, wmOverride, skipWatermark){
    var baseName = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    var origExt = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var originalPath = baseName + '.' + origExt;
    var originalUpload = await sb.storage.from(ORIGINALS_BUCKET).upload(originalPath, file, { contentType: file.type });
    if(originalUpload.error){
      throw new Error('Could not save the original privately (' + originalUpload.error.message + '). Set up the "' + ORIGINALS_BUCKET + '" bucket first — see the PRIVATE ORIGINALS BUCKET note near the top of this file — then try again.');
    }

    var processed = await processImageForUpload(file, wmOverride, skipWatermark);
    var pubFile = processed.file;
    var ext = (pubFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var publicPath = baseName + '-web.' + ext;
    var uploadRes = await sb.storage.from(BUCKET).upload(publicPath, pubFile, { contentType: pubFile.type });
    if(uploadRes.error) throw new Error(uploadRes.error.message);
    var urlRes = sb.storage.from(BUCKET).getPublicUrl(publicPath);
    // origSize/processedSize/format info here is read straight off the real
    // File/Blob objects that were actually uploaded — never estimated — so
    // the admin "before/after" panel reflects exactly what's now stored.
    return {
      url: urlRes.data.publicUrl,
      width: processed.width,
      height: processed.height,
      origWidth: processed.origWidth,
      origHeight: processed.origHeight,
      origSize: file.size,
      origType: file.type,
      processedSize: pubFile.size,
      processedType: pubFile.type,
      resized: !!processed.resized
    };
  }

      await loadCategories();

      drawPhotosAdmin();

    if(editingPhoto) wirePhotoForm();

    adminScroll.querySelectorAll('.admin-row').forEach(function(row){
      var id = row.getAttribute('data-id');
      var photo = adminPhotos.find(function(p){ return String(p.id) === id; });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var act = btn.getAttribute('data-act');
          if(act === 'edit'){
            await Promise.all([loadCategories(), loadPhotoCategories()]);
            editingPhoto = Object.assign({}, photo);
            editingPhoto.category_ids = (photoCategoryMap[photo.id] || []).slice();
            drawPhotosAdmin();
            return;
          }
          if(act === 'delete'){
            if(!confirm('Delete "'+photo.title+'"? This cannot be undone.')) return;
            await sb.from('photos').delete().eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'publish'){
            await sb.from('photos').update({ published: !photo.published }).eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'feature'){
            await sb.from('photos').update({ featured: !photo.featured }).eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'up' || act === 'down'){
            var idx = adminPhotos.findIndex(function(p){ return String(p.id) === id; });
            var swapIdx = act === 'up' ? idx - 1 : idx + 1;
            if(swapIdx < 0 || swapIdx >= adminPhotos.length) return;
            var other = adminPhotos[swapIdx];
            await Promise.all([
              sb.from('photos').update({ display_order: other.display_order }).eq('id', photo.id),
              sb.from('photos').update({ display_order: photo.display_order }).eq('id', other.id)
            ]);
            renderPhotosAdmin();
          }
        });
      });
    });
  }

  function wirePhotoForm(){
    document.getElementById('photoCancelBtn').addEventListener('click', function(){ editingPhoto = null; drawPhotosAdmin(); });
    document.getElementById('f-wm-override').addEventListener('change', function(){
      document.getElementById('wmOverrideFields').style.display = this.checked ? 'grid' : 'none';
    });
    document.querySelectorAll('.cat-chip-input').forEach(function(inp){
      inp.addEventListener('change', function(){ inp.closest('.cat-chip').classList.toggle('checked', inp.checked); });
    });
    document.getElementById('photoFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('photoUploading');
      uploadingEl.style.display = 'inline';
      try{
        // Read the override fields as they stand right now — the
        // watermark is burned in during THIS upload, not at save time,
        // so if you want a custom position/offset for this photo, check
        // "Custom position for this photo" and set it BEFORE choosing
        // the file (or just re-choose the file afterwards to re-bake it).
        var wmOverride = {
          watermark_override: document.getElementById('f-wm-override').checked,
          watermark_position: document.getElementById('f-wm-position').value,
          watermark_x_offset: parseInt(document.getElementById('f-wm-x').value,10) || 0,
          watermark_y_offset: parseInt(document.getElementById('f-wm-y').value,10) || 0
        };
        var res = await uploadFile(file, wmOverride, false);
        editingPhoto.image_url = res.url;
        editingPhoto.image_width = res.width;
        editingPhoto.image_height = res.height;
        var preview = document.getElementById('photoPreview');
        preview.src = res.url;
        preview.style.display = 'block';
        var ratioBadge = document.getElementById('photoRatioBadge');
        var ratioName = getAspectRatioName(res.width, res.height);
        if(ratioName){ ratioBadge.textContent = ratioName; ratioBadge.style.display = 'inline-block'; }
        else { ratioBadge.style.display = 'none'; }
        renderOptimizeResult(res);
      } catch(err){
        showPhotoFormError(err.message);
      } finally {
        uploadingEl.style.display = 'none';
      }
    });
    document.getElementById('photoSaveBtn').addEventListener('click', async function(){
      var selectedCatIds = Array.prototype.slice.call(document.querySelectorAll('.cat-chip-input:checked')).map(function(el){ return el.value; });
      var payload = {
        title: document.getElementById('f-title').value || 'Untitled',
        story: document.getElementById('f-story').value,
        category: document.getElementById('f-category').value,
        location: document.getElementById('f-location').value,
        date: document.getElementById('f-date').value || null,
        alt_text: document.getElementById('f-alt').value,
        published: document.getElementById('f-published').checked,
        featured: document.getElementById('f-featured').checked,
        is_favorite: document.getElementById('f-favorite').checked,
        image_url: editingPhoto.image_url,
        image_width: editingPhoto.image_width || null,
        image_height: editingPhoto.image_height || null,
        watermark_override: document.getElementById('f-wm-override').checked,
        watermark_position: document.getElementById('f-wm-override').checked ? document.getElementById('f-wm-position').value : null,
        watermark_x_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-x').value,10)||0) : null,
        watermark_y_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-y').value,10)||0) : null
      };
      if(!payload.image_url){ showPhotoFormError('Please upload a photo first.'); return; }
      var saveBtn = document.getElementById('photoSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      var result;
      if(editingPhoto.id){
        result = await sb.from('photos').update(payload).eq('id', editingPhoto.id).select().single();
      } else {
        var maxOrder = adminPhotos.reduce(function(m,p){ return Math.max(m, p.display_order||0); }, -1);
        payload.display_order = maxOrder + 1;
        result = await sb.from('photos').insert(payload).select().single();
      }
      if(result.error){
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
        showPhotoFormError(result.error.message);
        return;
      }
      var savedId = (result.data && result.data.id) || editingPhoto.id;
      // Sync the many-to-many category assignment: clear, then re-insert
      // whatever's currently checked. Never touches the categories or
      // photos themselves.
      try{
        await sb.from('photo_categories').delete().eq('photo_id', savedId);
        if(selectedCatIds.length){
          await sb.from('photo_categories').insert(selectedCatIds.map(function(cid){ return { photo_id: savedId, category_id: cid }; }));
        }
      } catch(e){ /* photo_categories table not created yet — see SQL note above */ }
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      editingPhoto = null;
      renderPhotosAdmin();
    });
  }
