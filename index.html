    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Islem Zrelli — Photo Stories",
      "url": SITE_URL + '/',
      "image": list.map(function(p){ return p.image_url; })
    });
  }

  function slugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // escape for regex (dots in the repo/domain name)
    var re = new RegExp('^' + base + '\\/work\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;
  }


  // Releases the .route-pending gate set near animateHeroEntrance (if it
  // was set at all — on a plain first visit it never is, and this whole
  // file has no effect). stayedOnHero tells it whether the hero's own
  // entrance animation still needs to run: every branch of
  // applyInitialRoute() that does NOT set scroller.scrollTop to jump
  // somewhere else counts as "stayed on hero", since the visitor is still
  // looking at scrollTop 0 either way.
  function revealScroller(stayedOnHero){
    if(stayedOnHero) animateHeroEntrance();
    if(scroller) scroller.classList.remove('route-pending');
  }

  // Given a photo (found only via its own /work/<slug>/ URL, which carries
  // no category info), figures out which category to restore the visitor
  // into. This is what lets "browsing PEOPLE, on Photo 17, then refresh"
  // actually come back to PEOPLE instead of falling back to an uncategorized
  // flat list — see applyInitialRoute() below. Prefers a real category (in
  // the admin's own display order) over the Favorite pseudo-category, since
  // a photo can be a favorite AND belong to a specific story at once, and
  // the specific story is the more useful context to land back in.
  function categoryForPhoto(photo){
    if(!photo) return null;
    var ids = photoCategoryMap[photo.id] || [];
    if(ids.length){
      var cat = categories.find(function(c){ return ids.indexOf(c.id) !== -1 && c.is_visible !== false; });
      if(cat) return cat.slug;
    }
    if(photo.is_favorite) return 'favorite';
    return null;
  }

  function applyInitialRoute(){
    var catSlug = categorySlugFromPath(window.location.pathname);
    if(catSlug && catSlug !== 'favorite'){
      scrollNav.classList.add('show');
      document.getElementById('catNav').classList.add('show');
      langSwitch.classList.remove('show'); // deep link starts inside the gallery, not the landing page
      updateHeadForCategory(catSlug);
      revealScroller(true);
      return;
    }
    var slug = slugFromPath(window.location.pathname);
    if(!slug){
      // Always start fresh on the landing page for a plain visit/refresh —
      // no silent jump into the gallery based on a remembered scroll
      // position. Only an explicit /work/... or /category/... URL (handled
      // above and below) should land anywhere but the hero.
      revealScroller(true);
      return;
    }
    var match = photos.find(function(p){ return p._slug === slug; });
    if(!match){ revealScroller(true); return; }
    // A deep link to a specific photo may point at one outside the current
    // (default Favorite) category. Restore into whichever real category
    // actually contains it — same engine selectCategory() already uses for
    // the category nav buttons — rather than always widening to every
    // photo, which used to erase the category context entirely.
    if(activePhotos.indexOf(match) === -1){
      var bestSlug = categoryForPhoto(match);
      if(bestSlug){
        selectCategory(bestSlug, { skipHistory:true, skipScrollReset:true, skipHead:true });
      } else {
        currentCategorySlug = null;
        activePhotos = photos.slice();
        renderCategoryNav();
        renderScenes();
      }
    }
    updateHeadForPhoto(match);
    var el = document.getElementById('scene-' + match.id);
    if(!el){ revealScroller(true); return; }
    var targetImg = el.querySelector('.frame-img img[data-src]');
    if(targetImg && !targetImg.getAttribute('src')) targetImg.setAttribute('src', targetImg.getAttribute('data-src'));
    // Landing directly on a photo's URL: jump straight past the hero into
    // the gallery, then to this exact scene — no animation, since this is
    // the page's starting state, not a user-triggered scroll.
    scroller.scrollTop = el.offsetTop;
    scrollNav.classList.add('show');
    document.getElementById('catNav').classList.add('show');
    langSwitch.classList.remove('show'); // deep link starts inside the gallery, not the landing page
    revealScroller(false);
  }

  /* ================= PUBLIC SITE ================= */

  // Picks the featured photo (set via the admin panel's "Feature" toggle,
  // previously unused on the public site) as the hero backdrop, falling
  // back to the first published photo so the hero still gets an image
  // even before anything's been explicitly featured. Reveals it with the
  // same blur/desaturate/darken-to-clear treatment used on every scene
  // and the finale photo, so the very first thing a visitor sees is
  // consistent with the rest of the site rather than a plain text splash.
  function renderHeroBackdrop(){
    var backdrop = document.getElementById('heroBackdrop');
    var img = document.getElementById('heroBackdropImg');
    if(!backdrop || !img) return;
    // A landing-page image picked in the admin's Landing Page tab always
    // wins; only falls back to the featured/first gallery photo when none
    // is set (e.g. a brand-new site before the admin has picked one).
    var url = about.hero_image_url || (photos.find(function(p){ return p.featured; }) || photos[0] || {}).image_url;
    if(!url){
      backdrop.style.display = 'none';
      return;
    }
    backdrop.style.display = '';
    applyHeroCrop(img);
    function reveal(){ backdrop.classList.add('in-view'); }
    if(img.complete && img.naturalWidth && img.src === url){ requestAnimationFrame(reveal); }
    else { backdrop.classList.remove('in-view'); img.addEventListener('load', reveal, { once:true }); }
    img.src = url;
  }

  // Reproduces the admin's chosen landing-image composition (see the
  // "Position & Crop" tool in the Landing Page admin tab) on the actual
  // public backdrop. object-position is a PERCENTAGE of the image, so the
  // one stored focal point re-crops correctly at every viewport size —
  // deliberately not a hard-coded `object-position: center`. Falls back to
  // dead-center, no zoom, for sites that haven't set a crop yet.
  function applyHeroCrop(img){
    var crop = Object.assign({ scale:1, x:50, y:50 }, about.hero_crop || {});
    img.style.objectPosition = crop.x + '% ' + crop.y + '%';
    img.style.transform = crop.scale && crop.scale !== 1 ? 'scale(' + crop.scale + ')' : '';
  }

  // Quiet contact/social strip near the bottom of the hero. Driven entirely
  // by the `about` row loaded in loadPublicData — nothing here is hard-coded,
  // and each link only appears once its URL/email/number is actually set in
  // the About admin tab. Two short rows: social platforms, then direct
  // contact — matching the "Instagram · Facebook · TikTok / Email · WhatsApp"
  // layout, with any missing platform simply omitted rather than left blank.
  function renderHeroContact(){
    var el = document.getElementById('heroContact');
    if(!el) return;

    var socialLinks = [
      about.instagram_url ? { label:'Instagram', href:about.instagram_url } : null,
      about.facebook_url  ? { label:'Facebook',  href:about.facebook_url }  : null,
      about.tiktok_url    ? { label:'TikTok',    href:about.tiktok_url }    : null
    ].filter(Boolean);

    var directLinks = [];
    if(about.contact_email){
      directLinks.push({ label:'Email', href:'mailto:'+about.contact_email });
    }
    if(about.whatsapp_number){
      var digits = String(about.whatsapp_number).replace(/[^0-9]/g, '');
      if(digits) directLinks.push({ label:'WhatsApp', href:'https://wa.me/'+digits });
    }

    function renderRow(links){
      if(!links.length) return '';
      return '<div class="hero-contact-row">'+links.map(function(l, i){
        var external = l.href.indexOf('mailto:') !== 0;
        return (i > 0 ? '<span class="dot" aria-hidden="true">&middot;</span>' : '')+
          '<a href="'+escapeHtml(l.href)+'"'+(external ? ' target="_blank" rel="noopener noreferrer"' : '')+'>'+escapeHtml(l.label)+'</a>';
      }).join('')+'</div>';
    }

    el.innerHTML = renderRow(socialLinks) + renderRow(directLinks);
    el.classList.toggle('has-content', socialLinks.length > 0 || directLinks.length > 0);
  }

  // The landing-page count is the total number of published photographs
  // across the whole gallery (not the currently filtered category) —
  // it's what the visitor sees before they've chosen anything. `photos`
  // is already the published-only, already-fetched collection loadPublicData
  // uses everywhere else, so this reuses that data rather than a new query.
  // The kicker line now shows a real starting count in the static HTML
  // (see #heroPhotoCount) and animates in immediately with the rest of the
  // hero text, instead of staying hidden until this network fetch resolves
  // — that hidden-until-loaded approach was what made the whole line pop
  // in late and briefly show "0". This just quietly corrects the number
  // in place once the fetch completes, in the rare case it's changed.
  function updateHeroPhotoCount(){
    if(!heroPhotoCountEl) return;
    heroPhotoCountEl.textContent = photos.length;
  }

  // "Continue Exploring" chapter-break card, appended right after the
  // finale/contact scene whenever there's a category this visitor hasn't
  // scrolled through yet THIS VISIT (see nextUnvisitedCategorySlug()).
  // Sits AFTER the finale on purpose — About/Contact should never feel
  // buried behind it, so it's a bonus last stop, not a detour. Returns ''
  // once everything has been seen, so the finale is simply the end.
  function nextChapterSceneHtml(){
    var nextSlug = nextUnvisitedCategorySlug();
    if(!nextSlug) return '';
    var nextCat = navCategoryList().find(function(c){ return c.slug === nextSlug; });
    if(!nextCat) return '';
    var nextCatPhotos = photosForCategory(nextSlug);
    var preview = nextCatPhotos.find(function(p){ return p.featured; }) || nextCatPhotos[0];
    var previewUrl = (preview && preview.image_url) || 'https://picsum.photos/seed/izrelli-' + nextSlug + '/1600/2400';
    return ''+
    '<section class="scene finale next-chapter" aria-label="Continue exploring" data-next-slug="'+escapeHtml(nextSlug)+'">'+
      '<div class="frame-img"><img src="'+escapeHtml(previewUrl)+'" alt="" loading="lazy"></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        '<span class="tag">Continue Exploring</span>'+
        '<h2>'+escapeHtml(nextCat.name)+'</h2>'+
        '<button type="button" class="enter next-chapter-btn">'+
          '<span class="arrow-line"></span>'+
          'View '+escapeHtml(nextCat.name)+
        '</button>'+
      '</div>'+
    '</section>';
  }

  function renderScenes(){
    var list = activePhotos;
    var total = list.length;
    var scenesTrack = document.getElementById('scenesTrack');
    markCategoryViewed(currentCategorySlug);

    if(total === 0){
      scenesTrack.innerHTML = '<div class="empty-state">No photographs in this category yet.</div>';
      return;
    }

    var html = '';
    list.forEach(function(s, i){
      var num = String(i+1).padStart(2,'0');
      var isLiked = !!liked[s.id];
      var count = (s.likes || 0);
      var trTitle = tText(s, 'title');
      var trStory = tText(s, 'story');
      var langDir = currentLang === 'ar' ? ' dir="rtl"' : '';
      var tagText = s.category || s.location || '';
      var tagCatSlug = s.category ? categorySlugForLabel(s.category) : null;
      var tagHtml = tagCatSlug
        ? '<button type="button" class="tag tag-link" data-cat-slug="'+escapeHtml(tagCatSlug)+'">'+escapeHtml(tagText)+'</button>'
        : '<span class="tag">'+escapeHtml(tagText)+'</span>';
      html += ''+
      '<section class="scene" id="scene-'+s.id+'" data-index="'+(i+1)+'" data-id="'+s.id+'" data-slug="'+escapeHtml(s._slug)+'" aria-label="'+escapeHtml(trTitle)+'">'+
        '<div class="frame-img"><div'+wmFrameAttrs(s)+'><img '+(i<2?'src="'+escapeHtml(s.image_url)+'" ':'')+'data-src="'+escapeHtml(s.image_url)+'" alt="'+escapeHtml(s.alt_text || s.title || 'Photograph by Islem Zrelli')+'" decoding="async"></div></div>'+
        '<div class="frame-wash" aria-hidden="true"></div>'+
        '<div class="scrim"></div>'+
        '<div class="scene-content">'+
          tagHtml+
          '<h2'+langDir+'>'+escapeHtml(trTitle)+'</h2>'+
          '<p class="caption"'+langDir+'>'+escapeHtml(trStory)+'</p>'+
          '<div class="scene-rule"></div>'+
          '<div class="scene-actions">'+
            '<div class="actions-left">'+
              '<button class="action-btn like-btn'+(isLiked?' liked':'')+'" data-id="'+s.id+'" aria-pressed="'+isLiked+'" aria-label="Like this photo">'+
                svgHeart(isLiked)+'<span class="like-count">'+count.toLocaleString()+'</span>'+
              '</button>'+
              '<span class="action-divider" aria-hidden="true"></span>'+
              '<button class="action-btn share-btn" data-id="'+s.id+'" data-title="'+escapeHtml(trTitle)+'" aria-label="Share this photo">'+
                svgShare+'<span>Share</span>'+
              '</button>'+
            '</div>'+
            '<div class="frame-counter"><b>'+num+'</b> — '+String(total).padStart(2,'0')+'</div>'+
          '</div>'+
        '</div>'+
      '</section>';
    });

    var hasNextChapter = !!nextUnvisitedCategorySlug();

    html += ''+
    '<section class="scene finale" aria-label="Contact">'+
      '<div class="frame-img"><img src="'+escapeHtml(about.profile_image_url || 'https://picsum.photos/seed/izrelli-finale/1600/2400')+'" alt="Islem Zrelli" loading="lazy"></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        '<span class="tag">'+escapeHtml(about.finale_tag || 'End of the Story — For Now')+'</span>'+
        '<h2>Let\'s Tell the Next One</h2>'+
        '<p class="caption">'+escapeHtml(about.short_bio || 'Available for documentary commissions, environmental campaigns and collaborations across the Mediterranean and beyond.')+'</p>'+
        (about.next_project ? '<p class="teaser">'+escapeHtml(about.next_project)+'</p>' : '')+
        '<div class="social">'+
          (about.contact_email ? '<a href="mailto:'+escapeHtml(about.contact_email)+'">Email</a>' : '')+
          (about.whatsapp_number ? '<a href="https://wa.me/'+escapeHtml(String(about.whatsapp_number).replace(/[^0-9]/g,''))+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>' : '')+
          (about.instagram_url ? '<a href="'+escapeHtml(about.instagram_url)+'" target="_blank" rel="noopener noreferrer">Instagram</a>' : '')+
          (about.facebook_url ? '<a href="'+escapeHtml(about.facebook_url)+'" target="_blank" rel="noopener noreferrer">Facebook</a>' : '')+
          (about.tiktok_url ? '<a href="'+escapeHtml(about.tiktok_url)+'" target="_blank" rel="noopener noreferrer">TikTok</a>' : '')+
          (about.vimeo_url ? '<a href="'+escapeHtml(about.vimeo_url)+'" target="_blank" rel="noopener noreferrer">Vimeo</a>' : '')+
          (about.journal_url ? '<a href="'+escapeHtml(about.journal_url)+'" target="_blank" rel="noopener noreferrer">Journal</a>' : '')+
        '</div>'+
        '<p class="signoff">'+escapeHtml(about.name || 'Islem Zrelli')+' — Tunisia</p>'+
        (hasNextChapter ? '<button type="button" class="enter continue-cue"><span class="arrow-line"></span>Continue Exploring</button>' : '')+
      '</div>'+
    '</section>';

    html += nextChapterSceneHtml();

    scenesTrack.innerHTML = html;
    setupSceneBehavior();
  }

  var ioInstance = null;
  var imgNearObserver = null, imgFarObserver = null;
  // Custom image loading, not relying on the browser's native loading="lazy" —
  // some in-app/embedded browsers (this is what was crashing in Telegram's
  // in-app browser) don't reliably honor it, and with hundreds of photos that
  // means every full-size image trying to load at once. This preloads a
  // photo shortly before it's needed and frees it again once you've
  // scrolled well past it, so memory use stays bounded regardless of gallery size.
  function setupImageLazyLoading(){
    if(imgNearObserver) imgNearObserver.disconnect();
    if(imgFarObserver) imgFarObserver.disconnect();
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.frame-img img[data-src]'));
    if(!imgs.length) return;
    imgNearObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var img = entry.target;
        var src = img.getAttribute('data-src');
        if(src && img.getAttribute('src') !== src) img.setAttribute('src', src);
      });
    }, { root: scroller, rootMargin: '150% 0px', threshold: 0 });
    imgFarObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting) return;
        var img = entry.target;
        if(img.getAttribute('src')) img.removeAttribute('src'); // data-src keeps the URL so it reloads on the way back
      });
    }, { root: scroller, rootMargin: '400% 0px', threshold: 0 });
    imgs.forEach(function(img){ imgNearObserver.observe(img); imgFarObserver.observe(img); });
  }

  // Positions .frame-wash (the overhead spotlight cone) flush against the
  // photo's actual top edge — the .wm-frame box, not the taller .frame-img
  // slot it's centered in, since the photo can have empty space above it
  // depending on its aspect ratio and the screen's height. Computed once,
  // right before the scene's normal .in-view fade-in below (not tracked
  // continuously on every scroll frame) — that continuous-tracking
  // approach is what caused the original glow to flicker in and vanish
  // mid-scroll instead of appearing cleanly once per photo.
  function positionFrameGlow(scene){
    if(!scene) return;
    var wrap = scene.querySelector('.frame-img .wm-frame') || scene.querySelector('.frame-img img');
    var wash = scene.querySelector('.frame-wash');
    if(!wrap || !wash) return;
    var sceneRect = scene.getBoundingClientRect();
    var wrapRect = wrap.getBoundingClientRect();
    wash.style.top = (wrapRect.top - sceneRect.top) + 'px';
  }
  var glowResizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(glowResizeTimer);
    glowResizeTimer = setTimeout(function(){
      var current = document.querySelector('.scene.in-view');
      if(current) positionFrameGlow(current);
    }, 120);
  });

  function setupSceneBehavior(){
    var allScenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
    if(ioInstance) ioInstance.disconnect();
    ioInstance = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.55){
          positionFrameGlow(entry.target);
          entry.target.classList.add('in-view');
          var slug = entry.target.getAttribute('data-slug');
          if(slug){
            var match = photos.find(function(p){ return p._slug === slug; });
            if(match) updateHeadForPhoto(match);
            // Keeps the address bar itself as the single source of truth for
            // "what the visitor is currently looking at" — a plain refresh,
            // opening this URL in a new tab, or sharing it all resolve back
            // to this exact photo via applyInitialRoute(), with no reliance
            // on any in-memory variable or localStorage guess. replaceState
            // (never pushState) on purpose: this fires on every ordinary
            // scroll step, and turning each one into a Back-button stop
            // would make Back nearly unusable — category switches already
            // get their own real history entry in selectCategory().
            safeHistory('replaceState', { photo: slug }, BASE_PATH + '/work/' + slug + '/');
          } else {
            resetHeadToDefault();
            // A non-photo scene (a category's "Continue Exploring" card, or
            // the final contact panel) has no /work/ URL of its own — fall
            // back to the category root so a refresh here still lands
            // somewhere sensible inside the same category rather than on a
            // stale photo URL.
            if(currentCategorySlug) safeHistory('replaceState', { category: currentCategorySlug }, categoryUrlPath(currentCategorySlug));
          }
        } else if (entry.intersectionRatio < 0.15) {
          entry.target.classList.remove('in-view');
        }
      });
    }, { root: scroller, threshold:[0, .15, .55, .8] });
    allScenes.forEach(function(s){ ioInstance.observe(s); });
    requestAnimationFrame(function(){
      if(allScenes[0]){
        positionFrameGlow(allScenes[0]);
        allScenes[0].classList.add('in-view');
      }
    });

    setupImageLazyLoading();
    window._allScenes = allScenes;
    updateScrollNavState();
  }

  // Tracks the hero itself so scrolling back up to it — and refreshing or
  // sharing the URL from there — resolves back to the plain landing page,
  // same URL-is-truth principle as the scene observer above. Set up once;
  // the hero element is never replaced by renderScenes(), unlike the
  // scenes it observes above.
  (function setupHeroUrlTracking(){
    if(!heroEl || !scroller) return;
    var heroObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.5) safeHistory('replaceState', {}, BASE_PATH + '/');
      });
    }, { root: scroller, threshold:[0, .5] });
    heroObserver.observe(heroEl);
  })();

  // Desktop/trackpad "TikTok-style" scene advance, shared by wheel input
  // (see the listener below) and the up/down .scroll-nav buttons. Touch is
  // left to native momentum + CSS scroll-snap:mandatory (tuned above), which
  // already guarantees landing on a full scene on phones. Wheel input and
  // button clicks don't have that native momentum-to-snap behavior, so this
  // buffers a short burst of wheel deltas (or a single button press) into
  // one deliberate move that always lands exactly on a scene.
  var sceneNav = (function setupSceneNav(){
    var isAnimating = false;
    var scrollAnimFrame = null;
    var wheelBuffer = 0;
    var wheelTimer = null;
    var ADVANCE_DURATION = 420; // ms — matches the site's --dur-1 easing feel
    var BUFFER_WINDOW = 70;     // ms — how long a wheel "burst" is allowed to accumulate

    function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); } // close match to var(--ease)

    function cancelAnim(){
      if(scrollAnimFrame){ cancelAnimationFrame(scrollAnimFrame); scrollAnimFrame = null; }
      isAnimating = false;
    }

    function animateScrollTo(targetTop){
      cancelAnim();
      var startTop = scroller.scrollTop;
      var distance = targetTop - startTop;
      if(Math.abs(distance) < 1) return;
      isAnimating = true;
      // scroll-snap-type:mandatory (see .scroller) fights a manually-driven
      // scrollTop animation on some browsers — once our per-frame writes
      // stop, the browser re-asserts its own snap and can land one scene
      // further than intended, which reads as the advance "skipping" a
      // photo. Suspending snap for the duration of the animation and
      // restoring it the instant we land exactly on the target scene
      // avoids that fight entirely.
      scroller.style.scrollSnapType = 'none';
      var startTime = null;
      function step(ts){
        if(startTime === null) startTime = ts;
        var t = Math.min(1, (ts - startTime) / ADVANCE_DURATION);
        scroller.scrollTop = startTop + distance * easeOutExpo(t);
        if(t < 1){ scrollAnimFrame = requestAnimationFrame(step); }
        else { isAnimating = false; scrollAnimFrame = null; scroller.style.scrollSnapType = ''; }
      }
      scrollAnimFrame = requestAnimationFrame(step);
    }

    // The full slide list for navigation purposes: the hero counts as
    // slide 0, followed by every .scene (photos + finale). This is
    // deliberately separate from window._allScenes (which setupSceneBehavior
    // uses for its own IntersectionObserver/lazy-load bookkeeping and stays
    // photos-only) — navSlides() is only ever used to answer "where am I,
    // and where's next" for wheel/keyboard/buttons/enter-gallery, so the
    // hero can be a first-class stop in that sequence without having to
    // pretend it's a photo scene anywhere else in the code.
    function navSlides(){
      return [heroEl].concat(window._allScenes || []);
    }

    function currentSceneIndex(){
      var slides = navSlides();
      var best = 0, bestDist = Infinity;
      slides.forEach(function(s, i){
        var d = Math.abs(s.offsetTop - scroller.scrollTop);
        if(d < bestDist){ bestDist = d; best = i; }
      });
      return best;
    }

    function goToSceneIndex(i){
      var slides = navSlides();
      if(!slides.length) return;
      // Trying to advance past the very last slide: if that slide is the
      // "Continue Exploring" chapter-break card, treat the attempt to keep
      // scrolling as choosing it — the same action clicking it already
      // does — instead of clamping and silently going nowhere. This is
      // what makes wheel/trackpad and touch scrolling past the card work,
      // not just tapping it.
      var lastIndex = slides.length - 1;
      if(i > lastIndex){
        var lastSlide = slides[lastIndex];
        if(lastSlide && lastSlide.classList.contains('next-chapter')){
          var nextSlug = lastSlide.getAttribute('data-next-slug');
          if(nextSlug){ selectCategory(nextSlug); return; }
        }
      }
      i = Math.max(0, Math.min(lastIndex, i));
      animateScrollTo(slides[i].offsetTop);
    }

    scroller.addEventListener('wheel', function(e){
      if(window.innerWidth < 768) return; // touch devices use native scroll+snap instead
      e.preventDefault();
      if(isAnimating) return; // ignore extra input while settling — avoids overshoot/jitter
      wheelBuffer += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function(){
        var dir = wheelBuffer > 0 ? 1 : -1;
        var mag = Math.abs(wheelBuffer);
        var advance = 1;
        if(mag > 260) advance = 2;
        if(mag > 520) advance = 3;
        goToSceneIndex(currentSceneIndex() + dir * advance);
        wheelBuffer = 0;
      }, BUFFER_WINDOW);
    }, { passive:false });

    // ============================================================
    // MOBILE TOUCH NAVIGATION — one swipe = exactly one scene, always.
    // Touch used to rely purely on native momentum scrolling + CSS
    // scroll-snap: normally fine, but a hard/fast flick can carry enough
    // native momentum to glide straight past several snap points before
    // the browser's own snap logic catches up — that's the "skips
    // photos" bug. This replaces native touch scrolling with the exact
    // same locked, single-step, cinematically-eased advance the wheel
    // handler above already uses (goToSceneIndex/animateScrollTo), so
    // touch gets the identical "one gesture, one scene, every time"
    // guarantee — same transition, same routing, one system, not two.
    // ============================================================
    var MOBILE_BREAKPOINT = 768; // matches the wheel handler's own check above
    var SWIPE_THRESHOLD = 28;    // px — how far a drag must travel before it's treated as a decisive swipe rather than a tap or jitter
    var touchStartY = null;
    var touchStartX = null;
    var touchGestureDone = false; // true the instant THIS gesture has spent its one allowed advance — set before we even know if we'll act on it, so a long/fast continued drag can never trigger a second one

    function isMobileWidth(){ return window.innerWidth < MOBILE_BREAKPOINT; }

    scroller.addEventListener('touchstart', function(e){
      if(!isMobileWidth() || !e.touches[0]) return;
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
      touchGestureDone = false;
    }, { passive:true });

    scroller.addEventListener('touchmove', function(e){
      if(!isMobileWidth() || touchStartY === null || !e.touches[0]) return;
      var dy = touchStartY - e.touches[0].clientY; // positive = finger moved up = swiping forward
      var dx = touchStartX - e.touches[0].clientX;
      if(Math.abs(dy) < 6 && Math.abs(dx) < 6) return; // too small to be a real drag yet — let it resolve as a tap
      // From here on this is unmistakably a drag, not a tap: take over
      // from native scrolling for the rest of THIS gesture so it can
      // never fight the JS-driven scrollTop animation below.
      e.preventDefault();
      if(touchGestureDone) return; // this gesture already spent its one advance — ignore all further movement from it, no matter how far/fast
      if(Math.abs(dy) < SWIPE_THRESHOLD) return; // still building up to a decisive swipe
      touchGestureDone = true;
      if(isAnimating) return; // a still-finishing transition (from a separate gesture) owns the screen right now — drop this one rather than queueing a second/third advance behind it
      goToSceneIndex(currentSceneIndex() + (dy > 0 ? 1 : -1));
    }, { passive:false });

    function endTouchGesture(e){
      // Fallback for short, quick flicks: a fast short flick can lift the
      // finger between touchmove samples before dy ever crosses
      // SWIPE_THRESHOLD mid-drag. If this gesture hasn't already spent
      // its one advance, decide here instead, using the total distance
      // travelled by lift — same one-advance-per-gesture guarantee,
      // just resolved at touchend rather than mid-move.
      if(isMobileWidth() && touchStartY !== null && !touchGestureDone && e && e.changedTouches && e.changedTouches[0] && !isAnimating){
        var touch = e.changedTouches[0];
        var dy = touchStartY - touch.clientY;
        var dx = touchStartX - touch.clientX;
        if(Math.abs(dy) >= 18 && Math.abs(dy) > Math.abs(dx)){
          goToSceneIndex(currentSceneIndex() + (dy > 0 ? 1 : -1));
        }
      }
      touchStartY = null;

  // Shared like/unlike mutation — the one place that ever writes to a
  // photo's like state. Used by the like button (toggle, either
  // direction) and, below, the double-tap-on-photo gesture (like-only,
  // Instagram-style — it only ever calls this with nowLiked=true).
  // Handles the optimistic UI update, the DB write, and rollback on
  // failure, exactly as before — this is a refactor, not a behavior change.
  function setPhotoLiked(id, nowLiked){
    var photo = photos.find(function(p){ return String(p.id) === String(id); });
    if(!photo) return;
    var prevLikes = photo.likes || 0;
    var delta = nowLiked ? 1 : -1;
    liked[id] = nowLiked;
    setLiked(liked);
    photo.likes = Math.max(0, prevLikes + delta);
    var btn = document.querySelector('.like-btn[data-id="'+id+'"]');
    if(btn){
      btn.classList.toggle('liked', nowLiked);
      btn.setAttribute('aria-pressed', String(nowLiked));
      var svgEl = btn.querySelector('svg');
      if(svgEl) svgEl.outerHTML = svgHeart(nowLiked);
      var countEl = btn.querySelector('.like-count');
      if(countEl) countEl.textContent = photo.likes.toLocaleString();
      btn.classList.remove('pulse');
      void btn.offsetWidth; // restart animation even on rapid re-triggers
      btn.classList.add('pulse');
    }
    sb.rpc('increment_photo_likes', { p_id: id, p_delta: delta }).then(function(result){
      // If the database function returns the new total, trust that exact
      // number over our local +1/-1 math — this is what keeps the count
      // correct when someone else likes the same photo around the same
      // time, instead of both browsers' optimistic guesses drifting apart.
      var serverCount = result && result.data;
      if(serverCount && typeof serverCount === 'object') serverCount = serverCount.likes;
      if(typeof serverCount === 'number'){
        photo.likes = serverCount;
        var freshBtn = document.querySelector('.like-btn[data-id="'+id+'"]');
        var countEl2 = freshBtn && freshBtn.querySelector('.like-count');
        if(countEl2) countEl2.textContent = serverCount.toLocaleString();
      }
    }).catch(function(){
      // The like never reached the database — undo the optimistic change
      // instead of leaving the UI showing a "like" that doesn't exist
      // anywhere else.
      liked[id] = !nowLiked;
      setLiked(liked);
      photo.likes = prevLikes;
      var freshBtn = document.querySelector('.like-btn[data-id="'+id+'"]');
      if(freshBtn){
        freshBtn.classList.toggle('liked', !nowLiked);
        freshBtn.setAttribute('aria-pressed', String(!nowLiked));
        var svgEl2 = freshBtn.querySelector('svg');
        if(svgEl2) svgEl2.outerHTML = svgHeart(!nowLiked);
        var countEl3 = freshBtn.querySelector('.like-count');
        if(countEl3) countEl3.textContent = prevLikes.toLocaleString();
      }
      showToast("Couldn't save your like — check your connection and try again.");
    });
  }

  // Double-tap-on-photo-to-like — mirrors the familiar photo-app gesture.
  // Scoped to a real photo's .frame-img only (matched via the enclosing
  // .scene's data-id, which the finale/next-chapter cards never have, so
  // this can't fire on them). Two taps within DOUBLE_TAP_WINDOW on the
  // SAME photo count as a double-tap; anything slower, or on a different
  // photo, just restarts the count from one. Deliberately like-only (never
  // unlikes) and a no-op if already liked, so rapid/repeated double-taps
  // can never queue up duplicate like requests — same one-way behavior
  // Instagram's own double-tap uses, unlike the like button's toggle.
  // The photo's own brief brightness/contrast acknowledgment — see the
  // photoLikeFlash keyframes. Only ever called on a successful new like
  // (never on a redundant double-tap of an already-liked photo), and
  // uses the same remove/reflow/re-add trick as the like button's pulse
  // so back-to-back likes on different photos each restart cleanly.
  function flashPhotoLike(sceneId){
    var img = document.querySelector('.scene[data-id="'+sceneId+'"] .frame-img img');
    if(!img) return;
    img.classList.remove('like-flash');
    void img.offsetWidth;
    img.classList.add('like-flash');
  }

  var DOUBLE_TAP_WINDOW = 300; // ms
  var lastPhotoTapId = null;
  var lastPhotoTapTime = 0;
  function handlePhotoTap(sceneId){
    var now = Date.now();
    var isDoubleTap = (lastPhotoTapId === sceneId) && (now - lastPhotoTapTime < DOUBLE_TAP_WINDOW);
    if(isDoubleTap){
      lastPhotoTapId = null; // consume it — a third quick tap starts fresh, doesn't chain into another "double"
      lastPhotoTapTime = 0;
      if(liked[sceneId]){
        // Already liked: still acknowledge the gesture with the existing
        // pulse animation so it doesn't feel like nothing happened, but
        // never re-like it — this is the "no duplicate like" requirement.
        var btn = document.querySelector('.like-btn[data-id="'+sceneId+'"]');
        if(btn){
          btn.classList.remove('pulse');
          void btn.offsetWidth;
          btn.classList.add('pulse');
        }
      } else {
        setPhotoLiked(sceneId, true);
        flashPhotoLike(sceneId);
      }
    } else {
      lastPhotoTapId = sceneId;
      lastPhotoTapTime = now;
    }
  }

  // Bakes the EXIF rotation into the actual pixels so the photo displays
  // upright everywhere, caps the resolution per orientation, and re-encodes
  // to WebP. Phone cameras produce huge originals (12+ MP / 20-50MB); this
  // is what keeps Storage costs and load times sane, and is also what was
  // crashing memory-constrained mobile browsers (e.g. "A problem repeatedly
  // occurred" in Safari/Telegram's in-app browser) when the old code loaded
  // full-size gallery photos. Never upscales — if the source is already
  // smaller than the target, it's re-encoded at its native size.
  // Instagram-style ratio label, purely derived from stored width/height —
  // no separate DB field needed since it's just formatting of data we
  // already capture at upload time.
  var KNOWN_RATIOS = [
    { name:'1:1',  value:1 },
    { name:'4:5',  value:4/5 },
    { name:'2:3',  value:2/3 },
    { name:'9:16', value:9/16 },
    { name:'16:9', value:16/9 },
    { name:'3:2',  value:3/2 },
    { name:'4:3',  value:4/3 },
    { name:'3:4',  value:3/4 }
  ];
  function getAspectRatioName(width, height){
    if(!width || !height) return null;
    var ratio = width / height;
    var best = null, bestDiff = Infinity;
    KNOWN_RATIOS.forEach(function(r){
      var diff = Math.abs(ratio - r.value);
      if(diff < bestDiff){ bestDiff = diff; best = r; }
    });
    if(best && bestDiff < 0.025) return best.name;
    // Not a close match to a common ratio — show the decimal ratio rather
    // than a raw pixel-reduced fraction (which can be an ugly large pair
    // once resize/rounding nudges it off an exact ratio).
    return ratio.toFixed(2) + ':1';
  }

  var MAX_PORTRAIT_H = 1800, MAX_PORTRAIT_W = 1200;
  var MAX_LANDSCAPE_W = 2000;
  var WEBP_QUALITY = 0.85;

  // Formats a byte count the same way for both sides of the before/after
  // panel — always computed from a real File/Blob's .size, never guessed.
  function formatBytes(bytes){
    if(bytes == null || isNaN(bytes)) return '—';
    if(bytes < 1024) return bytes + ' B';
    var kb = bytes / 1024;
    if(kb < 1024) return kb.toFixed(kb < 10 ? 1 : 0) + ' KB';
    var mb = kb / 1024;
    return mb.toFixed(mb < 10 ? 1 : 0) + ' MB';
  }
  var IMAGE_FORMAT_LABELS = { 'image/jpeg':'JPEG', 'image/jpg':'JPEG', 'image/png':'PNG', 'image/webp':'WebP', 'image/gif':'GIF', 'image/heic':'HEIC', 'image/heif':'HEIF', 'image/avif':'AVIF', 'image/svg+xml':'SVG', 'image/tiff':'TIFF' };
  function formatImageFormatLabel(mime){
    if(!mime) return '—';
    return IMAGE_FORMAT_LABELS[mime] || mime.replace('image/','').toUpperCase();
  }

  // Renders the compact "optimized" report panel in the photo form from
  // the real numbers uploadFile() measured off the actual uploaded and
  // processed files (see uploadFile below) — nothing here is estimated.
  function renderOptimizeResult(res){
    var panel = document.getElementById('photoOptimizeResult');
    if(!panel) return;
    if(!res.resized || res.origWidth == null || res.origSize == null){
      // Nothing was actually resized (unsupported file type, or the
      // browser lacked canvas/createImageBitmap support and the original
      // was uploaded as-is) — say so plainly instead of showing a fake
      // "0% smaller" result.
      panel.style.display = 'block';
      panel.innerHTML = '<div class="opt-note">Not optimized — uploaded as-is (unsupported format or browser).</div>';
      return;
    }
    var beforeDims = res.origWidth + ' × ' + res.origHeight;
    var afterDims = res.width + ' × ' + res.height;
    var beforeSize = formatBytes(res.origSize);
    var afterSize = formatBytes(res.processedSize);
    var beforeFmt = formatImageFormatLabel(res.origType);
    var afterFmt = formatImageFormatLabel(res.processedType);
    var reductionPct = res.origSize > 0 ? (100 * (1 - (res.processedSize / res.origSize))) : 0;
    var reductionLabel = reductionPct >= 0
      ? reductionPct.toFixed(1) + '% smaller'
      : Math.abs(reductionPct).toFixed(1) + '% larger';
    panel.style.display = 'block';
    panel.innerHTML =
      '<div class="opt-before">Photo uploaded ✓<br>'+escapeHtml(beforeDims)+' · '+escapeHtml(beforeSize)+' · '+escapeHtml(beforeFmt)+'</div>'+
      '<div class="opt-arrow">↓</div>'+
      '<div class="opt-after">Optimized ✓<br>'+escapeHtml(afterDims)+' · '+escapeHtml(afterSize)+' · '+escapeHtml(afterFmt)+'</div>'+
      '<div class="opt-reduction">'+escapeHtml(reductionLabel)+'</div>';
  }

  var _webpSupported = null;
  function supportsWebP(){
    if(_webpSupported !== null) return _webpSupported;
    try{
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      _webpSupported = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
    } catch(e){ _webpSupported = false; }
    return _webpSupported;
  }

  // Draws the watermark text directly onto the canvas pixels — this is
  // the step that replaces the old CSS `.wm-frame::after` overlay. Once
  // this has run and the canvas is exported to a blob, the mark is part
  // of the image data itself; there's no DOM node, no CSS, nothing a
  // viewer could inspect-element or strip out to get a clean copy, and
  // (see uploadFile below) no unwatermarked version of this file is ever
  // uploaded anywhere the public can reach.
  // Reuses watermarkConfigFor() — the same global/per-photo-override
  // merge the old live overlay used — so admin settings mean exactly
  // what they used to; only where they're applied has changed.
  function drawWatermarkOnCanvas(ctx, canvasW, canvasH, wm){
    if(!wm || !wm.text) return;
    var shortSide = Math.min(canvasW, canvasH);
    // Scales with the image so a phone snapshot and a full-frame master
    // both get a proportionally similar, subtle mark (deliverable:
    // "scale appropriately for different image dimensions").
    var fontSize = Math.max(14, Math.round(shortSide * 0.026));
    var pad = Math.max(wm.x || 0, wm.y || 0, Math.round(shortSide * 0.02), 14);
    var padX = Math.max(wm.x != null ? wm.x : pad, 10);
    var padY = Math.max(wm.y != null ? wm.y : pad, 10);
    var text = (wm.text || 'Islem Zrelli').toUpperCase();

    ctx.save();
    ctx.font = 'italic 500 ' + fontSize + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    var textW = ctx.measureText(text).width;
    var x, y;
    switch(wm.position){
      case 'bottom-left':   x = padX;                y = canvasH - padY;              break;
      case 'top-right':     x = canvasW - padX - textW; y = padY + fontSize;           break;
      case 'top-left':      x = padX;                y = padY + fontSize;              break;
      case 'center-bottom': x = (canvasW - textW)/2;  y = canvasH - padY;              break;
      case 'center':        x = (canvasW - textW)/2;  y = (canvasH + fontSize*0.35)/2; break;
      case 'bottom-right':
      default:               x = canvasW - padX - textW; y = canvasH - padY;           break;
    }
    // A soft dark shadow first, then a translucent white fill on top —
    // keeps the mark readable on both light and dark photographs, the
    // same trick the old CSS text-shadow used to pull off live in-browser
    // (deliverable: "remain readable on both light and dark photographs").
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = fontSize * 0.4;
    ctx.shadowOffsetY = fontSize * 0.06;
    ctx.fillStyle = 'rgba(255,255,255,' + (wm.opacity != null ? wm.opacity : 0.35) + ')';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // wmOverride, when passed, is read live from the currently-open photo
  // form's override checkbox/position/x/y fields (see the photoFile
  // change handler below) so a per-photo override in progress is honored
  // even though burn-in now happens at upload time rather than render
  // time. skipWatermark is used for the About-page portrait, which isn't
  // one of the documentary photographs this feature is protecting.
  async function processImageForUpload(file, wmOverride, skipWatermark){
    if(!file.type || file.type.indexOf('image/') !== 0 || file.type === 'image/svg+xml'){
      // Not a resizable raster type (or no type at all) — passed through
      // untouched. origWidth/origHeight are unknown here since we never
      // decode the file, which is also the signal the report panel uses
      // to know no optimization happened.
      return { file: file, width: null, height: null, origWidth: null, origHeight: null, resized: false };
    }
    try{
      var bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      var w = bitmap.width, h = bitmap.height;
      var isPortrait = h >= w;
      var scale = isPortrait
        ? Math.min(1, MAX_PORTRAIT_W / w, MAX_PORTRAIT_H / h)
        : Math.min(1, MAX_LANDSCAPE_W / w);
      var outW = Math.round(w * scale), outH = Math.round(h * scale);

      var canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, outW, outH);
      bitmap.close && bitmap.close();

      if(!skipWatermark){
        var wm = watermarkConfigFor(wmOverride);
        drawWatermarkOnCanvas(ctx, outW, outH, wm);
      }

      var useWebp = supportsWebP();
      var mime = useWebp ? 'image/webp' : 'image/jpeg';
      var extension = useWebp ? '.webp' : '.jpg';
      var blob = await new Promise(function(resolve){
        canvas.toBlob(function(b){ resolve(b); }, mime, WEBP_QUALITY);
      });
      if(!blob) return { file: file, width: w, height: h, origWidth: w, origHeight: h, resized: false };

      var baseName = file.name.replace(/\.\w+$/, '') || 'photo';
      var processed = new File([blob], baseName + extension, { type: mime });
      return { file: processed, width: outW, height: outH, origWidth: w, origHeight: h, resized: true };
    } catch(e){
      return { file: file, width: null, height: null, origWidth: null, origHeight: null, resized: false }; // browser doesn't support it — fall back to the original file
    }
  }

  // Single upload attempt — no retry logic here, see xhrUploadToBucket()
  // below, which wraps this with automatic retry for transient failures.
  async function xhrUploadAttempt(bucket, path, file, onProgress){
    var token = SUPABASE_ANON_KEY;
    try{
      var sess = await sb.auth.getSession();
      if(sess && sess.data && sess.data.session && sess.data.session.access_token){
        token = sess.data.session.access_token;
      }
    } catch(e){ /* fall back to the anon key below */ }
    return new Promise(function(resolve){
      var xhr = new XMLHttpRequest();
      var encodedPath = path.split('/').map(encodeURIComponent).join('/');
      xhr.open('POST', SUPABASE_URL + '/storage/v1/object/' + bucket + '/' + encodedPath, true);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.setRequestHeader('cache-control', '3600');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      if(xhr.upload && onProgress){
        xhr.upload.onprogress = function(e){
          onProgress(e.loaded, e.lengthComputable ? e.total : file.size);
        };
      }
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          if(onProgress) onProgress(file.size, file.size);
          resolve({ error: null });
        } else {
          var msg = 'Upload failed (HTTP ' + xhr.status + ')';
          try{
            var body = JSON.parse(xhr.responseText);
            if(body && (body.message || body.error)) msg = body.message || body.error;
          } catch(e){}
          // status is what tells the retry wrapper whether this is worth
          // retrying (a 5xx hiccup) or not (a 4xx like bad auth/RLS,
          // which will just fail again the same way).
          resolve({ error: { message: msg, status: xhr.status } });
        }
      };
      xhr.onerror = function(){ resolve({ error: { message: 'Network error while uploading — check your connection and try again.', status: 0 } }); };
      xhr.send(file);
    });
  }

  // Direct XHR upload to the Storage REST endpoint that
  // sb.storage.from(bucket).upload() calls internally. supabase-js uses
  // fetch() under the hood, and fetch has no cross-browser upload-progress
  // event — XHR's upload.onprogress is the only way to get real, non-fake
  // 0–100% numbers as bytes actually leave the browser. Mirrors the SDK's
  // {error} shape so callers don't need to know which one they got.
  //
  // Wraps xhrUploadAttempt() with a couple of automatic retries for
  // transient network problems (status 0, i.e. the request never got a
  // response — dropped wifi, DNS hiccup, etc. — or a 5xx from Supabase's
  // side). It reuses the exact same `path`/`file` on every attempt, so a
  // retry re-sends the same object to the same destination path rather
  // than creating a second copy — no duplicate images. It never retries a
  // 4xx (bad auth, RLS rejection, bad request): those fail the same way
  // every time and retrying would just waste time and hide the real cause.
  var UPLOAD_MAX_ATTEMPTS = 3;
  var UPLOAD_RETRY_DELAYS_MS = [600, 1800];
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  async function xhrUploadToBucket(bucket, path, file, onProgress){
    var lastResult;
    for(var attempt = 0; attempt < UPLOAD_MAX_ATTEMPTS; attempt++){
      if(attempt > 0 && onProgress) onProgress(0, file.size); // visibly restart this leg's bar on retry rather than leaving it stuck mid-way
      lastResult = await xhrUploadAttempt(bucket, path, file, onProgress);
      if(!lastResult.error) return lastResult;
      var status = lastResult.error.status;
      var isTransient = status === 0 || (status >= 500 && status < 600);
      if(!isTransient || attempt === UPLOAD_MAX_ATTEMPTS - 1) return lastResult;
      await sleep(UPLOAD_RETRY_DELAYS_MS[attempt] || 1800);
    }
    return lastResult;
  }

  // Upload flow:
  //   1) Process the file exactly once on the client — decode, resize,
  //      burn in the watermark, encode. This was always a single-pass
  //      pipeline (one decode, one canvas draw, one encode); what's new
  //      is WHEN it runs relative to the network calls below.
  //   2) Once processing finishes we know the exact byte size of both the
  //      untouched original and the resized/watermarked copy, so both
  //      uploads — the private master AND the public copy — go out over
  //      the network at the same time instead of one waiting on the
  //      other. That's the main speed win: two independent HTTP requests
  //      no longer sit in a queue behind each other.
  //   3) The original safety guarantee is preserved even though the two
  //      uploads now race: image_url is only ever returned (and only
  //      ever reaches the `photos` table, via the caller's Save step) if
  //      the private master upload also succeeded. If the master fails
  //      after the public copy happened to finish first, we delete that
  //      now-orphaned public file so nothing "live" is ever left behind
  //      without a private original backing it up.
  // onProgress(state), if given, is called with
  // { stage: 'processing'|'uploading'|'saving'|'done', pct } — pct is a
  // real 0–100 figure during 'uploading', driven entirely by
  // XMLHttpRequest's upload.onprogress on both transfers combined
  // (weighted by their real byte sizes) — never a timer or estimate.
  // 'processing' and 'saving' have no byte-level progress API to read
  // from (canvas work and a URL lookup, not a network transfer), so
  // those stages are reported without a fabricated percentage.
  async function uploadFile(file, wmOverride, skipWatermark, onProgress){
    function report(stage, pct){ if(onProgress) onProgress({ stage: stage, pct: pct }); }

    // Real, measured (not guessed) timing per stage, logged to the console
    // so this can actually be checked against the old sequential pipeline
    // instead of just assumed — see item 13 in the brief. performance.now()
    // marks are taken at the real await boundaries below, nowhere else.
    var t0 = performance.now();
    report('processing', null);
    var processed = await processImageForUpload(file, wmOverride, skipWatermark);
    var tProcessed = performance.now();

    var baseName = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    var origExt = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var originalPath = baseName + '.' + origExt;
    var pubFile = processed.file;
    var pubExt = (pubFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var publicPath = baseName + '-web.' + pubExt;

    var totalBytes = file.size + pubFile.size;
    var origLoaded = 0, pubLoaded = 0;
    function reportUpload(){
      var pct = totalBytes > 0 ? Math.round(100 * (origLoaded + pubLoaded) / totalBytes) : 100;
      report('uploading', Math.min(100, pct));
    }
    reportUpload();

    var originalUploadPromise = xhrUploadToBucket(ORIGINALS_BUCKET, originalPath, file, function(loaded){ origLoaded = loaded; reportUpload(); });
    var publicUploadPromise = xhrUploadToBucket(BUCKET, publicPath, pubFile, function(loaded){ pubLoaded = loaded; reportUpload(); });
    var uploads = await Promise.all([originalUploadPromise, publicUploadPromise]);
    var originalUpload = uploads[0], uploadRes = uploads[1];

    if(originalUpload.error){
      // Private master failed. If the public copy nonetheless finished,
      // clean it up — nothing below ever returns its URL, but we don't
      // want an orphaned watermarked file sitting in public storage with
      // no private original behind it.
      if(!uploadRes.error){
        try{ await sb.storage.from(BUCKET).remove([publicPath]); } catch(e){}
      }
      throw new Error('Could not save the original privately (' + originalUpload.error.message + '). Set up the "' + ORIGINALS_BUCKET + '" bucket first — see the PRIVATE ORIGINALS BUCKET note near the top of this file — then try again.');
    }
    if(uploadRes.error) throw new Error(uploadRes.error.message);
    var tUploaded = performance.now();

    report('saving', null);
    var urlRes = sb.storage.from(BUCKET).getPublicUrl(publicPath);
    // origSize/processedSize/format info here is read straight off the real
    // File/Blob objects that were actually uploaded — never estimated — so
    // the admin "before/after" panel reflects exactly what's now stored.
    var result = {
      url: urlRes.data.publicUrl,
      width: processed.width,
      height: processed.height,
      origWidth: processed.origWidth,
      origHeight: processed.origHeight,
      origSize: file.size,
      origType: file.type,
      processedSize: pubFile.size,
      processedType: pubFile.type,
      resized: !!processed.resized
    };
    var tDone = performance.now();
    // Actual measured numbers for this one upload — open devtools to see
    // real before/after timings rather than assuming the optimization
    // worked. 2 network requests total (original + processed, run
    // concurrently) versus 2 sequential requests in the old pipeline.
    console.info('[upload] ' + file.name, {
      processingMs: Math.round(tProcessed - t0),
      uploadingMs: Math.round(tUploaded - tProcessed),
      savingMs: Math.round(tDone - tUploaded),
      totalMs: Math.round(tDone - t0),
      origSize: file.size,
      processedSize: pubFile.size,
      networkRequests: 2
    });
    report('done', 100);
    return result;
  }

  // Small reusable progress-UI: a stage label, a real progress bar, and a
  // row of sub-step chips (Processing / Uploading / Saving / Completed).
  // uploadProgressHtml(prefix) renders the markup with ids namespaced by
  // prefix; wireUploadProgress(prefix) looks those ids up and returns
  // {show, hide, onProgress} so a file-input's change handler can pass
  // `onProgress` straight through to uploadFile()'s callback.
  var UPLOAD_STAGE_LABELS = { processing:'Processing…', uploading:'Uploading…', saving:'Saving…', done:'Uploaded ✓' };
  var UPLOAD_STAGE_ORDER = ['processing','uploading','saving','done'];
  function uploadProgressHtml(prefix){
    return '<div class="upload-progress" id="'+prefix+'Progress" style="display:none;">'+
      '<div class="upload-progress-stage" id="'+prefix+'StageLine"><span id="'+prefix+'StageText">Uploading…</span><span class="pct" id="'+prefix+'Pct"></span></div>'+
      '<div class="upload-progress-track"><div class="upload-progress-fill" id="'+prefix+'Fill"></div></div>'+
      '<div class="upload-progress-substeps">'+
        '<span class="step" data-step="processing">Processing</span>'+
        '<span class="step" data-step="uploading">Uploading</span>'+
        '<span class="step" data-step="saving">Saving</span>'+
        '<span class="step" data-step="done">Completed ✓</span>'+
      '</div>'+
    '</div>';
  }
  function wireUploadProgress(prefix){
    var wrap = document.getElementById(prefix+'Progress');
    var stageLine = document.getElementById(prefix+'StageLine');
    var stageText = document.getElementById(prefix+'StageText');
    var pctEl = document.getElementById(prefix+'Pct');
    var fill = document.getElementById(prefix+'Fill');
    var steps = wrap ? wrap.querySelectorAll('.upload-progress-substeps .step') : [];
    function setSteps(stage){
      var idx = UPLOAD_STAGE_ORDER.indexOf(stage);
      steps.forEach(function(s){
        var sIdx = UPLOAD_STAGE_ORDER.indexOf(s.getAttribute('data-step'));
        s.classList.toggle('active', sIdx === idx);
        s.classList.toggle('done', sIdx !== -1 && sIdx < idx);
      });
    }
    return {
      show: function(){
        if(!wrap) return;
        wrap.style.display = 'flex';
        stageLine.classList.remove('complete');
        fill.classList.remove('indeterminate');
        fill.style.width = '0%';
        pctEl.textContent = '';
        setSteps('processing');
      },
      hide: function(){ if(wrap) wrap.style.display = 'none'; },
      onProgress: function(state){
        if(!wrap) return;
        stageText.textContent = UPLOAD_STAGE_LABELS[state.stage] || state.stage;
        setSteps(state.stage);
        if(state.stage === 'uploading' && typeof state.pct === 'number'){
          fill.classList.remove('indeterminate');
          fill.style.width = state.pct + '%';
          pctEl.textContent = state.pct + '%';
        } else if(state.stage === 'done'){
          fill.classList.remove('indeterminate');
          fill.style.width = '100%';
          pctEl.textContent = '100%';
          stageLine.classList.add('complete');
        } else {
          // 'processing' / 'saving' have no byte-level progress source —
          // show honest motion, not an invented percentage.
          fill.classList.add('indeterminate');
          pctEl.textContent = '';
        }
      }
    };
  }

  /* ---------- Generic drag & drop reorder helper ---------- */
  // A touch-friendly sortable list: grab the drag handle, the row lifts
  // and follows your finger/cursor, the rows around it slide smoothly out
  // of the way in real time, and the list auto-scrolls if you drag near
  // its top/bottom edge. Deliberately built on Pointer Events (not the
  // HTML5 drag-and-drop API) because native HTML5 drag simply does not
  // fire on touchscreens — it would silently not work on any phone/tablet,
  // which is unacceptable for a photographer reordering photos from their
  // phone. Pure vanilla JS, no library, so it stays consistent with the
  // rest of the admin panel's "no complicated CMS" approach.
  //
  // opts:
  //   handle   — CSS selector for the grab handle within each row (drag
  //              only starts from there, so the rest of the row stays
  //              tappable/scrollable as normal).
  //   onReorder(orderedIds, draggedId) — called once, after drop, with the
  //              row's final top-to-bottom `data-id` order, plus the id of
  //              the specific row that was actually dragged (needed by
  //              callers — like the Photos tab — that have to splice that
  //              one row into a larger list than what's on screen; see
  //              reorderFullList()). Persisting to the database is
  //              entirely the caller's job.
  function makeListSortable(listEl, opts){
    if(!listEl) return;
    opts = opts || {};
    var handleSel = opts.handle;
    var onReorder = opts.onReorder || function(){};
    var scrollBox = listEl.closest('.admin-scroll') || listEl;

    var rows, order, dragRow, dragIndex, rowHeight, startY, pointerId;
    var autoScrollDir = 0, autoScrollRAF = null;
    var EDGE = 46; // px from the scroll box's top/bottom edge that triggers auto-scroll

    function rowsInDom(){
      return Array.prototype.slice.call(listEl.children).filter(function(el){ return el.hasAttribute('data-id'); });
    }

    function onPointerDown(e){
      if(handleSel && !e.target.closest(handleSel)) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      var row = e.target.closest('[data-id]');
      if(!row || row.parentNode !== listEl) return;
      dragRow = row;
      rows = rowsInDom();
      order = rows.slice();
      dragIndex = rows.indexOf(row);
      rowHeight = row.offsetHeight;
      startY = e.clientY;
      pointerId = e.pointerId;
      try{ row.setPointerCapture(pointerId); }catch(err){
        // Pointer capture isn't available/allowed (older Safari, some
        // Android WebViews) — that's fine, we never relied on it to
        // receive events: pointermove/pointerup are already bound on
        // `document` below, not on the row, so tracking keeps working
        // exactly the same either way. This is purely so a capture
        // failure never throws and aborts the drag before it starts.
      }
      row.classList.add('sorting-active');
      // The dragged row is CSS-transformed to sit directly under the
      // pointer, so without this, elementFromPoint() in onPointerMove
      // below would always hit the dragged row itself (since it's the
      // topmost element at that exact point) and never the row actually
      // underneath it — silently breaking the whole live-swap preview.
      // Pointer CAPTURE (set just above) is independent of this: captured
      // pointermove/pointerup events still route to `row` regardless of
      // its pointer-events value, so the drag itself keeps working.
      row.style.pointerEvents = 'none';
      listEl.classList.add('sorting');
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
      document.addEventListener('pointercancel', onPointerUp);
      // Belt-and-braces cleanup for the ways a real pointerup can fail to
      // reach us: the finger/cursor leaves the browser window entirely
      // (Safari in particular can drop the up event in that case), or the
      // tab loses focus mid-drag (alt-tab, a notification, switching
      // apps on mobile). Without these the row would stay stuck in
      // "sorting-active" with a dangling transform.
      document.addEventListener('pointerleave', onPointerUp);
      window.addEventListener('blur', onPointerUp);
      e.preventDefault();
    }

    function onPointerMove(e){
      if(!dragRow) return;
      var deltaY = e.clientY - startY;
      dragRow.style.transform = 'translateY(' + deltaY + 'px) scale(1.02)';

      // Which row is currently under the pointer decides the live
      // preview position — recomputed from the ORIGINAL row order each
      // time (not accumulated deltas), so rapid back-and-forth dragging
      // never drifts out of sync with reality.
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var hoveredRow = under && under.closest ? under.closest('[data-id]') : null;
      if(hoveredRow && hoveredRow.parentNode === listEl && hoveredRow !== dragRow){
        var from = order.indexOf(dragRow);
        var to = order.indexOf(hoveredRow);
        if(from !== -1 && to !== -1 && from !== to){
          order.splice(from, 1);
          order.splice(to, 0, dragRow);
          rows.forEach(function(r, origIdx){
            if(r === dragRow) return;
            var newIdx = order.indexOf(r);
            r.style.transition = 'transform 160ms ease';
            r.style.transform = 'translateY(' + ((newIdx - origIdx) * rowHeight) + 'px)';
          });
        }
      }

      handleAutoScroll(e.clientY);
    }

    function handleAutoScroll(clientY){
      var rect = scrollBox.getBoundingClientRect();
      if(clientY < rect.top + EDGE) autoScrollDir = -1;
      else if(clientY > rect.bottom - EDGE) autoScrollDir = 1;
      else autoScrollDir = 0;
      if(autoScrollDir && !autoScrollRAF) runAutoScroll();
      if(!autoScrollDir && autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    }
    function runAutoScroll(){
      if(!autoScrollDir){ autoScrollRAF = null; return; }
      scrollBox.scrollTop += autoScrollDir * 12;
      autoScrollRAF = requestAnimationFrame(runAutoScroll);
    }

    function onPointerUp(){
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('pointercancel', onPointerUp);
      document.removeEventListener('pointerleave', onPointerUp);
      window.removeEventListener('blur', onPointerUp);
      if(autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
      autoScrollDir = 0;
      if(!dragRow) return; // already cleaned up — e.g. blur fired after a normal pointerup already ran

      // Commit the preview order to the real DOM, then strip every
      // inline transform/transition so nothing is left mid-animation.
      order.forEach(function(r){ listEl.appendChild(r); });
      rows.forEach(function(r){ r.style.transition = ''; r.style.transform = ''; });
      dragRow.style.pointerEvents = '';
      dragRow.classList.remove('sorting-active');
      listEl.classList.remove('sorting');

      var changed = order.some(function(r, i){ return r !== rows[i]; }) || dragIndex !== order.indexOf(dragRow);
      var finalIds = order.map(function(r){ return r.getAttribute('data-id'); });
      var draggedId = dragRow.getAttribute('data-id');
      dragRow = null;
      if(changed) onReorder(finalIds, draggedId);
    }

    listEl.addEventListener('pointerdown', onPointerDown);
  }

  /* ---------- Delete undo ---------- */
  // Delete no longer blocks on a confirm(). Instead the row(s) disappear
  // from the list immediately and a toast offers a few seconds to undo
  // before the actual DB delete happens. Only one pending delete is
  // tracked at a time — if the admin deletes something else (or a whole
  // batch) while one is still undoable, the earlier one is committed
  // right away rather than letting removed rows pile up invisibly.
  var pendingDelete = null; // { ids:[...as strings...], photos:[...snapshot], timeoutId }
  var UNDO_WINDOW_MS = 5000;
  var adminUndoToastEl = document.getElementById('adminUndoToast');

  function hideAdminUndoToast(){
    if(adminUndoToastEl) adminUndoToastEl.classList.remove('show');
  }
  function showAdminUndoToast(label){
    if(!adminUndoToastEl) return;
    adminUndoToastEl.innerHTML = '<span>'+escapeHtml(label)+'</span><button type="button" class="undo-btn">Undo</button>';
    adminUndoToastEl.classList.add('show');
    adminUndoToastEl.querySelector('.undo-btn').addEventListener('click', undoPendingDelete);
  }

  // Finalizes whatever delete is currently pending: actually removes it
  // from the database. Called when the undo window times out, and also
  // eagerly whenever something needs the pending delete resolved first
  // (another delete starting, the panel closing, the tab unloading).
  function commitPendingDelete(){
    if(!pendingDelete) return;
    var toCommit = pendingDelete;
    clearTimeout(toCommit.timeoutId);
    pendingDelete = null;
    hideAdminUndoToast();
    sb.from('photos').delete().in('id', toCommit.ids).then(function(){
      // Only the stats bar depends on data we already mutated locally —
      // the list itself was updated optimistically back when the delete
      // was scheduled, so it doesn't need touching again here.
      if(adminOverlay && adminOverlay.style.display !== 'none') renderAdminStats();
    });
  }

  function undoPendingDelete(){
    if(!pendingDelete) return;
    clearTimeout(pendingDelete.timeoutId);

    pendingDelete = null;

    // Splice the removed rows back in, sorted back into place rather
    // than tacked onto the end.
    adminPhotos = adminPhotos.concat(restored).sort(function(a,b){ return (a.display_order||0) - (b.display_order||0); });

  // the visible list and schedules the real delete a few seconds later
  // unless undone. `photosSnapshot` is the full row data being removed,
  // kept only so Undo can restore it without a round trip to the DB.
  function scheduleDelete(ids, photosSnapshot, label){
    if(pendingDelete) commitPendingDelete();
    adminPhotos = adminPhotos.filter(function(p){ return ids.indexOf(String(p.id)) === -1; });
    ids.forEach(function(id){ selectedPhotoIds.delete(id); });
    if(currentAdminTab === 'photos') drawPhotosAdmin();
    pendingDelete = {
      ids: ids,
      photos: photosSnapshot,
      timeoutId: setTimeout(commitPendingDelete, UNDO_WINDOW_MS)
    };
    showAdminUndoToast(label);
  }

  /* ---------- Bulk photo upload ---------- */

  // above (which is untouched). Select several files at once; each gets
  // processed/uploaded through the exact same uploadFile() pipeline and,
  // on success, becomes its own row in `photos` with a filename-derived
  // title and published:false (a deliberately safe default — bulk-
  // imported photos land in the list below like any other row, where the
  // admin can Edit each one to fill in story/tags/alt text/categories and
  // then Publish it, exactly like a normal photo).
  var bulkQueue = [];           // [{ id, file, status, pct, error, uploadResult, order }]
  var BULK_CONCURRENCY = 3;     // conservative — a few files in flight overlaps

  function titleFromFilename(name){
    var base = name.replace(/\.[^.]+$/, '');
    base = base.replace(/[_-]+/g, ' ').trim();
    if(!base) return 'Untitled';
    return base.replace(/\w\S*/g, function(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); });
  }
  // Runs `worker` over `items` with at most `limit` running concurrently.
  // Generic — not photo-specific — so it stays out of the way of anything
  // else the admin does; nothing here touches the DOM directly.
  function runWithConcurrency(items, limit, worker){
    return new Promise(function(resolve){
      if(!items.length){ resolve(); return; }
      var idx = 0, active = 0;
      function launchNext(){
        if(idx >= items.length) return;
        var item = items[idx++];
        active++;
        Promise.resolve(worker(item)).catch(function(){ /* individual failures are recorded on the item itself */ }).then(function(){
          active--;
          if(idx < items.length) launchNext();
          else if(active === 0) resolve();
        });

      var starters = Math.min(limit, items.length);
      for(var i=0;i<starters;i++) launchNext();
    });

  function bulkStageLabel(status){

  }
  // Per-item contribution to the overall bar. Real network progress is
  // used wherever it exists (uploading); the other stages don't have a
  // byte-level source, so they get a small fixed nudge rather than being
  // left at 0 the whole time they're active — this keeps the OVERALL
  // number honest about actual work in flight, per item 8's requirement
  // that it not simply track "files completed".
  function bulkItemContribution(item){
    if(item.status === 'done') return 100;
    if(item.status === 'uploading' && typeof item.pct === 'number') return item.pct;
    if(item.status === 'saving') return 95;
    if(item.status === 'processing') return 8;
    return 0; // waiting, or error (doesn't count as progress)
  }
  // Same before/after numbers the single-upload "optimized" panel shows

  // for one row in the bulk list. Real measured File/Blob sizes only —
  // nothing estimated. Empty string until the item has actually finished
  // processing (or if this file type wasn't resized at all).
  function bulkItemSizeLine(item){
    var res = item.uploadResult;
    if(!res || !res.resized || res.origSize == null || res.processedSize == null) return '';
    var reductionPct = res.origSize > 0 ? (100 * (1 - (res.processedSize / res.origSize))) : 0;
    var reductionLabel = (reductionPct >= 0 ? reductionPct.toFixed(0) + '% smaller' : Math.abs(reductionPct).toFixed(0) + '% larger');
    return formatBytes(res.origSize) + ' → <span class="after">' + formatBytes(res.processedSize) + '</span> · <span class="pct">' + reductionLabel + '</span>';
  }
  // Aggregate before/after across every item that's actually finished
  // processing so far — updates live as the batch runs, not just once at
  // the end. Items still waiting/processing/failed simply aren't counted
  // yet (failed ones never got a processed size to add).
  function bulkTotalsLine(){

      }
    });
    if(!counted) return '';
    var reductionPct = totalOrig > 0 ? (100 * (1 - (totalProcessed / totalOrig))) : 0;
    var reductionLabel = (reductionPct >= 0 ? reductionPct.toFixed(0) + '% smaller' : Math.abs(reductionPct).toFixed(0) + '% larger');
    return 'Total so far: ' + formatBytes(totalOrig) + ' → <span class="opt-after">' + formatBytes(totalProcessed) + '</span> · <span class="opt-reduction">' + reductionLabel + '</span>';

  function bulkItemInnerHtml(item){

      (sizeLine ? '<div class="bulk-item-size">'+sizeLine+'</div>' : '')+
      (item.status==='error' ? '<div class="bulk-item-error">'+escapeHtml(item.error||'Upload failed.')+'</div><button class="bulk-item-retry" data-retry="'+item.id+'">Retry</button>' : '');
  }
  // Full structural (re)build: the header, the summary strip, and every
  // item card from scratch. Only call this when the SET of items actually
  // changed (a batch starting) — every per-item progress update should go
  // through updateBulkItemUI()/updateBulkSummary() instead, which never
  // touch .bulk-list's own DOM node and so never reset its scroll position
  // (previously this function ran on every single progress tick from every
  // concurrent upload, via panel.innerHTML = html, which silently blew away
  // and recreated the scrollable list — and with it, its scrollTop — dozens
  // of times a minute during a real batch).
  function renderBulkPanel(){
    var panel = document.getElementById('bulkPanel');
    if(!panel) return; // admin has navigated away from the Photos tab — queue keeps running in the background regardless
    // This is a full rebuild — should now only run on first mount (nothing
    // to preserve yet) or the rare fallback in updateBulkItemUI(). Still,
    // explicitly save/restore .bulk-list's scroll position around it rather
    // than relying on "this path shouldn't normally fire mid-batch" — a

      '<div class="bulk-list" id="bulkList">'+

    panel.querySelectorAll('.bulk-item-retry').forEach(function(btn){

      });
    });

    var newList = document.getElementById('bulkList');
    if(newList && savedScroll) newList.scrollTop = savedScroll;
  }
  // Refreshes only the header strip above the scrollable list (completed
  // count, overall %, the totals line, and the Dismiss/"still uploading"
  // action row) — none of which live inside .bulk-list, so rebuilding this
  // small chunk never touches the list's scroll position.
  function updateBulkSummary(){
    var wrap = document.getElementById('bulkSummaryWrap');
    var actions = document.getElementById('bulkPanelActions');
    if(!wrap || !actions) return; // admin has navigated away
    var heading = document.getElementById('bulkHeading');
    if(heading) heading.textContent = 'Bulk Upload — '+bulkQueue.length+' photo'+(bulkQueue.length===1?'':'s');
    var doneCount = bulkQueue.filter(function(i){ return i.status === 'done'; }).length;
    var errorCount = bulkQueue.filter(function(i){ return i.status === 'error'; }).length;
    var overallPct = bulkQueue.length ? Math.round(bulkQueue.reduce(function(s,i){ return s + bulkItemContribution(i); }, 0) / bulkQueue.length) : 0;
    var allSettled = bulkQueue.every(function(i){ return i.status === 'done' || i.status === 'error'; });
    wrap.innerHTML = '<div class="bulk-summary"><span>'+doneCount+' / '+bulkQueue.length+' completed'+(errorCount?' · '+errorCount+' failed':'')+'</span><span class="overall-pct">'+overallPct+'%</span></div>'+
      '<div class="bulk-summary-track"><div class="bulk-summary-fill" style="width:'+overallPct+'%;"></div></div>'+
      (bulkTotalsLine() ? '<div class="bulk-totals">'+bulkTotalsLine()+'</div>' : '');
    actions.innerHTML = allSettled ? '<button class="admin-btn secondary" id="bulkDismissBtn">Dismiss</button>' : '<span class="sub">Uploading — you can switch tabs, this keeps running.</span>';
    var dismissBtn = document.getElementById('bulkDismissBtn');

    });
  }
  // Updates exactly one item card's inner content by id — the card element
  // itself (and every other card, and .bulk-list itself) is left completely
  // untouched, which is what actually keeps the admin's scroll position
  // (e.g. looking at photos 17–20) stable while other items in the batch
  // keep progressing around it.
  //
  // Coalesced to at most one repaint per animation frame PER ITEM: XHR's
  // upload.onprogress can fire dozens of times a second on a fast
  // connection uploading a large photography file, and with several files
  // uploading concurrently (BULK_CONCURRENCY) that's a lot of redundant
  // innerHTML writes for progress numbers nobody can actually read at
  // that rate. item.status/item.pct are always updated synchronously by
  // the caller before this runs, so a coalesced frame always paints the
  // latest value — nothing is ever shown stale, only intermediate values
  // between two same-frame updates are skipped.
  var _bulkPaintQueued = {};
  function updateBulkItemUI(item){
    if(_bulkPaintQueued[item.id]) return;
    _bulkPaintQueued[item.id] = true;
    requestAnimationFrame(function(){
      _bulkPaintQueued[item.id] = false;
      var panel = document.getElementById('bulkPanel');
      if(!panel) return;
      var card = panel.querySelector('.bulk-item[data-item-id="'+item.id+'"]');
      if(!card){ renderBulkPanel(); return; } // shouldn't normally happen — fall back to a full rebuild
      card.innerHTML = bulkItemInnerHtml(item);
      var retryBtn = card.querySelector('.bulk-item-retry');
      if(retryBtn) retryBtn.addEventListener('click', function(){ processBulkItem(item); });
