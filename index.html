<style>
  :root{
    --ink:#050505;
    --white:#f6f4ef;
    --dim:rgba(246,244,239,0.58);
    --dim-2:rgba(246,244,239,0.36);
    --line:rgba(246,244,239,0.16);
    --line-soft:rgba(246,244,239,0.09);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --dur-1:560ms;
    --ease:cubic-bezier(.19,1,.22,1);
    --font-display:'Newsreader', serif;
    --font-body:'Inter', sans-serif;
    --size-title: clamp(2.5rem, 5vw, 6rem);
    --size-desc:  clamp(0.95rem, 1.2vw, 1.25rem);
    --size-nav:   0.88rem;
    --size-meta:  0.75rem;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    overflow:hidden; /* .scroller (now holding hero + every scene) is the only thing that ever scrolls */
  }
  ::selection{ background:var(--white); color:var(--ink); }
  a{ color:inherit; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .meta{ font-family:var(--font-body); font-weight:500; letter-spacing:.18em; text-transform:uppercase; font-size:var(--size-meta); color:var(--dim-2); }

  .grain{

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");

  /* Desktop scroll-nav: a pair of up/down arrow buttons for mouse/trackpad
     users, since wheel-driven scene advance (see setupWheelAdvance) can feel
     imprecise without a native scrollbar to grab. Hidden entirely on touch

  .scroll-nav{ display:none; }
  @media (min-width: 860px) and (pointer:fine){

      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      color:var(--white); transition:border-color 260ms var(--ease), background 260ms var(--ease), transform 160ms var(--ease), opacity 260ms var(--ease);

    .scroll-nav .scroll-down:hover:not(:disabled) svg{ transform:translateY(2px); }
    .scroll-nav button:active:not(:disabled){ transform:scale(.92); }
    .scroll-nav button:disabled{ opacity:.28; cursor:default; }

  /* .mark doubles as the hidden admin entry point: click it 10x within 2s.
     pointer-events stays "auto" (not "none") so it's clickable even while
     invisible at opacity 0 — the visual fade-in behavior is unchanged. */
  .mark{ position:fixed; top:calc(22px + var(--safe-t)); left:calc(22px + var(--safe-l)); z-index:50; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:15px; letter-spacing:.02em; opacity:0; transition:opacity 700ms var(--ease); pointer-events:auto; padding:10px 14px; margin:-10px -14px; }
  .mark.show{ opacity:1; }

  /* Category navigation — a single-line, horizontally swipeable bar
     (TikTok/Instagram-style category browsing). Sits below .mark so the
     two never collide on narrow phones. Hidden on the hero (shown via the
     same "show" trigger .mark uses) and never wraps to a second line —
     it scrolls horizontally instead, with the scrollbar hidden but the
     scroll behavior preserved for touch/trackpad. */
  .cat-nav{
    position:fixed; z-index:50; left:0; right:0; top:calc(60px + var(--safe-t));
    display:flex; gap:26px; overflow-x:auto; overflow-y:hidden;
    padding:0 calc(22px + var(--safe-l)) 6px calc(22px + var(--safe-l));
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    opacity:0; transition:opacity 700ms var(--ease); white-space:nowrap;
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-nav.show{ opacity:1; }
  .cat-nav.empty{ display:none; }
  .cat-btn{
    flex:0 0 auto; font-family:var(--font-body); font-weight:500; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim-2);
    padding:8px 1px; border-bottom:1px solid transparent;
    transition:color 260ms var(--ease), border-color 260ms var(--ease);
  }
  .cat-btn:hover{ color:var(--dim); }
  .cat-btn.active{ color:var(--white); border-color:var(--white); }
  .cat-btn:focus-visible{ outline:1px solid var(--white); outline-offset:3px; }
  @media (min-width:860px){
    .cat-nav{ justify-content:center; }
  }

  .hero{ height:100vh; height:100dvh; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(40px + var(--safe-b)); background:var(--ink); scroll-snap-align:start; scroll-snap-stop:always; }
  /* Same reveal treatment as .scene / .finale photos: blurred, desaturated
     and darkened at rest, clearing once .in-view is added. Uses cover (not
     contain) since this is a full-bleed backdrop, not a letterboxed frame,
     so there's no letterbox edge to hide and no scale-up trick is needed. */
  .hero-backdrop{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
  .hero-backdrop img{ width:100%; height:100%; object-fit:cover; object-position:center; opacity:0; filter:blur(6px) grayscale(.32) brightness(.6); transition:opacity 1100ms var(--ease), filter 1600ms var(--ease); -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  .hero-backdrop.in-view img{ opacity:1; filter:blur(0) grayscale(.18) brightness(.8); }
  .hero-scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(5,5,5,.32) 0%, rgba(5,5,5,.4) 46%, rgba(5,5,5,.86) 100%); pointer-events:none; }
  .hero-inner{ position:relative; z-index:2; max-width:820px; }
  /* Staggered fade-and-rise entrance, matching the considered reveal every
     scene already gets (see .scene .tag / h2 / p.caption below) — the hero
     text used to just snap into view with none of that. */
  .hero-inner > *{ opacity:0; transform:translateY(18px); transition:opacity 900ms var(--ease), transform 900ms var(--ease); }
  .hero.ready .hero-inner > *{ opacity:1; transform:translateY(0); }
  .hero.ready .hero-inner > *:nth-child(2){ transition-delay:0ms; }
  .hero.ready .hero-inner > *:nth-child(3){ transition-delay:160ms; }
  .hero.ready .hero-inner > *:nth-child(4){ transition-delay:340ms; }
  .hero.ready .hero-inner > *:nth-child(5){ transition-delay:480ms; }
  /* Hero text order is: location+count line, "By", signature (name). The
     location line wraps naturally (no nowrap) since "Gabès, Tunisia — N
     Documentary Photography" is too long to fit one line on narrow phones;
     letter-spacing/font-size are trimmed further at small widths below so
     it never forces horizontal overflow. */
  .hero .meta{ display:block; margin-bottom:18px; color:var(--dim); line-height:1.65; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .hero .by-line{ font-family:var(--font-body); font-weight:300; font-size:var(--size-nav); letter-spacing:.08em; text-transform:uppercase; color:var(--dim-2); margin:0 0 18px; }
  .signature-wrap{ margin:0 0 34px; display:flex; justify-content:center; }
  .signature-svg{ width:min(86vw, 620px); height:auto; display:block; overflow:visible; }
  .signature-svg text{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:92px; fill:var(--white); fill-opacity:0; stroke:var(--white); stroke-width:1.4; stroke-linejoin:round; paint-order:stroke fill; }
  .signature-svg text.filled{ transition:fill-opacity 650ms var(--ease); fill-opacity:1; }
  @media (max-width:430px){
    .hero .meta{ font-size:0.68rem; letter-spacing:.1em; }
  }
  .enter{ display:inline-flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.16em; text-transform:uppercase; color:var(--white); padding:6px; border-bottom:1px solid transparent; transition:border-color 300ms var(--ease); }
  .enter:hover{ border-color:var(--line); }
  .enter .arrow-line{ width:1px; height:34px; background:var(--line); position:relative; overflow:hidden; }
  .enter .arrow-line::after{ content:""; position:absolute; left:0; top:-100%; width:100%; height:100%; background:var(--white); animation:drip 2.4s var(--ease) infinite; }
  @keyframes drip{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }

  /* mandatory ensures every scroll gesture always comes to rest on a full
     scene — never half-way between two — even on a soft swipe or a
     trackpad flick that doesn't carry quite enough momentum to clear the
     midpoint on its own. Desktop wheel input is additionally handled by
     JS (see setupWheelAdvance) since trackpads/mice don't have native
     momentum-to-snap behavior at all. */
  .scroller{ height:100vh; height:100dvh; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
  .scene{ position:relative; height:100vh; height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:normal; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:calc(22px + var(--safe-t)) 22px calc(22px + var(--safe-b)); background:var(--ink); }
  .scene .frame-img{ position:relative; width:100%; flex:1 1 auto; min-height:34vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* .wm-frame sits between .frame-img (the full flex slot the photo is
     centered in) and the <img> itself. It carries the SAME aspect-ratio as
     the photo (set inline per-photo, falling back to 3/4) plus max-width/
     max-height:100%, which makes the browser size it exactly the way it
     sizes a replaced element (like the <img> used to be sized on its own):
     as large as possible without exceeding either dimension of .frame-img.
     The upshot is .wm-frame's box == the photo's actual rendered box, with
     zero letterbox gap — unlike .frame-img, whose own box is the full
     flex slot and can be much taller/wider than the photo once object-fit
     contain has letterboxed it. That mismatch (container box vs. real
     photo box) is what let the watermark drift away from the visible
     photo edge on some screens/aspect ratios; anchoring the watermark to
     .wm-frame instead fixes it consistently across phone/tablet/desktop. */
  .scene .frame-img .wm-frame{ position:relative; max-width:100%; max-height:100%; aspect-ratio:3/4; }
  .scene .frame-img .wm-frame img{ display:block; width:100%; height:100%; object-fit:contain; object-position:center; transform:scale(1.05); filter:blur(6px) grayscale(.06) brightness(.94); transition:transform 950ms var(--ease), filter 850ms var(--ease); }
  .scene.in-view .frame-img .wm-frame img{ transform:scale(1.0); filter:blur(0) grayscale(0) brightness(1); }
  /* Photo protection, scoped to the photos themselves — not the whole
     page — so captions, the contact email and every other text on the
     site stay normally selectable and clickable. This is friction, not a
     lock: it stops the average right-click/long-press save, nothing more.
     Screenshots, screen recordings and photos-of-the-screen can't be
     blocked by any website; the watermark below is what actually survives
     those, since it's baked into every pixel a person could capture. */
  .frame-img img{ -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  /* Watermark system — content comes from the data-wm-text attribute (set
     per-scene in renderScenes(), merging global site_settings with any
     per-photo override) rather than a quoted CSS string, so arbitrary text
     can be injected safely without fighting CSS string-escaping. Position
     is a class (one of .wm-br/.wm-bl/.wm-tr/.wm-tl/.wm-cb/.wm-center) and
     opacity/offsets are inline custom properties, both computed by the
     same merge in JS. A photo with no data-wm-text (watermark off) simply
     renders an empty, invisible pseudo-element. Lives on .wm-frame (the
     box that matches the real photo edges) rather than .frame-img (the
     full flex slot) — see the comment on .wm-frame above. */
  .wm-frame::after{
    content: attr(data-wm-text);
    position:absolute; z-index:4;
    right:var(--wm-x, 20px); bottom:var(--wm-y, 20px);
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:16px; letter-spacing:.02em;
    color:rgba(255,255,255, var(--wm-opacity, .35));
    text-shadow:0 2px 10px rgba(0,0,0,.8);
    pointer-events:none; user-select:none; white-space:nowrap;
  }
  .wm-frame.wm-bl::after{ left:var(--wm-x, 20px); right:auto; bottom:var(--wm-y, 20px); top:auto; }
  .wm-frame.wm-tr::after{ right:var(--wm-x, 20px); left:auto; top:var(--wm-y, 20px); bottom:auto; }
  .wm-frame.wm-tl::after{ left:var(--wm-x, 20px); right:auto; top:var(--wm-y, 20px); bottom:auto; }
  .wm-frame.wm-cb::after{ left:50%; right:auto; bottom:var(--wm-y, 20px); top:auto; transform:translateX(-50%); }
  .wm-frame.wm-center::after{ left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%); }
  @media (max-width:720px){
    .wm-frame::after{ font-size:12px; } /* deliverable: watermark stays subtle/readable on small frames */
  }
  .scene:not(.finale) .scrim{ display:none; }
  .scene-content{ position:relative; z-index:3; width:100%; display:flex; flex-direction:column; gap:14px; max-width:640px; flex:0 0 auto; }
  .scene .tag{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:500; opacity:0; transform:translateY(8px); transition:opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
  .scene h2{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:var(--size-title); line-height:1.05; margin:0; letter-spacing:-.005em; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 70ms, transform var(--dur-1) var(--ease) 70ms; }
  .scene p.caption{ font-family:var(--font-body); font-weight:300; font-size:var(--size-desc); line-height:1.65; color:var(--dim); margin:0; max-width:46ch; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 160ms, transform var(--dur-1) var(--ease) 160ms; }
  .scene.in-view .tag, .scene.in-view h2, .scene.in-view p.caption{ opacity:1; transform:translateY(0); }
  .scene-rule{ height:1px; background:var(--line-soft); margin-top:8px; transform:scaleX(0); transform-origin:left; transition:transform 900ms var(--ease) 260ms; }
  .scene.in-view .scene-rule{ transform:scaleX(1); }

  .scene.in-view .scene-actions{ opacity:1; transform:translateY(0); }
  .actions-left{ display:flex; align-items:center; gap:18px; }
  .action-btn{ display:flex; align-items:center; gap:9px; padding:12px 2px; min-height:44px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.01em; color:var(--white); }
  .action-btn svg{ width:16px; height:16px; flex-shrink:0; stroke:currentColor; transform-origin:50% 50%; }

    .scene:not(.finale) .frame-img{ flex:0 1 auto; width:auto; max-width:54%; height:100%; min-height:0; }

    .scene:not(.finale) .scene-content::-webkit-scrollbar{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .scene .frame-img img{ transition:none !important; transform:none !important; filter:none !important; }
    .scene .tag, .scene h2, .scene p.caption, .scene-actions, .scene-rule{ transition:none !important; opacity:1 !important; transform:none !important; }
    .enter .arrow-line::after{ animation:none; }
    .grain{ display:none; }
    .like-btn.pulse svg{ animation:none; }
    .action-btn:active svg{ transform:none; }
    .signature-svg text{ stroke:none; fill-opacity:1 !important; transition:none !important; }
    .hero-backdrop img{ transition:none !important; opacity:1 !important; filter:none !important; }
    .hero-inner > *{ transition:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ===================== ADMIN ===================== */
  .admin-overlay{ position:fixed; inset:0; z-index:200; background:rgba(5,5,5,.92); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; }
  .admin-login-box{ width:100%; max-width:320px; background:var(--ink); border:1px solid var(--line); padding:32px 28px; text-align:center; }
  .admin-login-box input{ width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--white); font-family:var(--font-body); font-size:1rem; padding:10px 4px; text-align:center; letter-spacing:.08em; outline:none; margin:18px 0 20px; }
  .admin-login-box input:focus{ border-color:var(--white); }
  .admin-login-box button.primary{ width:100%; padding:12px; border:1px solid var(--line); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; }
  .admin-login-box button.primary:hover{ border-color:var(--white); }
  .admin-login-box button.primary:disabled{ opacity:.5; cursor:default; }
  .admin-login-box .error{ color:#ff8b7a; font-size:.8rem; margin-top:14px; }
  .admin-login-box .cancel{ margin-top:16px; color:var(--dim-2); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; }

  .admin-panel{ width:100%; max-width:1000px; height:88vh; background:#0c0c0c; border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  .admin-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-top h1{ font-family:var(--font-display); font-style:italic; font-size:1.1rem; font-weight:500; margin:0; }
  .admin-top-actions{ display:flex; gap:18px; }
  .admin-top-actions button{ font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); padding:4px 0; }
  .admin-top-actions button:hover{ color:var(--white); border-color:var(--white); }
  .admin-tabs{ display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-tab{ padding:14px 16px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--white); border-color:var(--white); }
  .admin-scroll{ overflow-y:auto; padding:22px 24px; flex:1; }

  .admin-toolbar{ display:flex; justify-content:flex-end; margin-bottom:16px; }
  .admin-btn{ background:var(--white); color:var(--ink); padding:9px 16px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
  .admin-btn.secondary{ background:transparent; color:var(--white); border:1px solid var(--line); }
  .admin-btn:disabled{ opacity:.5; }

  .admin-list{ display:flex; flex-direction:column; border:1px solid var(--line); }
  .admin-row{ display:grid; grid-template-columns:56px 1fr 100px 90px 210px; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line-soft); font-size:.82rem; }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row img{ width:48px; height:48px; object-fit:cover; background:#1a1a1a; }
  .admin-row .col-title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .admin-row .col-title strong{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-row .sub{ color:var(--dim-2); font-size:.7rem; }
  .ratio-badge{ display:inline-block; font-size:.66rem; letter-spacing:.04em; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .admin-field .ratio-badge{ margin-left:0; margin-top:6px; }
  .status{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; }
  .status.on{ color:#8de08d; } .status.off{ color:var(--dim-2); }
  .admin-row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .admin-row-actions button{ font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); }
  .admin-row-actions button:hover{ color:var(--white); }

  .admin-form{ border:1px solid var(--line); padding:22px; margin-bottom:18px; display:flex; flex-direction:column; gap:13px; }
  .admin-form h3{ margin:0 0 2px; font-family:var(--font-display); font-style:italic; font-weight:500; }
  .admin-field{ display:flex; flex-direction:column; gap:6px; }
  .admin-field label{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .admin-field input[type="text"], .admin-field input[type="date"], .admin-field input[type="email"], .admin-field input[type="url"], .admin-field textarea{ background:#151515; border:1px solid var(--line); color:var(--white); padding:9px 11px; font-family:var(--font-body); font-size:max(16px, .88rem); }
  .admin-field textarea{ resize:vertical; min-height:70px; }
  .admin-field.row{ flex-direction:row; align-items:center; gap:9px; }
  .admin-field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .admin-form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .admin-image-preview{ width:160px; aspect-ratio:2/3; object-fit:cover; background:#1a1a1a; }
  .cat-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip{ display:inline-flex; align-items:center; gap:7px; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--line); padding:7px 11px; color:var(--dim); cursor:pointer; user-select:none; transition:color 200ms var(--ease), border-color 200ms var(--ease); }
  .cat-chip input{ accent-color:var(--white); margin:0; }
  .cat-chip.checked{ color:var(--white); border-color:var(--white); }
  .admin-row.cat-row{ grid-template-columns:1fr 90px 210px; }
  .admin-uploading{ font-size:.72rem; color:var(--dim); }
  .admin-empty{ padding:34px; text-align:center; color:var(--dim-2); font-size:.85rem; }
  .admin-error{ color:#ff8b7a; font-size:.8rem; }
  .admin-saved{ color:#8de08d; font-size:.78rem; align-self:center; }

  @media (max-width: 720px){
    .admin-row{ grid-template-columns:44px 1fr; grid-template-areas:"thumb title" "actions actions"; }
    .admin-row img{ grid-area:thumb; width:40px; height:40px; }
    .admin-row .col-title{ grid-area:title; }
    .admin-row-actions{ grid-area:actions; }
    .admin-row > *:not(img):not(.col-title):not(.admin-row-actions){ display:none; }
    .admin-field-grid{ grid-template-columns:1fr; }
    .admin-panel{ height:94vh; }
  }
</style>
</head>
<body>

<div class="scroll-nav" id="scrollNav" aria-hidden="true">
  <button class="scroll-up" id="scrollUpBtn" type="button" aria-label="Previous photo">

  </div>

    <p class="by-line">By</p>
    <div class="signature-wrap" aria-hidden="true">
      <svg class="signature-svg" id="signatureSvg" viewBox="0 0 700 160" preserveAspectRatio="xMidYMid meet">
        <text id="signatureText" x="50%" y="62%" text-anchor="middle" dominant-baseline="middle">Islem Zrelli</text>
      </svg>

<!-- ============ ADMIN PANEL ============ -->

    <div class="admin-top">
      <h1>Islem Zrelli — Admin</h1>

        <button id="exportSitemapBtn">Export sitemap.xml</button>

    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= CONFIG — fill these in once, then you're done ================
     SUPABASE_URL / SUPABASE_ANON_KEY: Project Settings -> API in your Supabase project.

     NOTE: This build has NO password gate — the admin panel opens for anyone who
     clicks the "I. Z." mark 10x within 2s. That means your Supabase Row Level
     Security policies must allow public (anon) INSERT/UPDATE/DELETE on the
     `photos` and `about` tables and public writes to the storage bucket for the
     panel to actually work — which also means anyone who finds this gesture
     (e.g. via view-source) can edit or delete your content. If you want that
     door closed again later, reintroduce a Supabase Auth check here. */
  var SUPABASE_URL = "https://bkjwzdspuriquurfxcnp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_8SR8bCmRJAcQtP1eGe6PDA_YDr3AXJ1";
  /* ================================================================================

     WATERMARK FEATURE — run this once in the Supabase SQL editor before the
     admin "Watermark" tab or per-photo overrides will have anywhere to save
     to. Until you run it, the site falls back to sensible in-code defaults
     (visible watermark, bottom-right, 35% opacity) and the admin tab will
     just show those defaults with a Save button that creates the row.

  -- Global watermark settings (single row, id = 1)
  create table if not exists site_settings (
    id int primary key default 1,
    watermark_enabled boolean default true,
    watermark_text text default 'Islem Zrelli',
    watermark_opacity numeric default 0.35,
    watermark_position text default 'bottom-right',
    watermark_x_offset int default 20,
    watermark_y_offset int default 20,
    updated_at timestamptz default now()
  );
  insert into site_settings (id) values (1) on conflict (id) do nothing;

  -- Same no-auth tradeoff as the rest of this build (see the note above):
  -- public anon read/write so the hidden admin gesture can save changes.
  alter table site_settings enable row level security;
  create policy "public read settings" on site_settings for select using (true);
  create policy "public write settings" on site_settings for insert with check (true);
  create policy "public update settings" on site_settings for update using (true);

  -- Per-photo override columns
  alter table photos add column if not exists watermark_override boolean default false;
  alter table photos add column if not exists watermark_position text;
  alter table photos add column if not exists watermark_x_offset int;
  alter table photos add column if not exists watermark_y_offset int;


  CATEGORY NAVIGATION — run this once in the Supabase SQL editor before the
  admin "Categories" tab, the per-photo category chips, or the public
  category nav bar will have anywhere to read/write. Until you run it, the
  site falls back gracefully: the public nav just shows "Favorite" alone,
  and the admin Categories tab / photo-editor chips show an empty state.
  "Favorite" itself is a special client-side pseudo-category — it is NOT a
  row in this table — driven entirely by the photos.is_favorite column.

  create table if not exists categories (
    id uuid primary key default gen_random_uuid(),
    name text not null,
    slug text not null,
    sort_order int default 0,
    is_visible boolean default true,
    created_at timestamptz default now()
  );

  create table if not exists photo_categories (
    photo_id bigint references photos(id) on delete cascade,
    category_id uuid references categories(id) on delete cascade,
    primary key (photo_id, category_id)
  );
  -- NOTE: adjust photo_id's type above to match your photos.id column type
  -- (bigint/int8 is Supabase's default identity type — change to uuid if
  -- your photos table uses uuid primary keys instead).

  alter table photos add column if not exists is_favorite boolean default false;

  -- Same no-auth tradeoff as the rest of this build (see the note above):
  -- public anon read/write so the hidden admin gesture can save changes.
  alter table categories enable row level security;
  create policy "public read categories" on categories for select using (true);
  create policy "public write categories" on categories for insert with check (true);
  create policy "public update categories" on categories for update using (true);
  create policy "public delete categories" on categories for delete using (true);

  alter table photo_categories enable row level security;
  create policy "public read photo_categories" on photo_categories for select using (true);
  create policy "public write photo_categories" on photo_categories for insert with check (true);
  create policy "public delete photo_categories" on photo_categories for delete using (true);

  -- Seed the six starting categories (Favorite is not included — see above):
  insert into categories (name, slug, sort_order) values
    ('Air Pollution', 'air-pollution', 0),
    ('Sea Pollution', 'sea-pollution', 1),
    ('Dead Animals',  'dead-animals',  2),
    ('Wall',          'wall',          3),
    ('Landscape',     'landscape',     4)
  on conflict do nothing;

  ================================================================================ */

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var BUCKET = "photos";

  /* SITE_URL: used for canonical links, Open Graph/Twitter urls, clean per-photo
     URLs, and the admin sitemap export. No trailing slash. */
  var SITE_URL = "https://zrelli-zr.github.io/islem_zrelli.github.com";
  // BASE_PATH is the "/islem_zrelli.github.com" part — this is a GitHub Pages
  // *project* site (not a <user>.github.io root site), so every client-side
  // route written to the address bar must include this prefix or it points
  // outside the actual site and 404s on refresh/share.
  var BASE_PATH = (function(){ try{ return new URL(SITE_URL).pathname.replace(/\/$/, ''); } catch(e){ return ''; } })();
  var DEFAULT_TITLE = document.title;
  var DEFAULT_DESC = document.querySelector('meta[name="description"]').content;

  var photos = [];
  var activePhotos = [];       // currently displayed (filtered) subset of `photos`
  var categories = [];         // rows from Supabase `categories` table
  var photoCategoryMap = {};   // photo_id -> [category_id, ...]
  var currentCategorySlug = 'favorite';
  var about = {};
  var session = null;

  /* ================= WATERMARK ================= */
  var DEFAULT_WATERMARK = {
    watermark_enabled: true,
    watermark_text: 'Islem Zrelli',
    watermark_opacity: 0.35,
    watermark_position: 'bottom-right',
    watermark_x_offset: 20,
    watermark_y_offset: 20
  };
  var settings = Object.assign({}, DEFAULT_WATERMARK);

  var WM_POSITIONS = [
    { value:'bottom-right',  label:'Bottom Right',  cls:'wm-br' },
    { value:'bottom-left',   label:'Bottom Left',   cls:'wm-bl' },
    { value:'top-right',     label:'Top Right',     cls:'wm-tr' },
    { value:'top-left',      label:'Top Left',      cls:'wm-tl' },
    { value:'center-bottom', label:'Center Bottom', cls:'wm-cb' },
    { value:'center',        label:'Center',        cls:'wm-center' }
  ];
  function wmClassFor(pos){
    var m = WM_POSITIONS.find(function(o){ return o.value === pos; });
    return m ? m.cls : 'wm-br';
  }
  function wmPositionOptionsHtml(selected){
    var html = '';
    WM_POSITIONS.forEach(function(p){
      html += '<option value="'+p.value+'" '+(selected===p.value?'selected':'')+'>'+p.label+'</option>';
    });
    return html;
  }

  // Merges global watermark settings with a photo's own override (if it has
  // one) into the concrete {text, opacity, position, x, y} the CSS needs.
  // Returns null when the watermark is switched off globally — callers
  // then simply don't stamp data-wm-text on that photo's frame.
  function watermarkConfigFor(p){
    if(!settings.watermark_enabled) return null;
    var useOverride = !!(p && p.watermark_override && p.watermark_position);
    return {
      text: settings.watermark_text || 'Islem Zrelli',
      opacity: (settings.watermark_opacity != null ? settings.watermark_opacity : 0.35),
      position: useOverride ? p.watermark_position : settings.watermark_position,
      x: (useOverride && p.watermark_x_offset != null) ? p.watermark_x_offset : settings.watermark_x_offset,
      y: (useOverride && p.watermark_y_offset != null) ? p.watermark_y_offset : settings.watermark_y_offset
    };
  }

  // Builds the class + attribute string for a scene's inner .wm-frame
  // wrapper (the box that's sized to match the photo's actual rendered
  // edges — see the CSS comment on .wm-frame). This is where the
  // watermark position class + data-wm-text + aspect-ratio all live now,
  // not on the outer .frame-img. Kept separate from the html-building
  // loop in renderScenes() so the admin preview (drawWatermarkAdmin) can
  // share the exact same logic.
  function wmFrameAttrs(p){
    var ratio = (p && p.image_width && p.image_height) ? (p.image_width+'/'+p.image_height) : '3/4';
    var wm = watermarkConfigFor(p);
    if(!wm) return ' class="wm-frame" style="aspect-ratio:'+ratio+';"';
    return ' class="wm-frame '+wmClassFor(wm.position)+'" data-wm-text="'+escapeHtml(wm.text)+'" style="aspect-ratio:'+ratio+'; --wm-opacity:'+wm.opacity+'; --wm-x:'+wm.x+'px; --wm-y:'+wm.y+'px;"';
  }

  async function loadSettings(){
    try{
      var res = await sb.from('site_settings').select('*').eq('id', 1).single();
      if(res && res.data) settings = Object.assign({}, DEFAULT_WATERMARK, res.data);
    } catch(e){ /* table not created yet (see SQL note above) — keep defaults */ }
  }

  /* ================= CATEGORIES ================= */

  async function loadCategories(){
    try{
      var res = await sb.from('categories').select('*').order('sort_order', { ascending:true });
      categories = res.data || [];
    } catch(e){ categories = []; } // table not created yet (see SQL note above)
  }

  async function loadPhotoCategories(){
    try{
      var res = await sb.from('photo_categories').select('*');
      var rows = res.data || [];
      photoCategoryMap = {};
      rows.forEach(function(r){
        if(!photoCategoryMap[r.photo_id]) photoCategoryMap[r.photo_id] = [];
        photoCategoryMap[r.photo_id].push(r.category_id);
      });
    } catch(e){ photoCategoryMap = {}; }
  }

  // The public nav list: "Favorite" is always first and is a system
  // pseudo-category (backed by photos.is_favorite, not a categories row),
  // followed by every visible category in admin-defined sort order.
  function navCategoryList(){
    var list = [{ id:'favorite', name:'Favorite', slug:'favorite', system:true }];
    categories.forEach(function(c){ if(c.is_visible !== false) list.push(c); });
    return list;
  }

  function photosForCategory(slug){
    if(slug === 'favorite') return photos.filter(function(p){ return !!p.is_favorite; });
    var cat = categories.find(function(c){ return c.slug === slug; });
    if(!cat) return photos.slice();
    return photos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(cat.id) !== -1; });
  }

  function categorySlugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('^' + base + '\\/category\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;
  }

  function categoryUrlPath(slug){
    return slug === 'favorite' ? (BASE_PATH + '/') : (BASE_PATH + '/category/' + slug + '/');
  }

  function updateHeadForCategory(slug){
    var list = navCategoryList();
    var cat = list.find(function(c){ return c.slug === slug; });
    if(!cat || slug === 'favorite'){ resetHeadToDefault(); return; }
    var title = 'Islem Zrelli — ' + cat.name;
    document.title = title;
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[name="twitter:title"]', title);
    var canon = document.getElementById('canonicalLink');
    var url = SITE_URL + '/category/' + slug + '/';
    if(canon) canon.href = url;
    setMetaContent('meta[property="og:url"]', url);
  }

  function renderCategoryNav(){
    var nav = document.getElementById('catNav');
    if(!nav) return;
    var list = navCategoryList();
    nav.innerHTML = list.map(function(c){
      var active = c.slug === currentCategorySlug;
      return '<button type="button" class="cat-btn'+(active?' active':'')+'" data-slug="'+escapeHtml(c.slug)+'" aria-current="'+(active?'true':'false')+'">'+escapeHtml(c.name)+'</button>';
    }).join('');
  }

  // Switches the visible gallery to a category, without a page reload.
  // Reuses the existing one-photo-at-a-time scene engine — this only
  // changes which photo array feeds it (see renderScenes()).
  function selectCategory(slug, opts){
    opts = opts || {};
    var list = navCategoryList();
    if(!list.some(function(c){ return c.slug === slug; })) return;
    currentCategorySlug = slug;
    activePhotos = photosForCategory(slug);
    renderCategoryNav();
    renderScenes();
    if(activePhotos.length) injectGalleryLd(activePhotos);
    if(!opts.skipHead) updateHeadForCategory(slug);
    if(!opts.skipHistory){
      history.pushState({ category: slug }, '', categoryUrlPath(slug));
    }
    if(!opts.skipScrollReset){
      // Jump straight to the first photo of the new category — never back
      // to the hero — so switching categories mid-browse never feels like
      // "leaving" the gallery.
      requestAnimationFrame(function(){
        var slides = sceneNav.navSlides();
        if(slides.length > 1) scroller.scrollTop = slides[1].offsetTop;
        updateScrollNavState();
      });
    }
  }

  document.getElementById('catNav').addEventListener('click', function(e){
    var btn = e.target.closest('.cat-btn');
    if(!btn) return;
    var slug = btn.getAttribute('data-slug');
    if(slug === currentCategorySlug) return;
    selectCategory(slug);
  });
  // Left/right arrow keys move focus between category buttons when the
  // nav itself has focus, per the accessibility requirement for
  // horizontal category browsing.
  document.getElementById('catNav').addEventListener('keydown', function(e){
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;

  // Draws the hero signature like it's being written, then lets the ink

  // is only ever seen fresh (there's no client-side route change back to
  // it), so "every time someone enters the site" and "on load" are the
  // same event here.
  //
  // This animates a real <text> element (correct, legible letterforms) —
  // not a hand-authored calligraphy path — so there's nothing to draw
  // incorrectly. Text elements don't support getTotalLength(), so instead
  // of measuring the exact stroke length we use a dasharray/dashoffset
  // value (4000) that's comfortably longer than the glyphs' total stroke
  // perimeter at this font size within the SVG's fixed 700-wide viewBox —
  // since the viewBox coordinate space doesn't change with screen size,
  // one constant works everywhere.
  (function animateSignature(){
    var text = document.getElementById('signatureText');
    if(!text) return;

    // the transition below is triggered — otherwise it can jump straight
    // to the end state instead of animating.
    text.getBoundingClientRect();
    text.style.transition = 'stroke-dashoffset 1500ms cubic-bezier(.65,0,.35,1)';

  function slugify(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')

  }

  function ensureSlugs(list){

      seen[slug] = true;

    });
  }

  var ioInstance = null;
  var imgNearObserver = null, imgFarObserver = null;
  // Custom image loading, not relying on the browser's native loading="lazy" —
  // some in-app/embedded browsers (this is what was crashing in Telegram's
  // in-app browser) don't reliably honor it, and with hundreds of photos that
  // means every full-size image trying to load at once. This preloads a
  // photo shortly before it's needed and frees it again once you've
  // scrolled well past it, so memory use stays bounded regardless of gallery size.
  function setupImageLazyLoading(){
    if(imgNearObserver) imgNearObserver.disconnect();
    if(imgFarObserver) imgFarObserver.disconnect();
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.frame-img img[data-src]'));
    if(!imgs.length) return;
    imgNearObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var img = entry.target;
        var src = img.getAttribute('data-src');
        if(src && img.getAttribute('src') !== src) img.setAttribute('src', src);
      });
    }, { root: scroller, rootMargin: '150% 0px', threshold: 0 });
    imgFarObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting) return;
        var img = entry.target;
        if(img.getAttribute('src')) img.removeAttribute('src'); // data-src keeps the URL so it reloads on the way back
      });
    }, { root: scroller, rootMargin: '400% 0px', threshold: 0 });
    imgs.forEach(function(img){ imgNearObserver.observe(img); imgFarObserver.observe(img); });
  }

  function setupSceneBehavior(){
    var allScenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
    if(ioInstance) ioInstance.disconnect();
    ioInstance = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.55){
          entry.target.classList.add('in-view');
          var slug = entry.target.getAttribute('data-slug');
          if(slug){
            var match = photos.find(function(p){ return p._slug === slug; });
            if(match) updateHeadForPhoto(match);
          } else {
            resetHeadToDefault();
          }
        } else if (entry.intersectionRatio < 0.15) {
          entry.target.classList.remove('in-view');
        }
      });
    }, { root: scroller, threshold:[0, .15, .55, .8] });
    allScenes.forEach(function(s){ ioInstance.observe(s); });
    requestAnimationFrame(function(){ allScenes[0] && allScenes[0].classList.add('in-view'); });

    setupImageLazyLoading();
    window._allScenes = allScenes;
    updateScrollNavState();
  }

  // Desktop/trackpad "TikTok-style" scene advance, shared by wheel input
  // (see the listener below) and the up/down .scroll-nav buttons. Touch is
  // left to native momentum + CSS scroll-snap:mandatory (tuned above), which
  // already guarantees landing on a full scene on phones. Wheel input and
  // button clicks don't have that native momentum-to-snap behavior, so this
  // buffers a short burst of wheel deltas (or a single button press) into
  // one deliberate move that always lands exactly on a scene.
  var sceneNav = (function setupSceneNav(){
    var isAnimating = false;
    var scrollAnimFrame = null;
    var wheelBuffer = 0;
    var wheelTimer = null;
    var ADVANCE_DURATION = 420; // ms — matches the site's --dur-1 easing feel
    var BUFFER_WINDOW = 70;     // ms — how long a wheel "burst" is allowed to accumulate

    function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); } // close match to var(--ease)

    function cancelAnim(){
      if(scrollAnimFrame){ cancelAnimationFrame(scrollAnimFrame); scrollAnimFrame = null; }
      isAnimating = false;
    }

    function animateScrollTo(targetTop){
      cancelAnim();
      var startTop = scroller.scrollTop;
      var distance = targetTop - startTop;
      if(Math.abs(distance) < 1) return;
      isAnimating = true;
      // scroll-snap-type:mandatory (see .scroller) fights a manually-driven
      // scrollTop animation on some browsers — once our per-frame writes
      // stop, the browser re-asserts its own snap and can land one scene
      // further than intended, which reads as the advance "skipping" a
      // photo. Suspending snap for the duration of the animation and
      // restoring it the instant we land exactly on the target scene
      // avoids that fight entirely.
      scroller.style.scrollSnapType = 'none';
      var startTime = null;
      function step(ts){
        if(startTime === null) startTime = ts;
        var t = Math.min(1, (ts - startTime) / ADVANCE_DURATION);
        scroller.scrollTop = startTop + distance * easeOutExpo(t);
        if(t < 1){ scrollAnimFrame = requestAnimationFrame(step); }
        else { isAnimating = false; scrollAnimFrame = null; scroller.style.scrollSnapType = ''; }
      }
      scrollAnimFrame = requestAnimationFrame(step);
    }

    // The full slide list for navigation purposes: the hero counts as
    // slide 0, followed by every .scene (photos + finale). This is
    // deliberately separate from window._allScenes (which setupSceneBehavior
    // uses for its own IntersectionObserver/lazy-load bookkeeping and stays
    // photos-only) — navSlides() is only ever used to answer "where am I,
    // and where's next" for wheel/keyboard/buttons/enter-gallery, so the
    // hero can be a first-class stop in that sequence without having to
    // pretend it's a photo scene anywhere else in the code.
    function navSlides(){
      return [heroEl].concat(window._allScenes || []);
    }

    function currentSceneIndex(){
      var slides = navSlides();
      var best = 0, bestDist = Infinity;
      slides.forEach(function(s, i){
        var d = Math.abs(s.offsetTop - scroller.scrollTop);
        if(d < bestDist){ bestDist = d; best = i; }
      });
      return best;
    }

    function goToSceneIndex(i){
      var slides = navSlides();
      if(!slides.length) return;
      i = Math.max(0, Math.min(slides.length - 1, i));
      animateScrollTo(slides[i].offsetTop);
    }

    scroller.addEventListener('wheel', function(e){
      if(window.innerWidth < 768) return; // touch devices use native scroll+snap instead
      e.preventDefault();
      if(isAnimating) return; // ignore extra input while settling — avoids overshoot/jitter
      wheelBuffer += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function(){
        var dir = wheelBuffer > 0 ? 1 : -1;
        var mag = Math.abs(wheelBuffer);
        var advance = 1;
        if(mag > 260) advance = 2;
        if(mag > 520) advance = 3;
        goToSceneIndex(currentSceneIndex() + dir * advance);
        wheelBuffer = 0;
      }, BUFFER_WINDOW);
    }, { passive:false });

    return { goToSceneIndex: goToSceneIndex, currentSceneIndex: currentSceneIndex, navSlides: navSlides };
  })();

  // Keeps the up/down buttons in sync with scroll position: disabled at
  // the very first/last slide (hero counts as the first) rather than just
  // doing nothing on click, so it's visually obvious there's nowhere
  // further to go.
  function updateScrollNavState(){
    var slides = sceneNav.navSlides();
    if(!slides.length){ scrollUpBtn.disabled = true; scrollDownBtn.disabled = true; return; }
    var i = sceneNav.currentSceneIndex();
    scrollUpBtn.disabled = (i <= 0);
    scrollDownBtn.disabled = (i >= slides.length - 1);
  }
  scrollUpBtn.addEventListener('click', function(){ sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() - 1); });
  scrollDownBtn.addEventListener('click', function(){ sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() + 1); });

  document.getElementById('enterBtn').addEventListener('click', function(){
    sceneNav.goToSceneIndex(1);
  });

  var scrollNavTicking = false;
  function updateOnScroll(){
    scrollNavTicking = false;
    updateScrollNavState();
    if(sceneNav.currentSceneIndex() > 0){
      mark.classList.add('show');
      scrollNav.classList.add('show');
      document.getElementById('catNav').classList.add('show');

  }
  scroller.addEventListener('scroll', function(){
    if(!scrollNavTicking){ scrollNavTicking = true; requestAnimationFrame(updateOnScroll); }
  }, { passive:true });
  window.addEventListener('resize', updateOnScroll);

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  scroller.addEventListener('click', function(e){
    var likeBtn = e.target.closest('.like-btn');
    if(likeBtn){
      var id = likeBtn.getAttribute('data-id');
      var photo = photos.find(function(p){ return String(p.id) === String(id); });
      if(!photo) return;
      var nowLiked = !liked[id];
      liked[id] = nowLiked;
      setLiked(liked);
      photo.likes = Math.max(0, (photo.likes || 0) + (nowLiked ? 1 : -1));
      likeBtn.classList.toggle('liked', nowLiked);
      likeBtn.setAttribute('aria-pressed', String(nowLiked));
      likeBtn.querySelector('svg').outerHTML = svgHeart(nowLiked);

  // Bakes the EXIF rotation into the actual pixels so the photo displays
  // upright everywhere, caps the resolution per orientation, and re-encodes
  // to WebP. Phone cameras produce huge originals (12+ MP / 20-50MB); this
  // is what keeps Storage costs and load times sane, and is also what was
  // crashing memory-constrained mobile browsers (e.g. "A problem repeatedly
  // occurred" in Safari/Telegram's in-app browser) when the old code loaded
  // full-size gallery photos. Never upscales — if the source is already
  // smaller than the target, it's re-encoded at its native size.
  // Instagram-style ratio label, purely derived from stored width/height —
  // no separate DB field needed since it's just formatting of data we
  // already capture at upload time.
  var KNOWN_RATIOS = [
    { name:'1:1',  value:1 },
    { name:'4:5',  value:4/5 },
    { name:'2:3',  value:2/3 },
    { name:'9:16', value:9/16 },
    { name:'16:9', value:16/9 },
    { name:'3:2',  value:3/2 },
    { name:'4:3',  value:4/3 },
    { name:'3:4',  value:3/4 }
  ];
  function getAspectRatioName(width, height){
    if(!width || !height) return null;
    var ratio = width / height;
    var best = null, bestDiff = Infinity;
    KNOWN_RATIOS.forEach(function(r){
      var diff = Math.abs(ratio - r.value);
      if(diff < bestDiff){ bestDiff = diff; best = r; }
    });
    if(best && bestDiff < 0.025) return best.name;
    // Not a close match to a common ratio — show the decimal ratio rather
    // than a raw pixel-reduced fraction (which can be an ugly large pair
    // once resize/rounding nudges it off an exact ratio).
    return ratio.toFixed(2) + ':1';
  }

  var MAX_PORTRAIT_H = 1800, MAX_PORTRAIT_W = 1200;
  var MAX_LANDSCAPE_W = 2000;
  var WEBP_QUALITY = 0.85;

  var _webpSupported = null;
  function supportsWebP(){
    if(_webpSupported !== null) return _webpSupported;
    try{
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      _webpSupported = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
    } catch(e){ _webpSupported = false; }
    return _webpSupported;
  }

  async function processImageForUpload(file){
    if(!file.type || file.type.indexOf('image/') !== 0 || file.type === 'image/svg+xml') return { file: file, width: null, height: null };
    try{
      var bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      var w = bitmap.width, h = bitmap.height;
      var isPortrait = h >= w;
      var scale = isPortrait
        ? Math.min(1, MAX_PORTRAIT_W / w, MAX_PORTRAIT_H / h)
        : Math.min(1, MAX_LANDSCAPE_W / w);
      var outW = Math.round(w * scale), outH = Math.round(h * scale);

      var canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, outW, outH);
      bitmap.close && bitmap.close();

      var useWebp = supportsWebP();
      var mime = useWebp ? 'image/webp' : 'image/jpeg';
      var extension = useWebp ? '.webp' : '.jpg';
      var blob = await new Promise(function(resolve){
        canvas.toBlob(function(b){ resolve(b); }, mime, WEBP_QUALITY);
      });
      if(!blob) return { file: file, width: w, height: h };

      var baseName = file.name.replace(/\.\w+$/, '') || 'photo';
      var processed = new File([blob], baseName + extension, { type: mime });
      return { file: processed, width: outW, height: outH };
    } catch(e){
      return { file: file, width: null, height: null }; // browser doesn't support it — fall back to the original file
    }
  }

  async function uploadFile(file){
    var processed = await processImageForUpload(file);
    file = processed.file;
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    var path = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + (ext || 'jpg');
    var uploadRes = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if(uploadRes.error) throw new Error(uploadRes.error.message);
    var urlRes = sb.storage.from(BUCKET).getPublicUrl(path);
    return { url: urlRes.data.publicUrl, width: processed.width, height: processed.height };
  }

      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('photoUploading');

      try{
        var res = await uploadFile(file);
        editingPhoto.image_url = res.url;
        editingPhoto.image_width = res.width;
        editingPhoto.image_height = res.height;
        var preview = document.getElementById('photoPreview');
        preview.src = res.url;

        if(ratioName){ ratioBadge.textContent = ratioName; ratioBadge.style.display = 'inline-block'; }
        else { ratioBadge.style.display = 'none'; }
      } catch(err){
        showPhotoFormError(err.message);
      } finally {
        uploadingEl.style.display = 'none';
      }
    });
    document.getElementById('photoSaveBtn').addEventListener('click', async function(){
      var selectedCatIds = Array.prototype.slice.call(document.querySelectorAll('.cat-chip-input:checked')).map(function(el){ return el.value; });
      var payload = {
        title: document.getElementById('f-title').value || 'Untitled',
        story: document.getElementById('f-story').value,
        category: document.getElementById('f-category').value,
        location: document.getElementById('f-location').value,
        date: document.getElementById('f-date').value || null,
        alt_text: document.getElementById('f-alt').value,
        published: document.getElementById('f-published').checked,
        featured: document.getElementById('f-featured').checked,
        is_favorite: document.getElementById('f-favorite').checked,
        image_url: editingPhoto.image_url,
        image_width: editingPhoto.image_width || null,
        image_height: editingPhoto.image_height || null,
        watermark_override: document.getElementById('f-wm-override').checked,
        watermark_position: document.getElementById('f-wm-override').checked ? document.getElementById('f-wm-position').value : null,
        watermark_x_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-x').value,10)||0) : null,
        watermark_y_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-y').value,10)||0) : null
      };
      if(!payload.image_url){ showPhotoFormError('Please upload a photo first.'); return; }
      var saveBtn = document.getElementById('photoSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      var result;
      if(editingPhoto.id){
        result = await sb.from('photos').update(payload).eq('id', editingPhoto.id).select().single();
      } else {
        var maxOrder = adminPhotos.reduce(function(m,p){ return Math.max(m, p.display_order||0); }, -1);
        payload.display_order = maxOrder + 1;
        result = await sb.from('photos').insert(payload).select().single();
      }
      if(result.error){
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
        showPhotoFormError(result.error.message);
        return;
      }
      var savedId = (result.data && result.data.id) || editingPhoto.id;
      // Sync the many-to-many category assignment: clear, then re-insert
      // whatever's currently checked. Never touches the categories or
      // photos themselves.
      try{
        await sb.from('photo_categories').delete().eq('photo_id', savedId);
        if(selectedCatIds.length){
          await sb.from('photo_categories').insert(selectedCatIds.map(function(cid){ return { photo_id: savedId, category_id: cid }; }));
        }
      } catch(e){ /* photo_categories table not created yet — see SQL note above */ }
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      editingPhoto = null;
      renderPhotosAdmin();
    });
  }

      html += categoryFormHtml(editingCategory);
    } else {
      html += '<div class="admin-toolbar"><button class="admin-btn" id="addCategoryBtn">+ New Category</button></div>';
    }

    if(!editingCategory){
      html += '<div class="admin-list">';
      html += ''+
        '<div class="admin-row cat-row">'+
          '<div class="col-title"><strong>★ Favorite</strong><span class="sub">Set per-photo, not a category row</span></div>'+
          '<span class="status on">SYSTEM</span>'+
          '<div class="admin-row-actions"></div>'+
        '</div>';
      adminCategories.forEach(function(c, i){
        var count = categoryPhotoCount(c.id);
        html += ''+
        '<div class="admin-row cat-row" data-id="'+c.id+'">'+
          '<div class="col-title"><strong>'+escapeHtml(c.name)+'</strong><span class="sub">'+count+(count===1?' photograph':' photographs')+'</span></div>'+
          '<span class="status '+(c.is_visible?'on':'off')+'">'+(c.is_visible?'ACTIVE':'HIDDEN')+'</span>'+
          '<div class="admin-row-actions">'+
            '<button data-act="up" '+(i===0?'disabled':'')+'>↑</button>'+
            '<button data-act="down" '+(i===adminCategories.length-1?'disabled':'')+'>↓</button>'+
            '<button data-act="toggle">'+(c.is_visible?'Hide':'Show')+'</button>'+
            '<button data-act="edit">Rename</button>'+
            '<button data-act="delete">Delete</button>'+
          '</div>'+
        '</div>';
      });
      html += '</div>';
      if(adminCategories.length === 0) html += '<p class="admin-empty">No categories yet — create your first one above.</p>';
    }

    adminScroll.innerHTML = html;

    var addBtn = document.getElementById('addCategoryBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ editingCategory = blankCategory(); drawCategoriesAdmin(); });
    if(editingCategory) wireCategoryForm();

    adminScroll.querySelectorAll('.admin-row[data-id]').forEach(function(row){
      var id = row.getAttribute('data-id');
      var cat = adminCategories.find(function(c){ return String(c.id) === id; });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var act = btn.getAttribute('data-act');
          if(act === 'edit'){ editingCategory = Object.assign({}, cat); drawCategoriesAdmin(); return; }
          if(act === 'toggle'){
            await sb.from('categories').update({ is_visible: !cat.is_visible }).eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'delete'){
            var count = categoryPhotoCount(cat.id);
            var msg = count > 0
              ? ('Delete "'+cat.name+'"? '+count+' photograph(s) will be removed from this category — the photographs themselves are never deleted.')
              : ('Delete "'+cat.name+'"?');
            if(!confirm(msg)) return;
            await sb.from('photo_categories').delete().eq('category_id', id);
            await sb.from('categories').delete().eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'up' || act === 'down'){
            var idx = adminCategories.findIndex(function(c){ return String(c.id) === id; });
            var swapIdx = act === 'up' ? idx - 1 : idx + 1;
            if(swapIdx < 0 || swapIdx >= adminCategories.length) return;
            var other = adminCategories[swapIdx];
            await Promise.all([
              sb.from('categories').update({ sort_order: other.sort_order }).eq('id', cat.id),
              sb.from('categories').update({ sort_order: cat.sort_order }).eq('id', other.id)
            ]);
            renderCategoriesAdmin();
          }
        });
      });
    });
  }

  function categoryFormHtml(c){
    var isNew = !c.id;
    return ''+
    '<div class="admin-form" id="categoryForm">'+
      '<h3>'+(isNew?'New Category':'Rename Category')+'</h3>'+
      '<div class="admin-field"><label>Category name</label><input type="text" id="c-name" value="'+escapeHtml(c.name)+'"></div>'+
      '<div class="admin-field row"><input type="checkbox" id="c-visible" '+(c.is_visible!==false?'checked':'')+'><label for="c-visible">Show in navigation</label></div>'+
      '<p class="admin-error" id="categoryFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<button class="admin-btn secondary" id="categoryCancelBtn">Cancel</button>'+
        '<button class="admin-btn" id="categorySaveBtn">'+(isNew?'Create Category':'Save')+'</button>'+
      '</div>'+
    '</div>';
  }

  function wireCategoryForm(){
    document.getElementById('categoryCancelBtn').addEventListener('click', function(){ editingCategory = null; drawCategoriesAdmin(); });
    document.getElementById('categorySaveBtn').addEventListener('click', async function(){
      var name = document.getElementById('c-name').value.trim();
      if(!name){ showCategoryFormError('Please enter a category name.'); return; }
      var payload = { name: name, slug: slugify(name), is_visible: document.getElementById('c-visible').checked };
      var btn = document.getElementById('categorySaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result;
      if(editingCategory.id){
        result = await sb.from('categories').update(payload).eq('id', editingCategory.id);
      } else {
        var maxOrder = adminCategories.reduce(function(m,c){ return Math.max(m, c.sort_order||0); }, -1);
        payload.sort_order = maxOrder + 1;
        result = await sb.from('categories').insert(payload);
      }
      btn.disabled = false; btn.textContent = editingCategory.id ? 'Save' : 'Create Category';
      if(result.error){ showCategoryFormError(result.error.message); return; }
      editingCategory = null;
      renderCategoriesAdmin();
    });
  }

  function showCategoryFormError(msg){
    var el = document.getElementById('categoryFormError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* ---------- Watermark tab ---------- */
  async function renderWatermarkAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    await loadAdminPhotos(); // for the live-preview thumbnail
    var loaded = Object.assign({}, DEFAULT_WATERMARK);
    try{
      var res = await sb.from('site_settings').select('*').eq('id', 1).single();
      if(res && res.data) loaded = Object.assign({}, DEFAULT_WATERMARK, res.data);
    } catch(e){ /* table not created yet — see SQL note near the top of this file */ }
    drawWatermarkAdmin(loaded);
  }

  function drawWatermarkAdmin(saved){
    var previewImg = (adminPhotos[0] && adminPhotos[0].image_url) || 'https://picsum.photos/seed/wm-preview/600/800';
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>Watermark Settings</h3>'+
      '<div class="admin-field row"><input type="checkbox" id="wm-enabled" '+(saved.watermark_enabled?'checked':'')+'><label for="wm-enabled">Enable Watermark</label></div>'+
      '<div class="admin-field"><label>Text</label><input type="text" id="wm-text" value="'+escapeHtml(saved.watermark_text)+'"></div>'+
      '<div class="admin-field"><label>Opacity: <span id="wm-opacity-val">'+Math.round(saved.watermark_opacity*100)+'%</span></label><input type="range" min="5" max="100" id="wm-opacity" value="'+Math.round(saved.watermark_opacity*100)+'"></div>'+
      '<div class="admin-field"><label>Position</label><select id="wm-position">'+wmPositionOptionsHtml(saved.watermark_position)+'</select></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>X Offset: <span id="wm-x-val">'+saved.watermark_x_offset+'px</span></label><input type="range" min="0" max="120" id="wm-x" value="'+saved.watermark_x_offset+'"></div>'+
        '<div class="admin-field"><label>Y Offset: <span id="wm-y-val">'+saved.watermark_y_offset+'px</span></label><input type="range" min="0" max="120" id="wm-y" value="'+saved.watermark_y_offset+'"></div>'+
      '</div>'+
      '<div class="admin-field"><label>Preview</label>'+
        '<div style="position:relative; width:180px; aspect-ratio:2/3; overflow:hidden; background:#1a1a1a;">'+
          '<img src="'+escapeHtml(previewImg)+'" style="width:100%; height:100%; object-fit:cover; display:block;">'+
          '<div class="wm-frame" id="wmPreviewLayer" style="position:absolute; inset:0;"></div>'+
        '</div>'+
      '</div>'+
      '<p class="admin-error" id="wmFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="wmSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn secondary" id="wmResetBtn">Reset</button>'+
        '<button class="admin-btn" id="wmSaveBtn">Save</button>'+
      '</div>'+
    '</div>';

    function readForm(){
      return {
        watermark_enabled: document.getElementById('wm-enabled').checked,
        watermark_text: document.getElementById('wm-text').value || 'Islem Zrelli',
        watermark_opacity: (parseInt(document.getElementById('wm-opacity').value,10)||35)/100,
        watermark_position: document.getElementById('wm-position').value,
        watermark_x_offset: parseInt(document.getElementById('wm-x').value,10)||0,
        watermark_y_offset: parseInt(document.getElementById('wm-y').value,10)||0
      };
    }

    function updatePreview(){
      var v = readForm();
      document.getElementById('wm-opacity-val').textContent = Math.round(v.watermark_opacity*100)+'%';
      document.getElementById('wm-x-val').textContent = v.watermark_x_offset+'px';
      document.getElementById('wm-y-val').textContent = v.watermark_y_offset+'px';
      var layer = document.getElementById('wmPreviewLayer');
      layer.className = 'wm-frame ' + wmClassFor(v.watermark_position);
      layer.style.setProperty('--wm-opacity', v.watermark_enabled ? v.watermark_opacity : 0);
      layer.style.setProperty('--wm-x', v.watermark_x_offset+'px');
      layer.style.setProperty('--wm-y', v.watermark_y_offset+'px');
      layer.setAttribute('data-wm-text', v.watermark_text);
    }
    ['wm-enabled','wm-text','wm-opacity','wm-position','wm-x','wm-y'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
    });
    updatePreview();

    document.getElementById('wmResetBtn').addEventListener('click', function(){
      drawWatermarkAdmin(saved); // discard unsaved edits, back to last-saved values
    });

    document.getElementById('wmSaveBtn').addEventListener('click', async function(){
      var payload = readForm();
      payload.id = 1;
      payload.updated_at = new Date().toISOString();
      var btn = document.getElementById('wmSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('site_settings').upsert(payload);
      btn.disabled = false; btn.textContent = 'Save';
      var errEl = document.getElementById('wmFormError');
      var savedEl = document.getElementById('wmSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
      settings = Object.assign({}, DEFAULT_WATERMARK, payload);
      saved = Object.assign({}, payload);
      renderScenes(); // reflect the change on the gallery straight away
    });
  }

  /* ---------- About tab ---------- */
  async function renderAboutAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    var res = await sb.from('about').select('*').eq('id', 1).single();
    var a = res.data || {};
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>About</h3>'+
      '<div class="admin-field"><label>Profile Photograph</label>'+
        (a.profile_image_url ? '<img class="admin-image-preview" id="aboutPreview" src="'+escapeHtml(a.profile_image_url)+'">' : '<img class="admin-image-preview" id="aboutPreview" style="display:none;">')+
        '<input type="file" accept="image/*" id="aboutFile">'+
        '<span class="admin-uploading" id="aboutUploading" style="display:none;">Uploading…</span>'+
      '</div>'+
      '<div class="admin-field"><label>Name</label><input type="text" id="a-name" value="'+escapeHtml(a.name||'')+'"></div>'+
      '<div class="admin-field"><label>Short Biography</label><textarea id="a-short">'+escapeHtml(a.short_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Longer Biography</label><textarea style="min-height:140px;" id="a-long">'+escapeHtml(a.long_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Areas of Work</label><textarea id="a-areas">'+escapeHtml(a.areas_of_work||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Achievements</label><textarea id="a-achievements">'+escapeHtml(a.achievements||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Festivals / Exhibitions</label><textarea id="a-festivals">'+escapeHtml(a.festivals||'')+'</textarea></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Instagram URL</label><input type="url" id="a-instagram" value="'+escapeHtml(a.instagram_url||'')+'"></div>'+
        '<div class="admin-field"><label>Vimeo URL</label><input type="url" id="a-vimeo" value="'+escapeHtml(a.vimeo_url||'')+'"></div>'+
      '</div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Journal URL</label><input type="url" id="a-journal" value="'+escapeHtml(a.journal_url||'')+'"></div>'+
        '<div class="admin-field"><label>Contact Email</label><input type="email" id="a-email" value="'+escapeHtml(a.contact_email||'')+'"></div>'+
      '</div>'+
      '<p class="admin-error" id="aboutFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="aboutSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn" id="aboutSaveBtn">Save Changes</button>'+
      '</div>'+
    '</div>';

    var currentImageUrl = a.profile_image_url || '';

    document.getElementById('aboutFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('aboutUploading');
      uploadingEl.style.display = 'inline';
      try{
        var res = await uploadFile(file);
        currentImageUrl = res.url;
        var preview = document.getElementById('aboutPreview');
        preview.src = currentImageUrl;
        preview.style.display = 'block';
      } catch(err){
        var el = document.getElementById('aboutFormError');
        el.textContent = err.message; el.style.display = 'block';
      } finally {
        uploadingEl.style.display = 'none';
      }
    });

    document.getElementById('aboutSaveBtn').addEventListener('click', async function(){
      var payload = {
        profile_image_url: currentImageUrl,
        name: document.getElementById('a-name').value,
        short_bio: document.getElementById('a-short').value,
        long_bio: document.getElementById('a-long').value,
        areas_of_work: document.getElementById('a-areas').value,
        achievements: document.getElementById('a-achievements').value,
        festivals: document.getElementById('a-festivals').value,
        instagram_url: document.getElementById('a-instagram').value,
        vimeo_url: document.getElementById('a-vimeo').value,
        journal_url: document.getElementById('a-journal').value,
        contact_email: document.getElementById('a-email').value,
        updated_at: new Date().toISOString()
      };
      var btn = document.getElementById('aboutSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('about').update(payload).eq('id', 1);
      btn.disabled = false; btn.textContent = 'Save Changes';
      var errEl = document.getElementById('aboutFormError');
      var savedEl = document.getElementById('aboutSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
    });
  }

  /* ================= INIT ================= */
  loadPublicData();

})();
</script>
</body>
