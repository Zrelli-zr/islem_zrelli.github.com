<style>
  :root{
    --ink:#050505;
    --white:#f6f4ef;
    --dim:rgba(246,244,239,0.58);
    --dim-2:rgba(246,244,239,0.36);
    --line:rgba(246,244,239,0.16);
    --line-soft:rgba(246,244,239,0.09);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --dur-1:560ms;
    --ease:cubic-bezier(.19,1,.22,1);
    --font-display:'Newsreader', serif;
    --font-body:'Inter', sans-serif;
    --size-title: clamp(2.5rem, 5vw, 6rem);
    --size-desc:  clamp(0.95rem, 1.2vw, 1.25rem);
    --size-nav:   0.88rem;
    --size-meta:  0.75rem;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  ::selection{ background:var(--white); color:var(--ink); }
  a{ color:inherit; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .meta{ font-family:var(--font-body); font-weight:500; letter-spacing:.18em; text-transform:uppercase; font-size:var(--size-meta); color:var(--dim-2); }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  .vignette{ position:fixed; inset:0; z-index:55; pointer-events:none; background:radial-gradient(130% 100% at 50% 100%, transparent 40%, rgba(0,0,0,.5) 100%); }

  .rail{ position:fixed; top:0; bottom:0; right:calc(16px + var(--safe-r)); width:20px; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 700ms var(--ease); }
  .rail.show{ opacity:1; }
  .rail .track{ position:relative; width:1px; height:min(42vh, 320px); background:var(--line-soft); }
  .rail .tick{ position:absolute; right:-3px; width:7px; height:1px; background:var(--line); }
  .rail .needle{ position:absolute; left:-4px; right:-4px; height:1px; background:var(--white); transform:translateY(0); transition:transform 120ms linear; }
  .rail .needle::before{ content:""; position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; background:var(--white); border-radius:50%; }
  .rail .frame-label{ position:absolute; top:calc(50% + min(21vh, 160px) + 16px); font-family:var(--font-body); font-size:.7rem; letter-spacing:.18em; color:var(--dim-2); white-space:nowrap; writing-mode:vertical-rl; text-transform:uppercase; }

  /* .mark doubles as the hidden admin entry point: click it 10x within 2s.
     pointer-events stays "auto" (not "none") so it's clickable even while
     invisible at opacity 0 — the visual fade-in behavior is unchanged. */
  .mark{ position:fixed; top:calc(22px + var(--safe-t)); left:calc(22px + var(--safe-l)); z-index:50; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:15px; letter-spacing:.02em; opacity:0; transition:opacity 700ms var(--ease); pointer-events:auto; padding:10px 14px; margin:-10px -14px; }
  .mark.show{ opacity:1; }

  .hero{ height:100dvh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(40px + var(--safe-b)); background:var(--ink); }
  .hero-inner{ position:relative; z-index:2; max-width:820px; }
  .hero .meta{ display:block; margin-bottom:28px; color:var(--dim); }
  .hero h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(46px, 12vw, 132px); line-height:.94; margin:0 0 26px; letter-spacing:.02em; text-transform:uppercase; }
  .hero .role{ font-family:var(--font-body); font-weight:300; font-size:var(--size-nav); letter-spacing:.06em; color:var(--dim); margin:0 0 64px; }
  .hero .role .dot{ margin:0 14px; color:var(--dim-2); }
  .enter{ display:inline-flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.16em; text-transform:uppercase; color:var(--white); padding:6px; border-bottom:1px solid transparent; transition:border-color 300ms var(--ease); }
  .enter:hover{ border-color:var(--line); }
  .enter .arrow-line{ width:1px; height:34px; background:var(--line); position:relative; overflow:hidden; }
  .enter .arrow-line::after{ content:""; position:absolute; left:0; top:-100%; width:100%; height:100%; background:var(--white); animation:drip 2.4s var(--ease) infinite; }
  @keyframes drip{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }
  .hero-foot{ position:absolute; bottom:calc(24px + var(--safe-b)); left:0; right:0; display:flex; justify-content:center; gap:20px; z-index:2; }
  .hero-foot span{ color:var(--dim-2); }
  .hero-foot .rule{ width:14px; height:1px; align-self:center; background:var(--line); }

  .scroller{ height:100dvh; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
  .scene{ position:relative; height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; display:flex; align-items:flex-end; }
  .scene .frame-img{ position:absolute; inset:0; overflow:hidden; background:#111; }
  .scene .frame-img img{ width:100%; height:100%; object-fit:cover; object-position:center; transform:scale(1.12); filter:blur(14px) grayscale(.08) brightness(.92); transition:transform 1700ms var(--ease), filter 1500ms var(--ease); }
  .scene.in-view .frame-img img{ transform:scale(1.0); filter:blur(0) grayscale(0) brightness(1); }
  .scene .scrim{ position:absolute; inset:0; background:linear-gradient(to top, rgba(2,2,2,.94) 0%, rgba(2,2,2,.62) 26%, rgba(2,2,2,0) 54%), linear-gradient(to bottom, rgba(2,2,2,.42) 0%, rgba(2,2,2,0) 20%); }
  .scene-content{ position:relative; z-index:3; width:100%; padding:0 20px calc(30px + var(--safe-b)) 20px; display:flex; flex-direction:column; gap:16px; max-width:820px; }
  .scene .tag{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:500; opacity:0; transform:translateY(10px); transition:opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
  .scene h2{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:var(--size-title); line-height:1.05; margin:0; letter-spacing:-.005em; opacity:0; transform:translateY(18px); transition:opacity var(--dur-1) var(--ease) 70ms, transform var(--dur-1) var(--ease) 70ms; }
  .scene p.caption{ font-family:var(--font-body); font-weight:300; font-size:var(--size-desc); line-height:1.65; color:var(--dim); margin:0; max-width:38ch; opacity:0; transform:translateY(18px); transition:opacity var(--dur-1) var(--ease) 160ms, transform var(--dur-1) var(--ease) 160ms; }
  .scene.in-view .tag, .scene.in-view h2, .scene.in-view p.caption{ opacity:1; transform:translateY(0); }
  .scene-rule{ height:1px; background:var(--line-soft); margin-top:8px; transform:scaleX(0); transform-origin:left; transition:transform 900ms var(--ease) 260ms; }
  .scene.in-view .scene-rule{ transform:scaleX(1); }
  .scene-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; opacity:0; transform:translateY(10px); transition:opacity var(--dur-1) var(--ease) 320ms, transform var(--dur-1) var(--ease) 320ms; }
  .scene.in-view .scene-actions{ opacity:1; transform:translateY(0); }
  .actions-left{ display:flex; align-items:center; gap:18px; }
  .action-btn{ display:flex; align-items:center; gap:9px; padding:12px 2px; min-height:44px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.01em; color:var(--white); }
  .action-btn svg{ width:16px; height:16px; flex-shrink:0; stroke:currentColor; }
  .action-divider{ width:1px; height:14px; background:var(--line); }
  .like-count{ font-variant-numeric:tabular-nums; color:var(--dim); }
  .like-btn.liked .like-count{ color:var(--white); }
  .frame-counter{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.06em; font-variant-numeric:tabular-nums; color:var(--dim-2); }
  .frame-counter b{ color:var(--white); font-weight:500; }
  .scene.finale{ align-items:center; justify-content:center; text-align:center; }
  .finale .frame-img img{ filter:blur(14px) grayscale(.35) brightness(.7); }
  .finale.in-view .frame-img img{ filter:blur(0) grayscale(.28) brightness(.78); }
  .finale .scrim{ background:linear-gradient(rgba(2,2,2,.72), rgba(2,2,2,.9)); }
  .finale .scene-content{ align-items:center; max-width:640px; padding-bottom:calc(20px + var(--safe-b)); gap:22px; }
  .finale h2{ font-style:normal; font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .finale .social{ display:flex; gap:0; flex-wrap:wrap; justify-content:center; }
  .finale .social a{ font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; padding:14px 18px; border-bottom:1px solid var(--line); transition:border-color 300ms var(--ease), color 300ms var(--ease); }
  .finale .social a:hover{ border-color:var(--white); }
  .finale .signoff{ font-family:var(--font-display); font-style:italic; font-size:.9rem; color:var(--dim-2); margin:0; }
  .toast{ position:fixed; left:50%; bottom:calc(30px + var(--safe-b)); transform:translate(-50%, 16px); background:var(--white); color:var(--ink); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.02em; padding:13px 20px; z-index:80; opacity:0; transition:opacity 300ms var(--ease), transform 300ms var(--ease); pointer-events:none; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .empty-state{ height:100dvh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.04em; }

  @media (min-width: 860px){ .scene-content{ padding:0 72px calc(60px + var(--safe-b)) 72px; } .rail{ right:calc(32px + var(--safe-r)); } }
  @media (prefers-reduced-motion: reduce){
    .scene .frame-img img{ transition:none !important; transform:none !important; filter:none !important; }
    .scene .tag, .scene h2, .scene p.caption, .scene-actions, .scene-rule{ transition:none !important; opacity:1 !important; transform:none !important; }
    .enter .arrow-line::after{ animation:none; }
    .grain{ display:none; }
  }

  /* ===================== ADMIN ===================== */
  .admin-overlay{ position:fixed; inset:0; z-index:200; background:rgba(5,5,5,.92); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; }
  .admin-login-box{ width:100%; max-width:320px; background:var(--ink); border:1px solid var(--line); padding:32px 28px; text-align:center; }
  .admin-login-box input{ width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--white); font-family:var(--font-body); font-size:1rem; padding:10px 4px; text-align:center; letter-spacing:.08em; outline:none; margin:18px 0 20px; }
  .admin-login-box input:focus{ border-color:var(--white); }
  .admin-login-box button.primary{ width:100%; padding:12px; border:1px solid var(--line); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; }
  .admin-login-box button.primary:hover{ border-color:var(--white); }
  .admin-login-box button.primary:disabled{ opacity:.5; cursor:default; }
  .admin-login-box .error{ color:#ff8b7a; font-size:.8rem; margin-top:14px; }
  .admin-login-box .cancel{ margin-top:16px; color:var(--dim-2); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; }

  .admin-panel{ width:100%; max-width:1000px; height:88vh; background:#0c0c0c; border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  .admin-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-top h1{ font-family:var(--font-display); font-style:italic; font-size:1.1rem; font-weight:500; margin:0; }
  .admin-top-actions{ display:flex; gap:18px; }
  .admin-top-actions button{ font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); padding:4px 0; }
  .admin-top-actions button:hover{ color:var(--white); border-color:var(--white); }
  .admin-tabs{ display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .admin-tab{ padding:14px 16px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--white); border-color:var(--white); }
  .admin-scroll{ overflow-y:auto; padding:22px 24px; flex:1; }

  .admin-toolbar{ display:flex; justify-content:flex-end; margin-bottom:16px; }
  .admin-btn{ background:var(--white); color:var(--ink); padding:9px 16px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
  .admin-btn.secondary{ background:transparent; color:var(--white); border:1px solid var(--line); }
  .admin-btn:disabled{ opacity:.5; }

  .admin-list{ display:flex; flex-direction:column; border:1px solid var(--line); }
  .admin-row{ display:grid; grid-template-columns:56px 1fr 100px 90px 210px; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line-soft); font-size:.82rem; }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row img{ width:48px; height:48px; object-fit:cover; background:#1a1a1a; }
  .admin-row .col-title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .admin-row .col-title strong{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-row .sub{ color:var(--dim-2); font-size:.7rem; }
  .status{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; }
  .status.on{ color:#8de08d; } .status.off{ color:var(--dim-2); }
  .admin-row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .admin-row-actions button{ font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); }
  .admin-row-actions button:hover{ color:var(--white); }

  .admin-form{ border:1px solid var(--line); padding:22px; margin-bottom:18px; display:flex; flex-direction:column; gap:13px; }
  .admin-form h3{ margin:0 0 2px; font-family:var(--font-display); font-style:italic; font-weight:500; }
  .admin-field{ display:flex; flex-direction:column; gap:6px; }
  .admin-field label{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .admin-field input[type="text"], .admin-field input[type="date"], .admin-field input[type="email"], .admin-field input[type="url"], .admin-field textarea{ background:#151515; border:1px solid var(--line); color:var(--white); padding:9px 11px; font-family:var(--font-body); font-size:.88rem; }
  .admin-field textarea{ resize:vertical; min-height:70px; }
  .admin-field.row{ flex-direction:row; align-items:center; gap:9px; }
  .admin-field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .admin-form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .admin-image-preview{ width:160px; aspect-ratio:2/3; object-fit:cover; background:#1a1a1a; }
  .admin-uploading{ font-size:.72rem; color:var(--dim); }
  .admin-empty{ padding:34px; text-align:center; color:var(--dim-2); font-size:.85rem; }
  .admin-error{ color:#ff8b7a; font-size:.8rem; }
  .admin-saved{ color:#8de08d; font-size:.78rem; align-self:center; }

  @media (max-width: 720px){
    .admin-row{ grid-template-columns:44px 1fr; grid-template-areas:"thumb title" "actions actions"; }
    .admin-row img{ grid-area:thumb; width:40px; height:40px; }
    .admin-row .col-title{ grid-area:title; }
    .admin-row-actions{ grid-area:actions; }
    .admin-row > *:not(img):not(.col-title):not(.admin-row-actions){ display:none; }
    .admin-field-grid{ grid-template-columns:1fr; }
    .admin-panel{ height:94vh; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="mark" id="mark">I. Z.</div>

<nav class="rail" id="rail" aria-hidden="true">
  <div class="track">
    <div class="ticks" id="ticks"></div>
    <div class="needle" id="needle"></div>
  </div>
  <div class="frame-label">Scroll</div>
</nav>

<header class="hero" id="hero">
  <div class="hero-inner">
    <span class="meta">Tunisia — Visual Stories</span>
    <h1>Islem Zrelli</h1>
    <p class="role">Photographer<span class="dot">·</span>Filmmaker<span class="dot">·</span>Environmental Activist</p>
    <button class="enter" id="enterBtn" aria-label="Enter gallery">
      <span class="arrow-line"></span>
      Enter Gallery
    </button>
  </div>
  <div class="hero-foot meta">
    <span id="storyCount">— Stories</span>
    <span class="rule"></span>
    <span>Coasts, Deserts &amp; What We're Losing</span>
  </div>
</header>

<main class="scroller" id="scroller"></main>

<div class="toast" id="toast"></div>

<!-- ============ ADMIN PANEL ============ -->
<div class="admin-overlay" id="adminOverlay" style="display:none;">
  <div class="admin-panel">
    <div class="admin-top">
      <h1>Islem Zrelli — Admin</h1>
      <div class="admin-top-actions">
        <button id="exportSitemapBtn">Export sitemap.xml</button>
        <button id="adminLogoutBtn">Log Out</button>
        <button id="adminCloseBtn">Close</button>
      </div>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="photos">Photos</button>
      <button class="admin-tab" data-tab="about">About</button>
    </div>
    <div class="admin-scroll" id="adminScroll"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= CONFIG — fill these in once, then you're done ================
     SUPABASE_URL / SUPABASE_ANON_KEY: Project Settings -> API in your Supabase project.

     NOTE: This build has NO password gate — the admin panel opens for anyone who
     clicks the "I. Z." mark 10x within 2s. That means your Supabase Row Level
     Security policies must allow public (anon) INSERT/UPDATE/DELETE on the
     `photos` and `about` tables and public writes to the storage bucket for the
     panel to actually work — which also means anyone who finds this gesture
     (e.g. via view-source) can edit or delete your content. If you want that
     door closed again later, reintroduce a Supabase Auth check here. */
  var SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  var SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
  /* ================================================================================ */

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var BUCKET = "media";

  function svgHeart(filled){
    return '<svg viewBox="0 0 24 24" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.4"><path d="M12 20.6s-7.6-4.6-10-9.2C.4 8 2 4.4 5.6 3.6c2.1-.5 4.2.4 5.4 2.1a1 1 0 001.6 0c1.2-1.7 3.3-2.6 5.4-2.1C21.6 4.4 23.2 8 21.6 11.4 19.2 16 12 20.6 12 20.6z"/></svg>';
  }
  var svgShare = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 12v6a1 1 0 001 1h8a1 1 0 001-1v-6M16 8l-4-4-4 4M12 4v13"/></svg>';

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ================= SEO: slugs, clean URLs, dynamic head ================= */

  function slugify(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80) || 'photo';
  }

  function ensureSlugs(list){
    var seen = {};
    list.forEach(function(p){
      var base = slugify(p.title);
      var slug = base, n = 2;
      while(seen[slug]){ slug = base + '-' + n; n++; }
      seen[slug] = true;
      p._slug = slug;
    });
  }

  function photoUrl(p){ return SITE_URL + '/work/' + p._slug + '/'; }

  function setMetaContent(selector, content){
    var el = document.querySelector(selector);
    if(el) el.setAttribute('content', content);
  }

  function updateHeadForPhoto(p){
    var title = 'Islem Zrelli — ' + p.title;
    var desc = (p.story || DEFAULT_DESC).slice(0, 160);
    var url = photoUrl(p);
    document.title = title;
    setMetaContent('meta[name="description"]', desc);
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[property="og:description"]', desc);
    setMetaContent('meta[property="og:url"]', url);
    setMetaContent('meta[property="og:type"]', 'article');
    if(p.image_url){
      setMetaContent('meta[property="og:image"]', p.image_url);
      setMetaContent('meta[name="twitter:image"]', p.image_url);
    }
    setMetaContent('meta[name="twitter:title"]', title);
    setMetaContent('meta[name="twitter:description"]', desc);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = url;
    injectPhotoLd(p, url);
    history.replaceState(null, '', '/work/' + p._slug + '/');
  }

  function resetHeadToDefault(){
    document.title = DEFAULT_TITLE;
    setMetaContent('meta[name="description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:title"]', DEFAULT_TITLE);
    setMetaContent('meta[property="og:description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:url"]', SITE_URL + '/');
    setMetaContent('meta[property="og:type"]', 'website');
    setMetaContent('meta[name="twitter:title"]', DEFAULT_TITLE);
    setMetaContent('meta[name="twitter:description"]', DEFAULT_DESC);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = SITE_URL + '/';
    removePhotoLd();
    history.replaceState(null, '', '/');
  }

  function injectPhotoLd(p, url){
    var el = document.getElementById('ldPhoto');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldPhoto';
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Photograph",
      "name": p.title,
      "description": p.story || '',
      "contentUrl": p.image_url,
      "url": url,
      "creator": { "@type": "Person", "name": "Islem Zrelli" },
      "contentLocation": p.location ? { "@type": "Place", "name": p.location } : undefined,
      "genre": p.category || undefined
    });
  }

  function removePhotoLd(){
    var el = document.getElementById('ldPhoto');
    if(el) el.remove();
  }

  function injectGalleryLd(list){
    var el = document.getElementById('ldGallery');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldGallery';
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Islem Zrelli — Photo Stories",
      "url": SITE_URL + '/',
      "image": list.map(function(p){ return p.image_url; })
    });
  }

  function slugFromPath(path){
    var m = String(path || '').replace(/\/+$/, '').match(/^\/work\/([^\/]+)$/);
    return m ? m[1] : null;
  }

  function applyInitialRoute(){
    var slug = slugFromPath(window.location.pathname);
    if(!slug) return;
    var match = photos.find(function(p){ return p._slug === slug; });
    if(!match) return;
    updateHeadForPhoto(match);
    var el = document.getElementById('scene-' + match.id);
    if(el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

    var total = photos.length;
    storyCountEl.textContent = total + (total === 1 ? ' Story' : ' Stories');

    if(total === 0){
      scroller.innerHTML = '<div class="empty-state">No photographs published yet.</div>';
      return;
    }

    var html = '';
    photos.forEach(function(s, i){
      var num = String(i+1).padStart(2,'0');
      var isLiked = !!liked[s.id];
      var count = (s.likes || 0);
      html += ''+
      '<section class="scene" id="scene-'+s.id+'" data-index="'+(i+1)+'" data-id="'+s.id+'" data-slug="'+escapeHtml(s._slug)+'" aria-label="'+escapeHtml(s.title)+'">'+
        '<div class="frame-img"><img src="'+escapeHtml(s.image_url)+'" alt="'+escapeHtml(s.alt_text || s.title || 'Photograph by Islem Zrelli')+'" loading="'+(i<2?'eager':'lazy')+'"></div>'+
        '<div class="scrim"></div>'+
        '<div class="scene-content">'+
          '<span class="tag">'+escapeHtml(s.category || s.location || '')+'</span>'+
          '<h2>'+escapeHtml(s.title)+'</h2>'+
          '<p class="caption">'+escapeHtml(s.story)+'</p>'+
          '<div class="scene-rule"></div>'+
          '<div class="scene-actions">'+
            '<div class="actions-left">'+
              '<button class="action-btn like-btn'+(isLiked?' liked':'')+'" data-id="'+s.id+'" aria-pressed="'+isLiked+'" aria-label="Like this photo">'+
                svgHeart(isLiked)+'<span class="like-count">'+count.toLocaleString()+'</span>'+
              '</button>'+
              '<span class="action-divider" aria-hidden="true"></span>'+
              '<button class="action-btn share-btn" data-id="'+s.id+'" data-title="'+escapeHtml(s.title)+'" aria-label="Share this photo">'+
                svgShare+'<span>Share</span>'+
              '</button>'+
            '</div>'+
            '<div class="frame-counter"><b>'+num+'</b> — '+String(total).padStart(2,'0')+'</div>'+
          '</div>'+
        '</div>'+
      '</section>';
    });

    html += ''+
    '<section class="scene finale" aria-label="Contact">'+
      '<div class="frame-img"><img src="'+escapeHtml(about.profile_image_url || 'https://picsum.photos/seed/izrelli-finale/1600/2400')+'" alt="Islem Zrelli" loading="lazy"></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        '<span class="tag">End of the Story — For Now</span>'+
        '<h2>Let\'s Tell the Next One</h2>'+
        '<p class="caption">'+escapeHtml(about.short_bio || 'Available for documentary commissions, environmental campaigns and collaborations across the Mediterranean and beyond.')+'</p>'+
        '<div class="social">'+
          (about.contact_email ? '<a href="mailto:'+escapeHtml(about.contact_email)+'">Email</a>' : '')+
          (about.instagram_url ? '<a href="'+escapeHtml(about.instagram_url)+'" target="_blank" rel="noopener">Instagram</a>' : '')+
          (about.vimeo_url ? '<a href="'+escapeHtml(about.vimeo_url)+'" target="_blank" rel="noopener">Vimeo</a>' : '')+
          (about.journal_url ? '<a href="'+escapeHtml(about.journal_url)+'" target="_blank" rel="noopener">Journal</a>' : '')+
        '</div>'+
        '<p class="signoff">'+escapeHtml(about.name || 'Islem Zrelli')+' — Tunisia</p>'+
      '</div>'+

    scroller.innerHTML = html;

  var ioInstance = null;
  function setupSceneBehavior(){
    var allScenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
    if(ioInstance) ioInstance.disconnect();
    ioInstance = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.55){
          entry.target.classList.add('in-view');
          var slug = entry.target.getAttribute('data-slug');
          if(slug){
            var match = photos.find(function(p){ return p._slug === slug; });
            if(match) updateHeadForPhoto(match);
          } else {
            resetHeadToDefault();
          }
        } else if (entry.intersectionRatio < 0.15) {
          entry.target.classList.remove('in-view');
        }
      });
    }, { root: scroller, threshold:[0, .15, .55, .8] });
    allScenes.forEach(function(s){ ioInstance.observe(s); });
    requestAnimationFrame(function(){ allScenes[0] && allScenes[0].classList.add('in-view'); });

    window._allScenes = allScenes;
  }

  document.getElementById('enterBtn').addEventListener('click', function(){
    scroller.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
    mark.classList.add('show');
    rail.classList.add('show');
  });

  window.addEventListener('scroll', function(){
    if(window.scrollY > window.innerHeight * 0.4){
      mark.classList.add('show');
      rail.classList.add('show');
    }
  }, { passive:true });

  var tickCount = 20;
  var tickHtml = '';
  for(var t=0;t<=tickCount;t++){ tickHtml += '<div class="tick" style="top:'+ (t/tickCount*100) +'%"></div>'; }
  ticks.innerHTML = tickHtml;

  var railTicking = false;
  function updateRail(){
    railTicking = false;
    var max = scroller.scrollHeight - scroller.clientHeight;
    var pct = max > 0 ? scroller.scrollTop / max : 0;
    var trackH = needle.parentElement.clientHeight;
    needle.style.transform = 'translateY(' + (pct * trackH) + 'px)';
  }
  scroller.addEventListener('scroll', function(){
    if(!railTicking){ railTicking = true; requestAnimationFrame(updateRail); }
  }, { passive:true });
  window.addEventListener('resize', updateRail);

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  scroller.addEventListener('click', function(e){
    var likeBtn = e.target.closest('.like-btn');
    if(likeBtn){
      var id = likeBtn.getAttribute('data-id');
      var photo = photos.find(function(p){ return String(p.id) === String(id); });
      if(!photo) return;
      var nowLiked = !liked[id];
      liked[id] = nowLiked;
      setLiked(liked);
      photo.likes = Math.max(0, (photo.likes || 0) + (nowLiked ? 1 : -1));
      likeBtn.classList.toggle('liked', nowLiked);
      likeBtn.setAttribute('aria-pressed', String(nowLiked));
      likeBtn.querySelector('svg').outerHTML = svgHeart(nowLiked);
      likeBtn.querySelector('.like-count').textContent = photo.likes.toLocaleString();
      sb.rpc('increment_photo_likes', { p_id: id, p_delta: nowLiked ? 1 : -1 }).then(function(){}).catch(function(){});
      return;
    }
    var shareBtn = e.target.closest('.share-btn');
    if(shareBtn){
      var sid = shareBtn.getAttribute('data-id');
      var stitle = shareBtn.getAttribute('data-title');
      var sharePhoto = photos.find(function(p){ return String(p.id) === String(sid); });
      var url = sharePhoto ? photoUrl(sharePhoto) : window.location.href;
      sb.rpc('increment_photo_shares', { p_id: sid }).then(function(){}).catch(function(){});
      if(navigator.share){
        navigator.share({ title: 'Islem Zrelli — ' + stitle, url: url }).catch(function(){});
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(url).then(function(){ showToast('Link copied'); });
      } else {
        showToast(url);
      }
    }
  });

  window.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var allScenes = window._allScenes || [];
    var rect = scroller.getBoundingClientRect();
    if(rect.top > window.innerHeight * 0.5) return;
    e.preventDefault();
    var current = allScenes.findIndex(function(s){
      var r = s.getBoundingClientRect();
      return r.top > -10 && r.top < window.innerHeight * 0.5;
    });
    if(current === -1) current = 0;
    var next = e.key === 'ArrowDown' ? Math.min(current+1, allScenes.length-1) : Math.max(current-1, 0);
    allScenes[next] && allScenes[next].scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
  });

  async function loadPublicData(){
    var photosRes = await sb.from('photos').select('*').eq('published', true).order('display_order', { ascending:true });
    photos = photosRes.data || [];
    ensureSlugs(photos);
    var aboutRes = await sb.from('about').select('*').eq('id', 1).single();
    about = aboutRes.data || {};
    renderScenes();
    if(photos.length) injectGalleryLd(photos);
    applyInitialRoute();
  }

  mark.addEventListener('click', function(){
    var now = Date.now();
    clickTimes = clickTimes.filter(function(t){ return now - t < 2000; });
    clickTimes.push(now);
    if(clickTimes.length >= 10){
      clickTimes = [];
      openAdminGate();

  /* ================= ADMIN PANEL ================= */

  var adminOverlay = document.getElementById('adminOverlay');

  var currentAdminTab = 'photos';

  document.getElementById('adminCloseBtn').addEventListener('click', function(){
    adminOverlay.style.display = 'none';
  });
  document.getElementById('exportSitemapBtn').addEventListener('click', async function(){
    await loadAdminPhotos();
    var published = adminPhotos.filter(function(p){ return p.published; });
    ensureSlugs(published);
    var urlEntry = function(loc, priority){
      return '  <url>\n    <loc>' + escapeHtml(loc) + '</loc>\n    <priority>' + priority + '</priority>\n  </url>';
    };
    var lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'];
    lines.push(urlEntry(SITE_URL + '/', '1.0'));
    published.forEach(function(p){ lines.push(urlEntry(photoUrl(p), '0.8')); });
    lines.push('</urlset>');
    var blob = new Blob([lines.join('\n') + '\n'], { type: 'application/xml' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sitemap.xml';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    showToast('sitemap.xml downloaded — commit it to your repo root');
  });
  document.getElementById('adminLogoutBtn').addEventListener('click', async function(){

    renderAdminTab();

  function renderAdminTab(){
    if(currentAdminTab === 'photos') renderPhotosAdmin();
    else renderAboutAdmin();
  }

  async function uploadFile(file){
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    var path = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + (ext || 'jpg');
    var uploadRes = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if(uploadRes.error) throw new Error(uploadRes.error.message);
    var urlRes = sb.storage.from(BUCKET).getPublicUrl(path);
    return urlRes.data.publicUrl;
  }

  /* ---------- Photos tab ---------- */
  var adminPhotos = [];
  var editingPhoto = null;

  async function loadAdminPhotos(){
    var res = await sb.from('photos').select('*').order('display_order', { ascending:true });
    adminPhotos = res.data || [];
  }

  async function renderPhotosAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    await loadAdminPhotos();
    drawPhotosAdmin();
  }

  function blankPhoto(){
    return { title:'', story:'', category:'', location:'', date:'', image_url:'', alt_text:'', featured:false, published:true };
  }

  function drawPhotosAdmin(){
    var html = '';
    if(editingPhoto){
      html += photoFormHtml(editingPhoto);
    } else {
      html += '<div class="admin-toolbar"><button class="admin-btn" id="addPhotoBtn">+ Add Photo</button></div>';
    }

    if(!editingPhoto){
      if(adminPhotos.length === 0){
        html += '<p class="admin-empty">No photos yet — add your first one above.</p>';
      } else {
        html += '<div class="admin-list">';
        adminPhotos.forEach(function(p, i){
          html += ''+
          '<div class="admin-row" data-id="'+p.id+'">'+
            '<img src="'+escapeHtml(p.image_url)+'" alt="">'+
            '<div class="col-title"><strong>'+escapeHtml(p.title)+'</strong><span class="sub">'+escapeHtml(p.category||'')+(p.location?' · '+escapeHtml(p.location):'')+'</span></div>'+
            '<span>'+(p.likes||0).toLocaleString()+' likes</span>'+
            '<span class="status '+(p.published?'on':'off')+'">'+(p.published?'Published':'Hidden')+'</span>'+
            '<div class="admin-row-actions">'+
              '<button data-act="up" '+(i===0?'disabled':'')+'>↑</button>'+
              '<button data-act="down" '+(i===adminPhotos.length-1?'disabled':'')+'>↓</button>'+
              '<button data-act="publish">'+(p.published?'Unpublish':'Publish')+'</button>'+
              '<button data-act="feature">'+(p.featured?'Unfeature':'Feature')+'</button>'+
              '<button data-act="edit">Edit</button>'+
              '<button data-act="delete">Delete</button>'+
            '</div>'+
          '</div>';
        });
        html += '</div>';
      }
    }

    adminScroll.innerHTML = html;

    var addBtn = document.getElementById('addPhotoBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ editingPhoto = blankPhoto(); drawPhotosAdmin(); });

    if(editingPhoto) wirePhotoForm();

    adminScroll.querySelectorAll('.admin-row').forEach(function(row){
      var id = row.getAttribute('data-id');
      var photo = adminPhotos.find(function(p){ return String(p.id) === id; });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var act = btn.getAttribute('data-act');
          if(act === 'edit'){ editingPhoto = Object.assign({}, photo); drawPhotosAdmin(); return; }
          if(act === 'delete'){
            if(!confirm('Delete "'+photo.title+'"? This cannot be undone.')) return;
            await sb.from('photos').delete().eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'publish'){
            await sb.from('photos').update({ published: !photo.published }).eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'feature'){
            await sb.from('photos').update({ featured: !photo.featured }).eq('id', id);
            renderPhotosAdmin();
            return;
          }
          if(act === 'up' || act === 'down'){
            var idx = adminPhotos.findIndex(function(p){ return String(p.id) === id; });
            var swapIdx = act === 'up' ? idx - 1 : idx + 1;
            if(swapIdx < 0 || swapIdx >= adminPhotos.length) return;
            var other = adminPhotos[swapIdx];
            await Promise.all([
              sb.from('photos').update({ display_order: other.display_order }).eq('id', photo.id),
              sb.from('photos').update({ display_order: photo.display_order }).eq('id', other.id)
            ]);
            renderPhotosAdmin();
          }
        });
      });
    });
  }

        '<button class="admin-btn secondary" id="photoCancelBtn">Cancel</button>'+
        '<button class="admin-btn" id="photoSaveBtn">Save</button>'+
      '</div>'+
    '</div>';
  }

  function wirePhotoForm(){
    document.getElementById('photoCancelBtn').addEventListener('click', function(){ editingPhoto = null; drawPhotosAdmin(); });
    document.getElementById('photoFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('photoUploading');
      uploadingEl.style.display = 'inline';
      try{
        var url = await uploadFile(file);
        editingPhoto.image_url = url;
        var preview = document.getElementById('photoPreview');
        preview.src = url;
        preview.style.display = 'block';
      } catch(err){
        showPhotoFormError(err.message);
      } finally {
        uploadingEl.style.display = 'none';
      }
    });
    document.getElementById('photoSaveBtn').addEventListener('click', async function(){
      var payload = {
        title: document.getElementById('f-title').value || 'Untitled',
        story: document.getElementById('f-story').value,
        category: document.getElementById('f-category').value,
        location: document.getElementById('f-location').value,
        date: document.getElementById('f-date').value || null,
        alt_text: document.getElementById('f-alt').value,
        published: document.getElementById('f-published').checked,
        featured: document.getElementById('f-featured').checked,
        image_url: editingPhoto.image_url
      };
      if(!payload.image_url){ showPhotoFormError('Please upload a photo first.'); return; }
      var saveBtn = document.getElementById('photoSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      var result;
      if(editingPhoto.id){
        result = await sb.from('photos').update(payload).eq('id', editingPhoto.id);
      } else {
        var maxOrder = adminPhotos.reduce(function(m,p){ return Math.max(m, p.display_order||0); }, -1);
        payload.display_order = maxOrder + 1;
        result = await sb.from('photos').insert(payload);
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      if(result.error){ showPhotoFormError(result.error.message); return; }
      editingPhoto = null;
      renderPhotosAdmin();
    });
  }

  function showPhotoFormError(msg){
    var el = document.getElementById('photoFormError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* ---------- About tab ---------- */
  async function renderAboutAdmin(){
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    var res = await sb.from('about').select('*').eq('id', 1).single();
    var a = res.data || {};
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>About</h3>'+
      '<div class="admin-field"><label>Profile Photograph</label>'+
        (a.profile_image_url ? '<img class="admin-image-preview" id="aboutPreview" src="'+escapeHtml(a.profile_image_url)+'">' : '<img class="admin-image-preview" id="aboutPreview" style="display:none;">')+
        '<input type="file" accept="image/*" id="aboutFile">'+
        '<span class="admin-uploading" id="aboutUploading" style="display:none;">Uploading…</span>'+
      '</div>'+
      '<div class="admin-field"><label>Name</label><input type="text" id="a-name" value="'+escapeHtml(a.name||'')+'"></div>'+
      '<div class="admin-field"><label>Short Biography</label><textarea id="a-short">'+escapeHtml(a.short_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Longer Biography</label><textarea style="min-height:140px;" id="a-long">'+escapeHtml(a.long_bio||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Areas of Work</label><textarea id="a-areas">'+escapeHtml(a.areas_of_work||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Achievements</label><textarea id="a-achievements">'+escapeHtml(a.achievements||'')+'</textarea></div>'+
      '<div class="admin-field"><label>Festivals / Exhibitions</label><textarea id="a-festivals">'+escapeHtml(a.festivals||'')+'</textarea></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Instagram URL</label><input type="url" id="a-instagram" value="'+escapeHtml(a.instagram_url||'')+'"></div>'+
        '<div class="admin-field"><label>Vimeo URL</label><input type="url" id="a-vimeo" value="'+escapeHtml(a.vimeo_url||'')+'"></div>'+
      '</div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>Journal URL</label><input type="url" id="a-journal" value="'+escapeHtml(a.journal_url||'')+'"></div>'+
        '<div class="admin-field"><label>Contact Email</label><input type="email" id="a-email" value="'+escapeHtml(a.contact_email||'')+'"></div>'+
      '</div>'+
      '<p class="admin-error" id="aboutFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="aboutSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn" id="aboutSaveBtn">Save Changes</button>'+
      '</div>'+
    '</div>';

    var currentImageUrl = a.profile_image_url || '';

    document.getElementById('aboutFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var uploadingEl = document.getElementById('aboutUploading');
      uploadingEl.style.display = 'inline';
      try{
        currentImageUrl = await uploadFile(file);
        var preview = document.getElementById('aboutPreview');
        preview.src = currentImageUrl;
        preview.style.display = 'block';
      } catch(err){
        var el = document.getElementById('aboutFormError');
        el.textContent = err.message; el.style.display = 'block';
      } finally {
        uploadingEl.style.display = 'none';
      }
    });

    document.getElementById('aboutSaveBtn').addEventListener('click', async function(){
      var payload = {
        profile_image_url: currentImageUrl,
        name: document.getElementById('a-name').value,
        short_bio: document.getElementById('a-short').value,
        long_bio: document.getElementById('a-long').value,
        areas_of_work: document.getElementById('a-areas').value,
        achievements: document.getElementById('a-achievements').value,
        festivals: document.getElementById('a-festivals').value,
        instagram_url: document.getElementById('a-instagram').value,
        vimeo_url: document.getElementById('a-vimeo').value,
        journal_url: document.getElementById('a-journal').value,
        contact_email: document.getElementById('a-email').value,
        updated_at: new Date().toISOString()
      };
      var btn = document.getElementById('aboutSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('about').update(payload).eq('id', 1);
      btn.disabled = false; btn.textContent = 'Save Changes';
      var errEl = document.getElementById('aboutFormError');
      var savedEl = document.getElementById('aboutSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
    });
  }

  /* ================= INIT ================= */
  loadPublicData();

})();
</script>
</body>
